name: AI Code Quality Policy
on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".prettierrc.json"
      - ".prettierignore"
      - "docs/AI-CODE-QUALITY.md"
      - "tests/code-quality-policy.test.mjs"
      - ".github/workflows/code-quality-policy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/code-quality-policy.test.mjs
