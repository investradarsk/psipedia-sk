name: MAP V1 Live Production Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/map-production-live-audit.yml"
      - "tests/e2e/map-production-live.spec.ts"
      - "lib/map-query.ts"
      - "components/map/**"
      - "app/mapa/**"
      - "app/api/map/**"
      - "lib/google-maps-consent.ts"
      - "components/google-maps-consent-controls.tsx"
      - "lib/navigation-store.ts"
      - "config/runtime-env.ts"
      - "wrangler.jsonc"
  workflow_dispatch:

concurrency:
  group: map-v1-live-production-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-production-map:
    name: Live production map (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: desktop
            project: desktop-chromium
          - label: mobile-390x844
            project: mobile-chromium
    steps:
      - uses: actions/checkout@v4
      - name: Log revision evidence
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "github_sha=${{ github.sha }}"
          echo "checked_out_sha=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run read-only live production map audit — ${{ matrix.label }}
        env:
          E2E_BASE_URL: https://psipedia.sk
        shell: bash
        run: |
          set +e
          npx playwright test tests/e2e/map-production-live.spec.ts --project="${{ matrix.project }}" --workers=1
          first_status=$?

          if [ "$first_status" -eq 0 ]; then
            exit 0
          fi

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "::warning::Initial live map audit failed immediately after a main push. Waiting 120 seconds for production deployment to settle, then retrying once."
            sleep 120
            rm -rf playwright-report test-results/playwright
            npx playwright test tests/e2e/map-production-live.spec.ts --project="${{ matrix.project }}" --workers=1
            exit $?
          fi

          exit "$first_status"
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: map-v1-live-production-${{ matrix.label }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 14
