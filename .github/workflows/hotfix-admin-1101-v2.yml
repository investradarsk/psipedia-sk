name: Hotfix admin 1101 v2

on:
  push:
    paths:
      - .github/workflows/hotfix-admin-1101-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stop runtime database writes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("lib/article-store.ts")
          text = file.read_text(encoding="utf-8")
          marker = "async function ensureArticleStore(database: D1Database) {\n  if (schemaReady) return schemaReady;"
          replacement = "async function ensureArticleStore(database: D1Database) {\n  // Wrangler applies the schema migrations during deployment. Do not write\n  // schema or seed data while rendering pages; concurrent writes can lock D1.\n  return;\n\n  if (schemaReady) return schemaReady;"
          if marker not in text:
              raise SystemExit("article store marker not found")
          file.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          PY
      - name: Verify build
        run: npm clean-install --progress=false && npm run build
      - name: Commit hotfix
        shell: bash
        run: |
          rm .github/workflows/hotfix-admin-1101-v2.yml
          rm -f .github/workflows/hotfix-admin-1101.yml
          git config user.name "Psipedia deployment bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/article-store.ts .github/workflows
          git commit -m "Fix admin Worker 1101 runtime exception"
          git push
