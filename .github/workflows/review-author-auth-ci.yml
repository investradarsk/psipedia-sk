name: REVIEWS-2A Review Author Authentication

on:
  workflow_call:
    inputs:
      shared_validation:
        description: Caller has passed the same-revision common validation job
        required: false
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: reviews-2a-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  security:
    name: Reviewer auth — security, D1, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Log revision evidence
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "pr_head_sha=${{ github.event.pull_request.head.sha || 'n/a' }}"
          echo "base_sha=${{ github.event.pull_request.base.sha || 'n/a' }}"
          echo "github_sha=${{ github.sha }}"
          echo "checked_out_sha=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Migration safety
        if: inputs.shared_validation != true
        run: npm run db:check-migrations
      - name: REVIEWS-2A reviewer auth tests
        run: npm run test:review-author-auth
      - name: Clean D1 migration chain
        if: inputs.shared_validation != true
        run: npm run db:validate-clean
      - name: Lint
        if: inputs.shared_validation != true
        run: npm run lint
      - name: Build (standalone manual run)
        if: github.event_name != 'pull_request'
        run: npm run build
      - name: Download shared standard build from this run
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: ci-v2-review-standard-${{ github.sha }}
          path: .
      - name: Verify shared standard build revision and integrity
        if: github.event_name == 'pull_request'
        run: node scripts/ci-build-artifact.mjs verify standard

  e2e:
    name: Reviewer auth — desktop/mobile accessibility and security
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
      E2E_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Local build (standalone manual run)
        if: github.event_name != 'pull_request'
        run: npm run build
      - name: Download shared local-e2e build from this run
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: ci-v2-review-local-e2e-${{ github.sha }}
          path: .
      - name: Verify shared local-e2e build revision and integrity
        if: github.event_name == 'pull_request'
        run: node scripts/ci-build-artifact.mjs verify local-e2e
      - name: Configure CI-only local PII keys
        run: |
          PII_ENCRYPTION_KEY="$(node -e 'process.stdout.write(Buffer.from("0123456789abcdef".repeat(2)).toString("base64url"))')"
          PII_HASH_KEY="$(node -e 'process.stdout.write(Buffer.from("fedcba9876543210".repeat(2)).toString("base64url"))')"
          {
            printf 'PII_ENCRYPTION_KEY=%s\n' "$PII_ENCRYPTION_KEY"
            printf 'PII_HASH_KEY=%s\n' "$PII_HASH_KEY"
            printf 'TURNSTILE_SITE_KEY=%s\n' 'review-e2e-site-key'
            printf 'TURNSTILE_SECRET_KEY=%s\n' 'review-e2e-secret-key'
            printf 'PROFILE_REVIEW_SUBMISSIONS_ENABLED=%s\n' 'true'
          } > .dev.vars
      - name: Apply migrations to isolated local D1
        run: bash scripts/review-e2e-local.sh migrate reviews-2a
      # Directory service-text and image presentation tables are intentionally
      # outside the generic migration chain. Both review E2E fixtures use them.
      # Apply only to isolated --local D1, never to production.
      - name: Apply isolated Directory SQL presentation schema
        run: npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file db/isolated/directory_admin_sql_completion.sql
      - name: Seed isolated reviewer auth fixtures
        run: |
          npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/directory-admin-e2e.sql
          npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/review-author-auth-e2e.sql
      - name: Start isolated local app
        run: bash scripts/review-e2e-local.sh start reviews-2a
      - name: Reviewer auth Playwright — desktop
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: .e2e-artifacts/reviews-2a/desktop-report
        run: npm run e2e -- tests/e2e/review-author-auth.spec.ts --project=desktop-chromium --workers=1 --retries=0 --output=.e2e-artifacts/reviews-2a/desktop-results
      - name: Reviewer auth Playwright — mobile
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: .e2e-artifacts/reviews-2a/mobile-report
        run: npm run e2e -- tests/e2e/review-author-auth.spec.ts --project=mobile-chromium --workers=1 --retries=0 --output=.e2e-artifacts/reviews-2a/mobile-results
      - name: Assert auth flow creates no review rows
        run: |
          npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --command "SELECT COUNT(*) AS review_count FROM profile_reviews;" --json > .e2e-artifacts/reviews-2a/profile-review-count.json
          node -e 'const fs=require("node:fs");const data=JSON.parse(fs.readFileSync(".e2e-artifacts/reviews-2a/profile-review-count.json","utf8"));const rows=data.flatMap(x=>x.results||[]);if(rows.length!==1||Number(rows[0].review_count)!==0){console.error(data);process.exit(1)}'
      - name: Stop isolated local app
        if: always()
        run: bash scripts/review-e2e-local.sh stop reviews-2a
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reviews-2a-e2e-${{ github.run_attempt }}
          path: |
            .e2e-artifacts/reviews-2a/
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 14
