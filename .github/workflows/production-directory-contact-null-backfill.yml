name: Directory SQL NULL contacts – controlled backfill

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/directory-contact-null-backfill.mjs"
      - "scripts/production-directory-contact-null-backfill.mjs"
      - "tests/directory-contact-null-backfill.test.mjs"
      - ".github/workflows/production-directory-contact-null-backfill.yml"
      - "docs/audits/DIRECTORY-CONTACT-NULL-BACKFILL.md"
  workflow_dispatch:
    inputs:
      mode:
        description: "audit (SELECT-only) or apply (fills SQL NULL only)"
        type: choice
        options:
          - audit
          - apply
        default: audit
        required: true
      confirmation:
        description: "AUDIT-DIRECTORY-NULL-CONTACTS-psipedia-sk-db or APPLY-DIRECTORY-NULL-CONTACTS-psipedia-sk-db"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('directory-null-contacts-pr-{0}', github.event.pull_request.number) || 'production-d1-migration' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    name: Directory contact SQL contract – no D1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - name: Verify idempotence, clears, locks, aliases and report privacy
        run: node --test tests/directory-contact-null-backfill.test.mjs

  production:
    if: github.event_name == 'workflow_dispatch'
    needs: offline
    name: Protected D1 contact audit / owner-approved NULL-only apply
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      DIRECTORY_CONTACT_BACKFILL_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Require manual main run and exact typed confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "investradarsk/psipedia-sk"
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$CLOUDFLARE_API_TOKEN"
          case "${{ inputs.mode }}" in
            audit) expected="AUDIT-DIRECTORY-NULL-CONTACTS-psipedia-sk-db" ;;
            apply) expected="APPLY-DIRECTORY-NULL-CONTACTS-psipedia-sk-db" ;;
            *) exit 1 ;;
          esac
          test "$DIRECTORY_CONTACT_BACKFILL_CONFIRMATION" = "$expected"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Reject stale main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Install locked Wrangler and dependencies
        run: npm ci
      - name: Pin canonical Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          account="$(node -e 'process.stdout.write(require("./config/cloudflare-resources.json").account_id || "")')"
          test -n "$account"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
      - name: Run selected D1 audit or guarded update
        run: node scripts/production-directory-contact-null-backfill.mjs "${{ inputs.mode }}"
      - name: Preserve counts and recovery bookmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directory-contact-null-backfill-${{ github.run_id }}
          path: .directory-contact-null-backfill/report.json
          if-no-files-found: ignore
          retention-days: 30
