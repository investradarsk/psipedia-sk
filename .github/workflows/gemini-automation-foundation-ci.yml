name: Gemini automation foundation contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "app/admin/automatizacie-gemini/**"
      - "app/api/admin/gemini-automation/**"
      - "components/admin-gemini-automation*"
      - "lib/admin-navigation.ts"
      - "components/admin-navigation.tsx"
      - "lib/gemini-automation-*.ts"
      - "tests/gemini-automation-*.test.mjs"
      - "drizzle/0113_gemini_automation_foundation.sql"
      - "drizzle/0114_gemini_dedupe.sql"
      - "config/runtime-env.ts"
      - ".env.example"
      - "scripts/ci-scope.mjs"
      - ".github/workflows/gemini-automation-foundation-ci.yml"

permissions:
  contents: read

concurrency:
  group: gemini-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Isolated Gemini foundation contract and migration safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Gemini foundation focused tests (network mocked)
        run: node --experimental-strip-types --test tests/gemini-automation-*.test.mjs
      - name: Runtime secret contract
        run: npm run test:config
      - name: Migration safety
        run: npm run test:migration-safety
      - name: CI scope contract
        run: node scripts/check-ci-scope.mjs
