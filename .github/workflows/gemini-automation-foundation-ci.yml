name: Gemini automation foundation contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "app/admin/automatizacie-gemini/**"
      - "app/api/admin/gemini-automation/**"
      - "components/admin-gemini-automation*"
      - "components/admin-gemini-event-concept-review.tsx"
      - "lib/admin-navigation.ts"
      - "components/admin-navigation.tsx"
      - "lib/gemini-automation-*.ts"
      - "lib/gemini-external-agent.ts"
      - "lib/gemini-notion-*.ts"
      - "lib/notion-directory-sync.ts"
      - "scripts/gemini-notion-*.mjs"
      - "tests/gemini-notion-*.test.mjs"
      - "drizzle/0124_gemini_notion_review_locks.sql"
      - "drizzle/0127_gemini_notion_created_pages.sql"
      - "tests/gemini-notion-provenance.test.mjs"
      - "tests/gemini-notion-canonical-drafts.test.mjs"
      - "tests/production-d1-0127-readonly.test.mjs"
      - "scripts/production-d1-0127-readonly.mjs"
      - ".github/workflows/production-d1-0127-readonly.yml"
      - "components/admin-gemini-notion-*.tsx"
      - "tests/gemini-notion-drafts.test.mjs"
      - "scripts/gemini-notion-agent.mjs"
      - "scripts/gemini-interactions-contract.mjs"
      - "tests/gemini-external-worker-offline.test.mjs"
      - "tests/fixtures/gemini-external-agent-fetch-mock.mjs"
      - "app/api/internal/gemini-agent/**"
      - ".github/workflows/gemini-notion-agent.yml"
      - "tests/gemini-external-agent.test.mjs"
      - "lib/gemini-external-agent.ts"
      - "app/api/internal/gemini-agent/**"
      - "scripts/gemini-notion-agent.mjs"
      - ".github/workflows/gemini-notion-agent.yml"
      - "tests/gemini-external-agent.test.mjs"
      - "tests/gemini-automation-*.test.mjs"
      - "tests/gemini-events-*.test.mjs"
      - "drizzle/0113_gemini_automation_foundation.sql"
      - "drizzle/0114_gemini_dedupe.sql"
      - "drizzle/0115_gemini_notion_bridge.sql"
      - "drizzle/0117_gemini_events_rejections.sql"
      - "wrangler.jsonc"
      - "config/runtime-env.ts"
      - ".env.example"
      - "scripts/ci-scope.mjs"
      - ".github/workflows/gemini-automation-foundation-ci.yml"

permissions:
  contents: read

concurrency:
  group: gemini-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Isolated Gemini foundation contract and migration safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Gemini foundation focused tests (network mocked)
        run: node --experimental-strip-types --test tests/gemini-automation-*.test.mjs tests/gemini-events-*.test.mjs tests/gemini-external-agent.test.mjs
      - name: External Gemini agent contracts (no network or paid API)
        run: node --experimental-strip-types --test tests/gemini-external-agent.test.mjs tests/gemini-external-worker-offline.test.mjs tests/gemini-notion-events-help-fields.test.mjs tests/gemini-notion-provenance.test.mjs
      - name: Trusted Gemini-to-canonical draft adapters (12 agendas, no external calls)
        run: node --experimental-strip-types --test tests/gemini-notion-canonical-drafts.test.mjs
      - name: Production D1 0127 read-only preflight/postflight simulation
        run: node --test tests/production-d1-0127-readonly.test.mjs
      - name: Notion category review contracts (mocked, no paid calls)
        run: node --experimental-strip-types --experimental-loader ./tests/admin-events-loader.mjs --test tests/gemini-notion-drafts.test.mjs tests/gemini-notion-agenda-review.test.mjs tests/gemini-notion-identity.test.mjs tests/gemini-notion-lock.test.mjs tests/notion-directory-sync.test.mjs
      - name: Gemini review API authorization
        run: node --experimental-strip-types --experimental-loader ./tests/gemini-notion-api-loader.mjs --test tests/gemini-notion-api.test.mjs
      - name: Install Chromium for isolated admin UI test
        run: npx playwright install --with-deps chromium
      - name: Gemini modal desktop and mobile (mocked API only)
        run: node --test tests/gemini-notion-review-ui.test.mjs
      - name: External worker syntax
        run: node --check scripts/gemini-notion-agent.mjs
      - name: External worker lint
        run: npx eslint lib/gemini-external-agent.ts lib/gemini-notion-provenance.ts app/api/internal/gemini-agent/callback/route.ts scripts/gemini-notion-agent.mjs
      - name: Targeted Gemini admin lint coverage
        run: npx eslint app/admin/automatizacie-gemini/page.tsx app/api/admin/gemini-automation components/admin-gemini-automation-settings.tsx lib/gemini-automation-pilot.ts lib/gemini-automation-store.ts lib/gemini-automation-admin-store.ts
      - name: Gemini review, rejection and canonical lifecycle lint
        run: npx eslint app/admin/automatizacie-gemini app/api/admin/gemini-automation components/admin-gemini-concept-review.tsx lib/gemini-automation-concept-review.ts lib/gemini-automation-dedupe-store.ts lib/directory-store.ts
      - name: Gemini Event contract, canonical and review lint
        run: npx eslint lib/gemini-automation-event-*.ts lib/notion-events-help-adapters.ts lib/notion-events-help-sync.ts lib/gemini-notion-agenda-review.ts components/admin-gemini-event-concept-review.tsx components/admin-gemini-agenda-draft-editor.tsx
      - name: Agent JavaScript syntax (without executing or billing)
        run: node --check scripts/gemini-notion-agent.mjs
      - name: Production build and typecheck
        run: npm run build
      - name: Runtime secret contract
        run: npm run test:config
      - name: Migration safety
        run: npm run test:migration-safety
      - name: CI scope contract
        run: node scripts/check-ci-scope.mjs
