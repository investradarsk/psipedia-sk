name: Admin visual foundation, controls and shell contracts (read-only)

on:
  pull_request:
    branches: [main]
    paths:
      - "app/admin/admin-editorial-foundation.css"
      - "app/admin/admin-list-foundation.css"
      - "app/admin/layout.tsx"
      - "app/admin/admin-workspace.css"
      - "app/admin/admin-unified-forms.css"
      - "app/admin/admin-legacy-scoped.css"
      - "app/admin/admin-root-extracted.css"
      - "components/admin-editor-workspace.module.css"
      - "components/admin-workspace-dashboard.module.css"
      - "components/admin-shell.module.css"
      - "components/admin-interaction-system.module.css"
      - "components/admin-form-feedback.module.css"
      - "components/admin-shadcn-editor.module.css"
      - "components/admin-interaction-system.tsx"
      - "components/admin-navigation.module.css"
      - "components/admin-quick-navigation.module.css"
      - "components/admin-tour-button.module.css"
      - "components/admin-article-dashboard.module.css"
      - "components/admin-breed-dashboard.module.css"
      - "components/admin-breed-dashboard.tsx"
      - "components/admin-event-dashboard.tsx"
      - "components/admin-event-dashboard.module.css"
      - "components/admin-directory-dashboard.tsx"
      - "components/admin-directory-dashboard.module.css"
      - "components/admin-pagination.tsx"
      - "components/admin-record-table.module.css"
      - "tests/e2e/admin-mobile-stability-step7.spec.ts"
      - "components/admin-breed-editor.module.css"
      - "components/admin-reviews-hub.module.css"
      - "components/admin-breed-editor.tsx"
      - "components/admin-breed-dashboard.tsx"
      - "components/admin-reviews-hub.tsx"
      - "components/admin-editor-workspace.tsx"
      - "app/admin/recenzie-profilov/page.tsx"
      - "app/admin/recenzie-profilov/[id]/page.tsx"
      - "lib/admin-profile-review-labels.ts"
      - "components/admin-record-table.module.css"
      - "components/admin-tiptap-article-editor.module.css"
      - "components/admin-dashboard.tsx"
      - "components/admin-record-table.tsx"
      - "components/admin-tiptap-article-editor.tsx"
      - "components/admin-article-editor.tsx"
      - "components/admin-workspace-dashboard.tsx"
      - "components/admin-workspace-dashboard.module.css"
      - "components/admin-workspace-activity.tsx"
      - "tests/e2e/article-admin-editor.spec.ts"
      - "tests/e2e/admin-work-audit-round2.spec.ts"
      - "components/admin-shell.tsx"
      - "components/admin-navigation.tsx"
      - "tests/e2e/admin-ia-2.spec.ts"
      - "components/admin-form-feedback.tsx"
      - "components/admin-content-editor-v3.module.css"
      - "components/admin-facebook-graphic-editor.module.css"
      - "lib/admin-navigation.ts"
      - "docs/audits/admin-ui-unification-inventory.json"
      - "tests/admin-typography-step3.test.mjs"
      - "tests/admin-density-step4.test.mjs"
      - "tests/admin-controls-step5.test.mjs"
      - "tests/admin-shell-step6.test.mjs"
      - "tests/admin-work-audit-step7.test.mjs"
      - "tests/admin-work-audit-round2.test.mjs"
      - "tests/admin-mobile-stability-step7.test.mjs"
      - "tests/admin-list-foundation-step8.test.mjs"
      - "tests/e2e/admin-list-foundation-step8.spec.ts"
      - "tests/reviews-admin-hub.test.mjs"
      - "tests/admin-editor-breed-single-section-step7.test.mjs"
      - "tests/admin-workspace-overview-performance.test.mjs"
      - "tests/admin-workspace-notifications-v2.test.mjs"
      - "tests/admin-editor-article-single-section-step8.test.mjs"
      - "tests/admin-ui-unification-inventory.test.mjs"
      - ".github/workflows/admin-typography-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-typography-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Check admin typography, mobile stability, lists, controls and 28-route inventory
        run: node --test tests/admin-typography-step3.test.mjs tests/admin-density-step4.test.mjs tests/admin-controls-step5.test.mjs tests/admin-shell-step6.test.mjs tests/admin-work-audit-step7.test.mjs tests/admin-work-audit-round2.test.mjs tests/admin-mobile-stability-step7.test.mjs tests/admin-list-foundation-step8.test.mjs tests/reviews-admin-hub.test.mjs tests/admin-editor-breed-single-section-step7.test.mjs tests/admin-workspace-overview-performance.test.mjs tests/admin-workspace-notifications-v2.test.mjs tests/admin-editor-article-single-section-step8.test.mjs tests/admin-unified-ui-foundation.test.mjs tests/admin-editor-form-controls-step4.test.mjs tests/admin-ui-unification-inventory.test.mjs
