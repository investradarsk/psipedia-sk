name: SERVICE-CATALOG-CONTRACT-1
on:
  pull_request:
    paths:
      - "lib/service-catalog-contract.ts"
      - "lib/service-option-governance-contract.ts"
      - "lib/service-catalog-admin-store.ts"
      - "lib/service-catalog-admin-lifecycle.ts"
      - "lib/service-catalog-admin-api-contract.ts"
      - "app/api/admin/service-catalog/**"
      - "app/api/admin/directory/**/service-options/**"
      - "drizzle/0133_services_canonical_admin_foundation.sql"
      - "drizzle/0134_services_admin_change_audit.sql"
      - "tests/service-catalog-d1-foundation.test.mjs"
      - "tests/service-catalog-admin-api-contract.test.mjs"
      - "tests/service-catalog-admin-lifecycle.test.mjs"
      - "tests/service-catalog-admin-editor.test.mjs"
      - "docs/services-v3-admin-api-phase-3a.md"
      - "docs/services-v3-admin-lifecycle-phase-3c.md"
      - "docs/SERVICES-V3-PHASE2-D1-ADMIN.md"
      - "lib/directory-filter-contract.ts"
      - "tests/service-catalog-contract.test.mjs"
      - "docs/SERVICE-CATALOG-V0.2-PHASE1.md"
      - "docs/SERVICE-CATALOG-V0.3-PHASE1.md"
      - ".github/workflows/service-catalog-contract-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-catalog-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Validate catalog and legacy 21-facet contract
        run: node --experimental-strip-types --test tests/service-catalog-contract.test.mjs tests/directory-filter-contract.test.mjs tests/service-catalog-d1-foundation.test.mjs tests/service-catalog-admin-api-contract.test.mjs tests/service-catalog-admin-lifecycle.test.mjs tests/service-catalog-admin-editor.test.mjs
