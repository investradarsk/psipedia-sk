name: Directory hard-delete legacy JSON

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/directory-legacy-json-purge.mjs"
      - "scripts/production-directory-legacy-json-purge.mjs"
      - "tests/directory-legacy-json-purge.test.mjs"
      - ".github/workflows/production-directory-legacy-json-purge.yml"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Explicit owner approval: delete historical Directory JSON payloads, accept missing editorial data"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: production-d1-migration
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - run: node --test tests/directory-legacy-json-purge.test.mjs

  purge:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      DIRECTORY_JSON_PURGE_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject stale branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - name: Bind canonical Cloudflare account
        run: echo "CLOUDFLARE_ACCOUNT_ID=$(node -p 'require("./config/cloudflare-resources.json").account_id')" >> "$GITHUB_ENV"
      - name: Delete legacy JSON editorial payloads in D1
        run: node scripts/production-directory-legacy-json-purge.mjs apply
