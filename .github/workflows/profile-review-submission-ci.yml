name: REVIEWS-2B Review Submission

on:
  pull_request:
    branches: [main]
    paths:
      - "app/recenzia/**"
      - "app/api/review-author/reviews/**"
      - "components/profile-review-section.tsx"
      - "components/profile-review-submission-form.tsx"
      - "components/profile-review-submission-form.module.css"
      - "config/runtime-env.ts"
      - "lib/profile-review-domain.ts"
      - "lib/profile-review-read.ts"
      - "lib/profile-review-submission.ts"
      - "lib/review-author-auth.ts"
      - "lib/review-author-auth-store.ts"
      - "lib/review-author-return-to.ts"
      - "lib/review-author-security.ts"
      - "lib/submission-feature-flags.ts"
      - "lib/submission-security.ts"
      - "lib/turnstile.ts"
      - "lib/rate-limit.ts"
      - "tests/profile-review-submission.test.mjs"
      - "tests/review-author-auth.test.mjs"
      - "tests/profile-review-read.test.mjs"
      - "tests/e2e/profile-review-submission.spec.ts"
      - "tests/e2e/review-author-auth.spec.ts"
      - "tests/fixtures/profile-review-submission-e2e.sql"
      - ".github/workflows/profile-review-submission-ci.yml"
  workflow_dispatch:

concurrency:
  group: reviews-2b-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validation:
    name: Review submission — security, D1, regressions, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Log revision evidence
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "pr_head_sha=${{ github.event.pull_request.head.sha || 'n/a' }}"
          echo "base_sha=${{ github.event.pull_request.base.sha || 'n/a' }}"
          echo "github_sha=${{ github.sha }}"
          echo "checked_out_sha=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Migration safety
        run: npm run db:check-migrations
      - name: REVIEWS-2B unit and D1 integration
        run: npm run test:reviews-submission
      - name: Reviewer auth regression
        run: npm run test:review-author-auth
      - name: Public read VISIBLE-only regression
        run: npm run test:reviews-public-read
      - name: Clean D1 migration chain
        run: npm run db:validate-clean
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  e2e:
    name: Review submission — desktop/mobile accessibility and security
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
      E2E_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Configure CI-only local PII keys and isolated review runtime
        run: |
          PII_ENCRYPTION_KEY="$(node -e 'process.stdout.write(Buffer.from("0123456789abcdef".repeat(2)).toString("base64url"))')"
          PII_HASH_KEY="$(node -e 'process.stdout.write(Buffer.from("fedcba9876543210".repeat(2)).toString("base64url"))')"
          {
            printf 'PII_ENCRYPTION_KEY=%s\n' "$PII_ENCRYPTION_KEY"
            printf 'PII_HASH_KEY=%s\n' "$PII_HASH_KEY"
            printf 'TURNSTILE_SITE_KEY=%s\n' 'reviews-2b-site-key'
            printf 'TURNSTILE_SECRET_KEY=%s\n' 'reviews-2b-secret-key'
            printf 'PROFILE_REVIEW_SUBMISSIONS_ENABLED=%s\n' 'true'
          } > .dev.vars
      - name: Apply migrations to isolated local D1
        run: |
          mv drizzle/0038_adoption_staging_data.sql /tmp/0038_adoption_staging_data.sql
          mv drizzle/0039_activate_canonical_adoptions.sql /tmp/0039_activate_canonical_adoptions.sql
          trap 'mv /tmp/0038_adoption_staging_data.sql drizzle/0038_adoption_staging_data.sql; mv /tmp/0039_activate_canonical_adoptions.sql drizzle/0039_activate_canonical_adoptions.sql' EXIT
          npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to .wrangler/state
      - name: Seed isolated review submission fixtures
        run: |
          npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/directory-admin-e2e.sql
          npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/profile-review-submission-e2e.sql
      - name: Start isolated local app
        run: |
          mkdir -p .e2e-artifacts/reviews-2b
          nohup npm exec vite -- --host 127.0.0.1 > .e2e-artifacts/reviews-2b/server.log 2>&1 &
          echo $! > .e2e-artifacts/reviews-2b/server.pid
          ready=0
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://localhost:5173/recenzia/napisat?resourceId=reviews-2b-directory-resource >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -200 .e2e-artifacts/reviews-2b/server.log
            exit 1
          fi
      - name: REVIEWS-2B Playwright — desktop
        run: npm run e2e -- tests/e2e/profile-review-submission.spec.ts --project=desktop-chromium --workers=1 --retries=0
      - name: REVIEWS-2B Playwright — mobile
        run: npm run e2e -- tests/e2e/profile-review-submission.spec.ts --project=mobile-chromium --workers=1 --retries=0
      - name: Assert browser flow did not publish review fixtures
        run: |
          mkdir -p .e2e-artifacts/reviews-2b
          npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --command "SELECT status, COUNT(*) AS count FROM profile_reviews GROUP BY status ORDER BY status;" --json > .e2e-artifacts/reviews-2b/review-status-counts.json
          node -e 'const fs=require("node:fs");const data=JSON.parse(fs.readFileSync(".e2e-artifacts/reviews-2b/review-status-counts.json","utf8"));const rows=data.flatMap(x=>x.results||[]);const visible=rows.find(x=>x.status==="VISIBLE");if(visible && Number(visible.count)!==0){console.error(data);process.exit(1)}'
      - name: Stop isolated local app
        if: always()
        run: |
          if [ -f .e2e-artifacts/reviews-2b/server.pid ]; then
            kill "$(cat .e2e-artifacts/reviews-2b/server.pid)" 2>/dev/null || true
          fi
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reviews-2b-e2e-${{ github.run_attempt }}
          path: |
            .e2e-artifacts/reviews-2b/
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 14
