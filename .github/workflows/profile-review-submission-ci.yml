name: REVIEWS-2B Review Submission

on:
  pull_request:
    branches: [main]
    paths:
      - "app/recenzia/**"
      - "app/api/review-author/reviews/**"
      - "components/profile-review-section.tsx"
      - "components/profile-review-submission-form.tsx"
      - "components/profile-review-submission-form.module.css"
      - "lib/profile-review-domain.ts"
      - "lib/profile-review-read.ts"
      - "lib/profile-review-submission.ts"
      - "lib/review-author-auth.ts"
      - "lib/review-author-auth-store.ts"
      - "lib/review-author-return-to.ts"
      - "lib/review-author-security.ts"
      - "lib/submission-feature-flags.ts"
      - "lib/submission-security.ts"
      - "lib/turnstile.ts"
      - "lib/rate-limit.ts"
      - "tests/profile-review-submission.test.mjs"
      - "tests/review-author-auth.test.mjs"
      - "tests/profile-review-read.test.mjs"
      - "tests/e2e/profile-review-submission.spec.ts"
      - "tests/e2e/review-author-auth.spec.ts"
      - "tests/fixtures/profile-review-submission-e2e.sql"
      - ".github/workflows/profile-review-submission-ci.yml"
      - "app/api/review-author/**"
      - "components/review-author-*"
      - "components/profile-review-section.module.css"
      - "components/cookie-consent.tsx"
      - "components/programmatic-ad-loader.tsx"
      - "lib/review-author-*"
      - "lib/resource-access.ts"
      - "lib/resource-access-store.ts"
      - "lib/pii-crypto.ts"
      - "tests/fixtures/review-author-auth-e2e.sql"
      - ".github/workflows/review-author-auth-ci.yml"
      - "scripts/ci-build-artifact.mjs"
      - "tests/ci-v2-shared-build.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "scripts/build-verified.sh"
      - "scripts/validate-deploy-artifact.mjs"
      - "scripts/ci-scope.mjs"
      - "tests/ci-v2-scope.test.mjs"
      - "tests/fixtures/directory-admin-e2e.sql"
      - "db/isolated/directory_admin_sql_completion.sql"
      - "tests/ci-v2-review-e2e.test.mjs"
      - "tests/ci-v2-result-gate.test.mjs"
      - "scripts/ci-result-gate.mjs"
      - "scripts/review-e2e-local.sh"
  workflow_dispatch:

concurrency:
  group: reviews-2b-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    name: Select review regression scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      review_auth: ${{ steps.scope.outputs.review_auth }}
      review_submission: ${{ steps.scope.outputs.review_submission }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - id: scope
        env:
          CI_SCOPE_EVENT_NAME: ${{ github.event_name }}
          CI_SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_SCOPE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-scope.mjs --github-output

  shared-build:
    needs: scope
    if: needs.scope.outputs.review_auth == 'true' || needs.scope.outputs.review_submission == 'true'
    name: Shared review build (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, local-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Standard build
        if: matrix.profile == 'standard'
        run: npm run build
      - name: Isolated local E2E build
        if: matrix.profile == 'local-e2e'
        env:
          PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
          E2E_BASE_URL: http://localhost:5173
        run: npm run build
      - name: Record standard build identity
        if: matrix.profile == 'standard'
        run: node scripts/ci-build-artifact.mjs record standard
      - name: Record local E2E build identity
        if: matrix.profile == 'local-e2e'
        env:
          PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
          E2E_BASE_URL: http://localhost:5173
        run: node scripts/ci-build-artifact.mjs record local-e2e
      - name: Publish verified build from this run
        uses: actions/upload-artifact@v4
        with:
          name: ci-v2-review-${{ matrix.profile }}-${{ github.sha }}
          path: |
            dist/
            lib/generated/component-registry.json
            ci-v2-build-identity.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 2

  reviewer-auth:
    name: Reviewer authentication
    if: needs.scope.outputs.review_auth == 'true'
    needs: [scope, shared-build]
    uses: ./.github/workflows/review-author-auth-ci.yml

  validation:
    needs: [scope, shared-build]
    if: needs.scope.outputs.review_submission == 'true'
    name: Review submission — security, D1, regressions, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Log revision evidence
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "pr_head_sha=${{ github.event.pull_request.head.sha || 'n/a' }}"
          echo "base_sha=${{ github.event.pull_request.base.sha || 'n/a' }}"
          echo "github_sha=${{ github.sha }}"
          echo "checked_out_sha=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Migration safety
        run: npm run db:check-migrations
      - name: REVIEWS-2B unit and D1 integration
        run: npm run test:reviews-submission
      - name: Reviewer auth regression
        run: npm run test:review-author-auth
      - name: Public read VISIBLE-only regression
        run: npm run test:reviews-public-read
      - name: Clean D1 migration chain
        run: npm run db:validate-clean
      - name: Lint
        run: npm run lint
      - name: Download shared standard build from this run
        uses: actions/download-artifact@v4
        with:
          name: ci-v2-review-standard-${{ github.sha }}
          path: .
      - name: Verify shared standard build revision and integrity
        run: node scripts/ci-build-artifact.mjs verify standard

  e2e:
    name: Review submission — desktop/mobile accessibility and security
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
      E2E_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Download shared local-e2e build from this run
        uses: actions/download-artifact@v4
        with:
          name: ci-v2-review-local-e2e-${{ github.sha }}
          path: .
      - name: Verify shared local-e2e build revision and integrity
        run: node scripts/ci-build-artifact.mjs verify local-e2e
      - name: Configure CI-only local PII keys and isolated review runtime
        run: |
          PII_ENCRYPTION_KEY="$(node -e 'process.stdout.write(Buffer.from("0123456789abcdef".repeat(2)).toString("base64url"))')"
          PII_HASH_KEY="$(node -e 'process.stdout.write(Buffer.from("fedcba9876543210".repeat(2)).toString("base64url"))')"
          {
            printf 'PII_ENCRYPTION_KEY=%s\n' "$PII_ENCRYPTION_KEY"
            printf 'PII_HASH_KEY=%s\n' "$PII_HASH_KEY"
            printf 'TURNSTILE_SITE_KEY=%s\n' 'reviews-2b-site-key'
            printf 'TURNSTILE_SECRET_KEY=%s\n' 'reviews-2b-secret-key'
            printf 'PROFILE_REVIEW_SUBMISSIONS_ENABLED=%s\n' 'true'
          } > .dev.vars
      - name: Apply migrations to isolated local D1
        run: bash scripts/review-e2e-local.sh migrate reviews-2b
      # Directory service-text and image presentation tables are intentionally
      # outside the generic migration chain. Both review E2E fixtures use them.
      # Apply only to isolated --local D1, never to production.
      - name: Apply isolated Directory SQL presentation schema
        run: npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file db/isolated/directory_admin_sql_completion.sql
      - name: Seed isolated review submission fixtures
        run: |
          npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/directory-admin-e2e.sql
          npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/profile-review-submission-e2e.sql
      - name: Start isolated local app
        run: bash scripts/review-e2e-local.sh start reviews-2b
      - name: REVIEWS-2B Playwright — desktop
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: .e2e-artifacts/reviews-2b/desktop-report
        run: npm run e2e -- tests/e2e/profile-review-submission.spec.ts --project=desktop-chromium --workers=1 --retries=0 --output=.e2e-artifacts/reviews-2b/desktop-results
      - name: REVIEWS-2B Playwright — mobile
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: .e2e-artifacts/reviews-2b/mobile-report
        run: npm run e2e -- tests/e2e/profile-review-submission.spec.ts --project=mobile-chromium --workers=1 --retries=0 --output=.e2e-artifacts/reviews-2b/mobile-results
      - name: Assert browser flow did not publish review fixtures
        run: |
          mkdir -p .e2e-artifacts/reviews-2b
          npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --command "SELECT status, COUNT(*) AS count FROM profile_reviews GROUP BY status ORDER BY status;" --json > .e2e-artifacts/reviews-2b/review-status-counts.json
          node -e 'const fs=require("node:fs");const data=JSON.parse(fs.readFileSync(".e2e-artifacts/reviews-2b/review-status-counts.json","utf8"));const rows=data.flatMap(x=>x.results||[]);const visible=rows.find(x=>x.status==="VISIBLE");if(visible && Number(visible.count)!==0){console.error(data);process.exit(1)}'
      - name: Stop isolated local app
        if: always()
        run: bash scripts/review-e2e-local.sh stop reviews-2b
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reviews-2b-e2e-${{ github.run_attempt }}
          path: |
            .e2e-artifacts/reviews-2b/
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 14

  review-result:
    name: Review CI selected suites
    needs: [scope, shared-build, reviewer-auth, validation, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Evaluate selected job outcomes and publish CI summary
        env:
          CI_GATE_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-result-gate.mjs reviews
