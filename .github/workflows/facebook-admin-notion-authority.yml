name: Facebook admin Notion authority validation
on:
  pull_request:
    paths:
      - "lib/notion-facebook-images-admin-export.ts"
      - "lib/notion-facebook-images-model.ts"
      - "lib/facebook-image-publisher.ts"
      - "lib/facebook-image-store.ts"
      - "lib/facebook-image-trash.ts"
      - "app/api/admin/facebook-images/**"
      - "db/facebook-image-schema.ts"
      - "drizzle/0132_facebook_image_direct_consent.sql"
      - "tests/facebook-image-publisher.test.mjs"
      - "tests/facebook-image-admin-v2.test.mjs"
      - "tests/notion-facebook-images-integration.test.mjs"
      - "lib/notion-facebook-images-sync.ts"
      - "components/admin-facebook-images.tsx"
      - "components/admin-facebook-images.module.css"
      - "tests/facebook-image-ui.test.mjs"
      - "tests/notion-facebook-images-admin-export.test.mjs"
      - "package.json"
      - ".github/workflows/facebook-admin-notion-authority.yml"
  workflow_dispatch:
concurrency:
  group: facebook-admin-notion-authority-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  notion-admin-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate V4 STOP, owner consent, permanent delete and Notion reconciliation
        run: npm run test:facebook-publisher && npm run test:facebook-admin-v2 && npm run test:notion-facebook-images
      - name: Validate additive migration policy
        run: npm run db:check-migrations
      - name: Install Chromium for Facebook desktop and mobile UI acceptance
        run: npx playwright install --with-deps chromium
      - name: Facebook images compact UI — desktop 1440 and mobile 390/320
        run: npm run test:facebook-images-ui
      - name: Upload Facebook images desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-images-ui-v4-${{ github.sha }}
          path: outputs/facebook-image-ui/*.png
          if-no-files-found: warn
          retention-days: 7
