name: AI-INTERNAL-DISCOVERY-CLICK-VALUE-1 validation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ai-internal-discovery-click-value-ci.yml"

permissions:
  contents: read

concurrency:
  group: ai-internal-discovery-click-value-1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Discovery contracts, lint, build and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run test:internal-discovery
      - run: npm run test:directory-ai-landings-scale
      - run: npm run test:breeding-station-ai-landings
      - run: npm run test:sitewide-ai-entity-surface
      - run: npm run test:seo-structured-data
      - run: npm run test:article-ux
      - run: npm run lint
      - run: npm run build
      - name: Rendered HTML and sitemap regression
        run: node --experimental-strip-types --experimental-loader ./tests/cloudflare-loader.mjs --test tests/rendered-html.test.mjs tests/sitemap-seo.test.mjs

  playwright:
    name: Discovery Playwright — desktop/mobile
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_BASE_URL: http://localhost:5173
      PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
      LOST_FOUND_SUBMISSIONS_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Configure CI-only local PII keys
        run: |
          PII_ENCRYPTION_KEY="$(node -e 'process.stdout.write(Buffer.from("0123456789abcdef".repeat(2)).toString("base64url"))')"
          PII_HASH_KEY="$(node -e 'process.stdout.write(Buffer.from("fedcba9876543210".repeat(2)).toString("base64url"))')"
          {
            printf 'PII_ENCRYPTION_KEY=%s\n' "$PII_ENCRYPTION_KEY"
            printf 'PII_HASH_KEY=%s\n' "$PII_HASH_KEY"
            printf '%s\n' "TURNSTILE_SITE_KEY=1x00000000000000000000AA"
            printf '%s\n' "PSIPEDIA_E2E_LOCAL_BOOTSTRAP=1"
            printf '%s\n' "LOST_FOUND_SUBMISSIONS_ENABLED=1"
          } > .dev.vars
      - name: Apply foundation migrations to isolated local D1 only
        run: |
          mv drizzle/0038_adoption_staging_data.sql /tmp/0038_adoption_staging_data.sql
          mv drizzle/0039_activate_canonical_adoptions.sql /tmp/0039_activate_canonical_adoptions.sql
          trap 'mv /tmp/0038_adoption_staging_data.sql drizzle/0038_adoption_staging_data.sql; mv /tmp/0039_activate_canonical_adoptions.sql drizzle/0039_activate_canonical_adoptions.sql' EXIT
          npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to .wrangler/state
      - name: Seed adoption staging prerequisites
        run: node --experimental-strip-types scripts/bootstrap-adoption-staging-ci.mjs
      - name: Apply canonical adoption migrations
        run: npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to .wrangler/state
      - name: Verify canonical adoption activation
        run: node --experimental-strip-types scripts/bootstrap-adoption-staging-ci.mjs verify
      - name: Seed pre-start public fixtures
        run: |
          npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/help-detail-e2e.sql
          npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/directory-admin-e2e.sql
      - name: Prepare deterministic breed assets
        run: node scripts/bootstrap-breed-e2e.mjs prepare
      - name: Start isolated local app
        run: |
          mkdir -p .e2e-artifacts/internal-discovery
          nohup ./node_modules/.bin/vite --host 127.0.0.1 > .e2e-artifacts/internal-discovery/server.log 2>&1 &
          echo $! > .e2e-artifacts/internal-discovery/server.pid
          ready=0
          for attempt in $(seq 1 120); do
            if curl --silent --fail http://localhost:5173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -200 .e2e-artifacts/internal-discovery/server.log
            exit 1
          fi
      - name: Seed runtime canonical relations
        run: |
          node scripts/bootstrap-breed-e2e.mjs seed
          node scripts/bootstrap-adoption-e2e.mjs
          node scripts/bootstrap-internal-discovery-e2e.mjs
      - name: Restart isolated local app after runtime relation seed
        run: |
          if [ -f .e2e-artifacts/internal-discovery/server.pid ]; then
            kill "$(cat .e2e-artifacts/internal-discovery/server.pid)" 2>/dev/null || true
          fi
          for attempt in $(seq 1 30); do
            if ! curl --silent --fail http://localhost:5173/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if curl --silent --fail http://localhost:5173/ >/dev/null 2>&1; then
            pkill -f 'vite.*--host 127.0.0.1' 2>/dev/null || true
            sleep 1
          fi
          nohup ./node_modules/.bin/vite --host 127.0.0.1 > .e2e-artifacts/internal-discovery/server.log 2>&1 &
          echo $! > .e2e-artifacts/internal-discovery/server.pid
          ready=0
          for attempt in $(seq 1 120); do
            if curl --silent --fail http://localhost:5173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -200 .e2e-artifacts/internal-discovery/server.log
            exit 1
          fi
      - name: Discovery Playwright — desktop
        run: npm run e2e -- tests/e2e/internal-discovery.spec.ts --project=desktop-chromium --workers=1 --retries=0
      - name: Discovery Playwright — mobile
        run: npm run e2e -- tests/e2e/internal-discovery.spec.ts --project=mobile-chromium --workers=1 --retries=0
      - name: Stop isolated local app
        if: always()
        run: |
          if [ -f .e2e-artifacts/internal-discovery/server.pid ]; then
            kill "$(cat .e2e-artifacts/internal-discovery/server.pid)" 2>/dev/null || true
          fi
