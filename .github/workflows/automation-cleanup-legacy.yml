name: Automation Legacy Cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview is read-only. Apply requires explicit confirmation.
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply
      confirmation:
        description: For apply type CLEAN-AUTOMATION-LEGACY-psipedia-sk-db
        required: false
        type: string

concurrency:
  group: automation-legacy-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - name: Require main and explicit apply confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          if [ "${{ inputs.mode }}" = "apply" ]; then
            test "${{ inputs.confirmation }}" = "CLEAN-AUTOMATION-LEGACY-psipedia-sk-db"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require dispatched revision to still be current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Load canonical Cloudflare account id
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("config/cloudflare-resources.json","utf8")); process.stdout.write(x.account_id || "")')"
          test -n "$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Cleanup contract tests
        run: node --test tests/automation-cleanup-legacy.test.mjs

      - name: Production preview
        run: node scripts/automation-cleanup-legacy.mjs --preview

      - name: Production apply
        if: inputs.mode == 'apply'
        run: node scripts/automation-cleanup-legacy.mjs --apply
