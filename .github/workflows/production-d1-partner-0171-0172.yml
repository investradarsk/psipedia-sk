name: Production D1 Partner 0171/0172 (manual, sequential)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Audit first; approve each migration separately
        type: choice
        required: true
        default: audit
        options:
          - audit
          - apply-0171
          - apply-0172
      confirmation:
        description: AUDIT-psipedia-sk-db or APPLY-0171-psipedia-sk-db or APPLY-0172-psipedia-sk-db
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: production-d1-migration
  cancel-in-progress: false
jobs:
  partner-rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      PARTNER_ROLLOUT_CONFIRMATION: ${{ inputs.confirmation }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - name: Require manual owner dispatch from main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "investradarsk/psipedia-sk"
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$CLOUDFLARE_API_TOKEN"
          case "${{ inputs.mode }}" in
            audit) expected="AUDIT-psipedia-sk-db" ;;
            apply-0171) expected="APPLY-0171-psipedia-sk-db" ;;
            apply-0172) expected="APPLY-0172-psipedia-sk-db" ;;
            *) exit 1 ;;
          esac
          test "$PARTNER_ROLLOUT_CONFIRMATION" = "$expected"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Reject stale main
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Offline checks
        run: |
          npm run db:check-migrations
          node --test tests/production-d1-partner-0171-0172.test.mjs
      - name: Bind canonical account
        run: |
          account="$(node -e 'process.stdout.write(require("./config/cloudflare-resources.json").account_id || "")')"
          test -n "$account"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
      - name: Run guarded audit or single migration
        run: node scripts/production-d1-partner-0171-0172.mjs "${{ inputs.mode }}"
      - name: Archive report and pre-apply Time Travel bookmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partner-0171-0172-${{ github.run_id }}
          path: .production-d1-partner-0171-0172/report.json
          if-no-files-found: ignore
          retention-days: 30
