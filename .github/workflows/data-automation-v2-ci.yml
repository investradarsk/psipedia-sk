name: Data automation source management

on:
  pull_request:
    branches: [main]
    paths:
      - "app/admin/operations/automation/**"
      - "app/admin/automatizacie/**"
      - "app/api/admin/automation-sources/**"
      - "app/api/admin/automation-source-candidates/**"
      - "app/api/admin/automation-lifecycle/**"
      - "components/admin-automation-source-*.tsx"
      - "components/admin-automation-lifecycle-*.tsx"
      - "lib/admin-automation-api.ts"
      - "lib/data-automation*.ts"
      - "drizzle/0052_data_automation_sources_discovery.sql"
      - "drizzle/0056_scheduled_source_discovery.sql"
      - "drizzle/0057_automation_background_run_lock.sql"
      - "drizzle/0073_automation_multisource_entity_resolution.sql"
      - "drizzle/0075_automation_zsk_event_source.sql"
      - "drizzle/0076_automation_non_event_entity_resolution_foundation.sql"
      - "drizzle/0079_automation_agility_event_source.sql"
      - "drizzle/0080_automation_canonical_apply.sql"
      - "drizzle/0084_automation_governance_registry.sql"
      - "drizzle/0085_automation_tavily_discovery_root.sql"
      - "drizzle/0092_automation_product_model.sql"
      - "drizzle/0093_automation_address_review.sql"
      - "drizzle/0094_canonical_draft_delete.sql"
      - "drizzle/0096_automation_update_field_reviews.sql"
      - "lib/canonical-draft-delete.ts"
      - "lib/automation-record-suppressions.ts"
      - "components/admin-canonical-draft-delete.tsx"
      - "app/api/admin/canonical-drafts/**"
      - "tests/canonical-draft-delete.test.mjs"
      - "tests/data-automation*.test.mjs"
      - "tests/data-automation-governance.test.mjs"
      - "tests/tavily-canary-control.test.mjs"
      - "tests/automation-admin-v2-ux.test.mjs"
      - "tests/g4-possible-review-decisions.test.mjs"
      - "tests/g5-canonical-apply.test.mjs"
      - "tests/automation-cluster-admin-integration.test.mjs"
      - "tests/data-automation-tavily-source-scoped.test.mjs"
      - "tests/data-automation-tavily-strategy-chain.test.mjs"
      - "tests/data-automation-source-provider-usage.test.mjs"
      - "tests/data-automation-event-source-pilot.test.mjs"
      - "tests/data-automation-adoption-source-pilot.test.mjs"
      - "tests/data-automation-foster-source-pilot.test.mjs"
      - "tests/data-automation-foster-d1-e2e.test.mjs"
      - "tests/data-automation-lost-found-source-pilot.test.mjs"
      - "tests/data-automation-lost-found-d1-e2e.test.mjs"
      - "scripts/automation-source-ux-reset.mjs"
      - "tests/automation-source-ux-reset.test.mjs"
      - "tests/automation-update-review.test.mjs"
      - "tests/admin-auto-ux-2.test.mjs"
      - "tests/fixtures/data-automation/**"
      - "tests/e2e/data-automation-v2.spec.ts"
      - "tests/e2e/canonical-draft-delete.spec.ts"
      - "tests/fixtures/canonical-draft-delete-e2e.sql"
      - ".github/workflows/data-automation-v2-ci.yml"
  workflow_dispatch:

concurrency:
  group: data-automation-v2-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Log revision evidence
        run: |
          echo "pr_head_sha=${{ github.event.pull_request.head.sha || 'n/a' }}"
          echo "base_sha=${{ github.event.pull_request.base.sha || 'n/a' }}"
          echo "checked_out_sha=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run db:check-migrations
      - run: npm run lint
      - name: Focused AUTOMATION-1 + AUTOMATION-2 tests
        run: node --experimental-strip-types --test tests/data-automation.test.mjs tests/data-automation-apply.test.mjs tests/data-automation-v2.test.mjs tests/data-automation-v4.test.mjs tests/data-automation-v5.test.mjs tests/data-automation-background-run.test.mjs tests/data-automation-clustering.test.mjs tests/data-automation-discovery-evidence.test.mjs tests/data-automation-sitemap.test.mjs tests/data-automation-rss.test.mjs tests/data-automation-structured-directory.test.mjs tests/data-automation-search-provider.test.mjs tests/data-automation-search-budget.test.mjs tests/data-automation-tavily-root.test.mjs tests/data-automation-help-source-readiness.test.mjs tests/data-automation-tavily-directory-roots.test.mjs tests/data-automation-tavily-help-roots.test.mjs tests/data-automation-universal.test.mjs tests/data-automation-product-model.test.mjs tests/data-automation-direct-entity-identity.test.mjs tests/data-automation-directory-matching.test.mjs tests/data-automation-organization-ingest.test.mjs tests/canonical-draft-delete.test.mjs tests/data-automation-address-review.test.mjs tests/data-automation-entity-enrichment.test.mjs tests/data-automation-lifecycle.test.mjs tests/lost-found-lifecycle.test.mjs tests/data-automation-directory-address-description.test.mjs tests/data-automation-directory-exact-address-enrichment.test.mjs tests/data-automation-directory-address-enrichment-contract.test.mjs tests/admin-attention-queue.test.mjs tests/automation-admin-v2-ux.test.mjs tests/automation-source-only-ux.test.mjs tests/g4-possible-review-decisions.test.mjs tests/g5-canonical-apply.test.mjs tests/automation-cluster-admin-integration.test.mjs tests/data-automation-tavily-source-scoped.test.mjs tests/data-automation-source-provider-usage.test.mjs tests/data-automation-event-source-pilot.test.mjs tests/data-automation-adoption-source-pilot.test.mjs tests/data-automation-foster-source-pilot.test.mjs tests/data-automation-lost-found-source-pilot.test.mjs
      - name: Tavily internet-only production policy
        run: node --experimental-strip-types --experimental-loader ./tests/admin-events-loader.mjs --test tests/data-automation-tavily-internet-only.test.mjs
      - name: Tavily source-scoped strategy chain
        run: node --experimental-strip-types --experimental-loader ./tests/admin-events-loader.mjs --test tests/data-automation-tavily-strategy-chain.test.mjs
      - name: ORGANIZATION root regression
        run: node --experimental-strip-types --experimental-loader ./tests/admin-events-loader.mjs --test tests/data-automation-organization-root.test.mjs
      - name: DIRECTORY + EVENT provisioning approval integration regression
        run: node --experimental-strip-types --experimental-loader ./tests/admin-events-loader.mjs --test tests/data-automation-directory-provisioning-integration.test.mjs
      - name: DIRECTORY service-address safety regression
        run: node --experimental-strip-types --experimental-loader ./tests/admin-events-loader.mjs --test tests/directory-service-address.test.mjs
      - name: DISCOVERY-4B governance tests
        run: node --experimental-strip-types --experimental-loader ./tests/admin-events-loader.mjs --test tests/data-automation-governance.test.mjs tests/tavily-canary-control.test.mjs
      - name: Automation source UX reset contract
        run: node --test tests/automation-source-ux-reset.test.mjs
      - name: Automation update review contract
        run: node --experimental-strip-types --test tests/automation-update-review.test.mjs
      - run: npm run build

  admin-e2e:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: http://localhost:5173
      PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Configure CI-only local PII keys
        run: |
          cat > .dev.vars <<'EOF'
          PII_ENCRYPTION_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
          PII_HASH_KEY=ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA
          EOF
      - name: Apply foundation migrations to isolated local D1
        run: |
          mv drizzle/0038_adoption_staging_data.sql /tmp/0038_adoption_staging_data.sql
          mv drizzle/0039_activate_canonical_adoptions.sql /tmp/0039_activate_canonical_adoptions.sql
          trap 'mv /tmp/0038_adoption_staging_data.sql drizzle/0038_adoption_staging_data.sql; mv /tmp/0039_activate_canonical_adoptions.sql drizzle/0039_activate_canonical_adoptions.sql' EXIT
          npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to .wrangler/state
          npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/canonical-draft-delete-e2e.sql
      - name: DIRECT_ENTITY identity/evidence local D1 E2E
        run: node --experimental-strip-types --experimental-loader ./tests/admin-events-loader.mjs --test tests/data-automation-direct-entity-d1-e2e.test.mjs
      - name: EVENT source-scoped isolated local D1 pilot
        run: node --experimental-strip-types --experimental-loader ./tests/admin-events-loader.mjs --test tests/data-automation-event-source-pilot-d1.test.mjs
      - name: ADOPTION source-scoped local D1 E2E
        shell: bash
        run: |
          set -euo pipefail
          d1_path="$(node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { DatabaseSync } = require("node:sqlite");

          function sqliteFiles(root) {
            const output = [];
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              const full = path.join(root, entry.name);
              if (entry.isDirectory()) output.push(...sqliteFiles(full));
              else if (entry.isFile() && entry.name.endsWith(".sqlite")) output.push(full);
            }
            return output;
          }

          for (const file of sqliteFiles(".wrangler/state/v3/d1")) {
            try {
              const db = new DatabaseSync(file, { readOnly: true });
              const rows = db.prepare(
                "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('automation_sources','canonical_external_provenance')",
              ).all();
              db.close();
              if (rows.length === 2) {
                process.stdout.write(file);
                process.exit(0);
              }
            } catch {}
          }
          process.exit(1);
          NODE
          )"
          test -n "$d1_path"
          echo "Using local D1 database: $d1_path"
          PSIPEDIA_E2E_D1_PATH="$d1_path" node --experimental-strip-types --experimental-loader ./tests/admin-events-loader.mjs --test tests/data-automation-adoption-d1-e2e.test.mjs
      - name: FOSTER source-scoped local D1 E2E
        shell: bash
        run: |
          set -euo pipefail
          d1_path="$(node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { DatabaseSync } = require("node:sqlite");

          function sqliteFiles(root) {
            const output = [];
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              const full = path.join(root, entry.name);
              if (entry.isDirectory()) output.push(...sqliteFiles(full));
              else if (entry.isFile() && entry.name.endsWith(".sqlite")) output.push(full);
            }
            return output;
          }

          for (const file of sqliteFiles(".wrangler/state/v3/d1")) {
            try {
              const db = new DatabaseSync(file, { readOnly: true });
              const rows = db.prepare(
                "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('automation_sources','canonical_external_provenance','help_cases')",
              ).all();
              db.close();
              if (rows.length === 3) {
                process.stdout.write(file);
                process.exit(0);
              }
            } catch {}
          }
          process.exit(1);
          NODE
          )"
          test -n "$d1_path"
          echo "Using local D1 database: $d1_path"
          PSIPEDIA_E2E_D1_PATH="$d1_path" node --experimental-strip-types --experimental-loader ./tests/admin-events-loader.mjs --test tests/data-automation-foster-d1-e2e.test.mjs
      - name: LOST_FOUND source-scoped local D1 E2E
        shell: bash
        run: |
          set -euo pipefail
          d1_path="$(node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { DatabaseSync } = require("node:sqlite");

          function sqliteFiles(root) {
            const output = [];
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              const full = path.join(root, entry.name);
              if (entry.isDirectory()) output.push(...sqliteFiles(full));
              else if (entry.isFile() && entry.name.endsWith(".sqlite")) output.push(full);
            }
            return output;
          }

          for (const file of sqliteFiles(".wrangler/state/v3/d1")) {
            try {
              const db = new DatabaseSync(file, { readOnly: true });
              const rows = db.prepare(
                "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('automation_sources','canonical_external_provenance','lost_found_dog_reports')",
              ).all();
              db.close();
              if (rows.length === 3) {
                process.stdout.write(file);
                process.exit(0);
              }
            } catch {}
          }
          process.exit(1);
          NODE
          )"
          test -n "$d1_path"
          echo "Using local D1 database: $d1_path"
          PSIPEDIA_E2E_D1_PATH="$d1_path" node --experimental-strip-types --experimental-loader ./tests/admin-events-loader.mjs --test tests/data-automation-lost-found-d1-e2e.test.mjs
      - name: Start isolated local app
        run: |
          mkdir -p .e2e-artifacts/data-automation-v2
          nohup npm exec vite -- --host 127.0.0.1 > .e2e-artifacts/data-automation-v2/server.log 2>&1 &
          echo $! > .e2e-artifacts/data-automation-v2/server.pid
          ready=0
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://localhost:5173/admin/automatizacie/zdroje >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
      - name: Source admin desktop/mobile + Axe
        run: npx playwright test tests/e2e/data-automation-v2.spec.ts tests/e2e/canonical-draft-delete.spec.ts --workers=1 --retries=0
      - name: Stop local app
        if: always()
        run: |
          if [ -f .e2e-artifacts/data-automation-v2/server.pid ]; then
            kill "$(cat .e2e-artifacts/data-automation-v2/server.pid)" 2>/dev/null || true
          fi
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: data-automation-v2-failure-${{ github.run_attempt }}
          path: |
            .e2e-artifacts/data-automation-v2/
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 14
