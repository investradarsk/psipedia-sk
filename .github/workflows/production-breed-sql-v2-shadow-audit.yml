name: Production D1 Breeds SQL v2 health (read-only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Must be AUDIT-BREEDS-V2-SHADOW-347"
        required: true
        type: string

concurrency:
  group: production-d1-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shadow-audit:
    name: Owner-only SQL integrity or shadow parity audit
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    env:
      BREED_V2_SHADOW_CONFIRMATION: ${{ inputs.confirmation }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - name: Owner-only exact main and explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = investradarsk/psipedia-sk
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$BREED_V2_SHADOW_CONFIRMATION" = AUDIT-BREEDS-V2-SHADOW-347
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Prevent stale commits from inspecting production
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
      - run: npm ci
      - name: Canonical Cloudflare account binding
        shell: bash
        run: |
          set -euo pipefail
          echo "CLOUDFLARE_ACCOUNT_ID=$(node -p 'require("./config/cloudflare-resources.json").account_id')" >> "$GITHUB_ENV"
      - name: Offline SQL integrity and shadow readiness contracts
        run: |
          node --test tests/breed-sql-v2-shadow-readiness.test.mjs tests/breed-sql-v2-primary-health.test.mjs
      - name: SELECT-only production SQL integrity or pre-cutover parity
        run: node scripts/production-breed-sql-v2-shadow-audit.mjs
      - name: Upload only the sanitized parity counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breeds-v2-health-readonly-${{ github.run_id }}
          path: .production-breed-v2-shadow-audit/report.json
          retention-days: 30
          if-no-files-found: ignore
