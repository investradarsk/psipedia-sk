name: SEO-RECOVERY-1 validation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/adresar/**"
      - "app/clanky/**"
      - "app/plemena/**"
      - 'app/\[section\]/**'
      - "app/tema/**"
      - "app/robots.ts"
      - "app/sitemap.ts"
      - "components/event-calendar.tsx"
      - "components/events-page.tsx"
      - "components/reviews-hub.tsx"
      - "lib/content-seo.ts"
      - "lib/events.ts"
      - "lib/listing-seo.ts"
      - "lib/seo.ts"
      - "lib/sitemap-*.ts"
      - "tests/seo-recovery.test.mjs"
      - "tests/seo-metadata-listing-schema.test.mjs"
      - "tests/sitemap-seo.test.mjs"
      - "tests/e2e/seo-recovery.spec.ts"
      - "tests/e2e/events-public-v2.spec.ts"
      - ".github/workflows/seo-recovery-1.yml"

permissions:
  contents: read
  checks: read

concurrency:
  group: seo-recovery-1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    if: github.head_ref == 'codex/seo-recovery-1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: SEO metadata, listing and sitemap regressions
        run: node --experimental-strip-types --test tests/seo-recovery.test.mjs tests/seo-metadata-listing-schema.test.mjs tests/sitemap-seo.test.mjs
      - name: Build branch
        run: npm run build

  preview-seo:
    if: github.head_ref == 'codex/seo-recovery-1'
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Resolve exact Cloudflare preview for PR head
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/check-runs"
          preview_url=""
          for attempt in $(seq 1 90); do
            payload="$(curl --silent --show-error --fail               -H "Authorization: Bearer ${GH_TOKEN}"               -H "Accept: application/vnd.github+json"               "${api}")"
            state="$(printf '%s' "${payload}" | node -e '
              let x=""; process.stdin.on("data",d=>x+=d).on("end",()=>{
                const runs=JSON.parse(x).check_runs||[];
                const run=runs.find(item=>item.name==="Workers Builds: psipedia-sk");
                process.stdout.write(run ? String(run.status)+"|"+String(run.conclusion||"") : "missing|");
              });
            ')"
            if [ "${state}" = "completed|failure" ]; then
              echo "::error::Cloudflare Workers Build failed for ${PR_HEAD_SHA}."
              exit 1
            fi
            if [ "${state}" = "completed|success" ]; then
              preview_url="$(printf '%s' "${payload}" | node -e '
                let x=""; process.stdin.on("data",d=>x+=d).on("end",()=>{
                  const runs=JSON.parse(x).check_runs||[];
                  const run=runs.find(item=>item.name==="Workers Builds: psipedia-sk");
                  const summary=run?.output?.summary||"";
                  const match=summary.match(/Preview URL:\s*(https:\/\/[^\s]+)/);
                  process.stdout.write(match?.[1]||"");
                });
              ')"
              if [ -n "${preview_url}" ]; then break; fi
            fi
            sleep 5
          done
          test -n "${preview_url}"
          echo "url=${preview_url}" >> "$GITHUB_OUTPUT"

      - name: SEO recovery Playwright against exact preview
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
        run: npx playwright test tests/e2e/seo-recovery.spec.ts tests/e2e/events-public-v2.spec.ts --project=desktop-chromium --workers=1 --retries=0

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seo-recovery-1-playwright-failure-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
