name: Psipedia Directory – production D1 legacy read-only audit

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type AUDIT-DIRECTORY-LEGACY-psipedia-sk-db (never APPLY)"
        required: true
        type: string

# Serialize with all production D1 migration workflows; cannot run concurrently.
concurrency:
  group: production-d1-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  readonly-audit:
    name: Count active historical JSON dependencies (SELECT only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - name: Require main branch and exact read-only confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          entered="$(node -e 'const e=require(process.env.GITHUB_EVENT_PATH);process.stdout.write(e.inputs?.confirmation||"")')"
          test "$entered" = "AUDIT-DIRECTORY-LEGACY-psipedia-sk-db"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Ensure dispatched commit is current main (never stale audit)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Offline safety and SQLite fixtures (NO production connection)
        run: node --experimental-strip-types --test tests/production-directory-legacy-readonly.test.mjs tests/directory-legacy-cutover-readiness.test.mjs tests/directory-legacy-cutover-candidates.test.mjs

      - name: Bind protected canonical Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          account="$(node -e 'process.stdout.write(require("./config/cloudflare-resources.json").account_id||"")')"
          test -n "$account"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Query canonical production D1 (2 static SELECT statements ONLY)
        run: node scripts/production-directory-legacy-readonly.mjs

      - name: Retain aggregate + numeric Psipedia ID audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: directory-legacy-readonly-${{ github.run_id }}
          path: .production-directory-legacy-readonly/report.json
          if-no-files-found: error
          retention-days: 14
