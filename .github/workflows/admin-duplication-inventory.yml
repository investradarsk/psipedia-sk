name: ADMIN duplication inventory (read-only)

on:
  pull_request:
    paths:
      - "scripts/admin-duplication-inventory.mjs"
      - "tests/admin-duplication-inventory.test.mjs"
      - "tests/admin-form-control-unification-point-2.test.mjs"
      - "tests/admin-media-text-unification-point-3.test.mjs"
      - "tests/admin-open-source-unification.test.mjs"
      - "docs/ADMIN-COMPONENT-UNIFICATION-POINT-3.md"
      - "components/admin-article-block-editor.tsx"
      - "components/admin-photo-gallery.tsx"
      - "components/admin-sortable-gallery.tsx"
      - "docs/ADMIN-COMPONENT-UNIFICATION-POINT-2.md"
      - "components/admin-editor-workspace.tsx"
      - "components/admin-help-dashboard.tsx"
      - "components/admin-service-catalog-workspace.tsx"
      - "components/admin-partner-event-actions.tsx"
      - "components/admin-automation-finding-review.tsx"
      - "components/admin-missing-quality-dashboard.tsx"
      - "components/admin-data-quality-dashboard.tsx"
      - "components/admin-puppy-area-editor.tsx"
      - "docs/ADMIN-DUPLICATION-AUDIT-POINT-1.md"
      - ".github/workflows/admin-duplication-inventory.yml"

jobs:
  inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate read-only scanner and inventory
        run: node --test tests/admin-duplication-inventory.test.mjs
      - name: Print read-only inventory indicators
        run: node scripts/admin-duplication-inventory.mjs
      - name: Verify point 2 form and confirmation contracts
        run: node --test tests/admin-form-control-unification-point-2.test.mjs
      - name: Verify point 3 image and editor contracts
        run: node --experimental-strip-types --test tests/admin-media-text-unification-point-3.test.mjs tests/admin-open-source-unification.test.mjs
