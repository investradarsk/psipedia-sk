name: Notion schema drift guard (11 sources)
on:
  pull_request:
    paths:
      - 'scripts/notion-schema-contract.mjs'
      - 'scripts/notion-schema-verify.mjs'
      - 'tests/notion-schema-contract.test.mjs'
      - '.github/workflows/notion-schema-drift-guard.yml'
      - 'scripts/gemini-notion-directory-fields.mjs'
      - 'lib/gemini-external-help-dedupe.ts'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
jobs:
  offline-contract:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline schema tests (no token)
        run: node --test tests/notion-schema-contract.test.mjs
  live-schema:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only check of 11 current Notion schemas
        env:
          NOTION_SCHEMA_TOKEN: ${{ secrets.NOTION_API_TOKEN || secrets.GEMINI_AGENT_NOTION_TOKEN }}
        run: node scripts/notion-schema-verify.mjs
