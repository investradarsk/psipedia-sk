name: Production D1 0158–0162 Ledger Reconciliation (manual)

# Owner dispatch only. PR merges and Worker deploys do not write D1.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Audit (read-only) or Reconcile existing physical migrations in D1 history
        type: choice
        required: true
        default: audit
        options:
          - audit
          - apply
      confirmation:
        description: Type AUDIT-0158-0162-psipedia-sk-db or RECONCILE-0158-0162-psipedia-sk-db
        type: string
        required: true

concurrency:
  group: production-d1-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    name: Verify installed DDL then audit or reconcile only d1_migrations
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      D1_LEDGER_MODE: ${{ inputs.mode }}
      D1_LEDGER_CONFIRMATION: ${{ inputs.confirmation }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - name: Restrict to manual dispatch and explicit current main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "investradarsk/psipedia-sk"
          test "$GITHUB_REF" = "refs/heads/main"
          case "$D1_LEDGER_MODE" in
            audit) expected="AUDIT-0158-0162-psipedia-sk-db" ;;
            apply) expected="RECONCILE-0158-0162-psipedia-sk-db" ;;
            *) exit 1 ;;
          esac
          test "$D1_LEDGER_CONFIRMATION" = "$expected"
          test -n "$CLOUDFLARE_API_TOKEN"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require current main revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - name: Repository and receipt contract tests
        run: |
          npm run db:check-migrations
          node --test tests/production-d1-0158-0162-history.test.mjs

      - name: Load canonical Cloudflare account ID
        shell: bash
        run: |
          set -euo pipefail
          account="$(node -e 'const x=require("./config/cloudflare-resources.json"); process.stdout.write(x.account_id || "")')"
          test -n "$account"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Remote ledger audit or explicitly owner-approved receipt insertion
        run: node scripts/production-d1-0158-0162-ledger.mjs "$D1_LEDGER_MODE"

      - name: Save history reconciliation and Time Travel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-d1-ledger-0158-0162-${{ github.run_id }}
          path: .production-d1-ledger-0158-0162/report.json
          if-no-files-found: ignore
          retention-days: 30
