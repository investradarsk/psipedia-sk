name: Gemini Dashboard V3 isolated screenshots

on:
  pull_request:
    branches: [main]
    paths:
      - "app/admin/automatizacie-gemini/page.tsx"
      - "components/admin-gemini-automation-settings.tsx"
      - "components/admin-gemini-automation.module.css"
      - "tests/e2e/admin-gemini-dashboard-v3.spec.ts"
      - ".github/workflows/gemini-dashboard-v3-visual.yml"

permissions:
  contents: read

concurrency:
  group: gemini-dashboard-v3-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshot:
    name: Isolated Gemini admin desktop/mobile screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_BASE_URL: http://localhost:5173
      PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application under test
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Configure isolated local preview only
        run: |
          {
            printf 'PII_ENCRYPTION_KEY=%s\n' "$(openssl rand -base64 32)"
            printf 'PII_HASH_KEY=%s\n' "$(openssl rand -base64 32)"
            printf '%s\n' 'TURNSTILE_SITE_KEY=1x00000000000000000000AA'
            printf '%s\n' 'PSIPEDIA_E2E_LOCAL_BOOTSTRAP=1'
            printf '%s\n' 'GEMINI_EXTERNAL_AGENT_ENABLED=1'
            printf '%s\n' 'GEMINI_EXTERNAL_AGENT_SCHEDULED_ENABLED=0'
          } > .dev.vars
      - name: Apply schema to disposable local D1 only
        run: |
          mv drizzle/0038_adoption_staging_data.sql /tmp/0038_adoption_staging_data.sql
          mv drizzle/0039_activate_canonical_adoptions.sql /tmp/0039_activate_canonical_adoptions.sql
          trap 'mv /tmp/0038_adoption_staging_data.sql drizzle/0038_adoption_staging_data.sql; mv /tmp/0039_activate_canonical_adoptions.sql drizzle/0039_activate_canonical_adoptions.sql' EXIT
          npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to .wrangler/state
      - name: Seed one saved setting in disposable D1 only (never dispatch)
        run: |
          npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state \
            --command "INSERT INTO gemini_automation_settings(stable_key,section,subcategory,enabled,cadence_minutes,max_new_concepts) VALUES ('directory.veterinari','directory','veterinari',0,1440,1);"
      - name: Start isolated local app
        run: |
          mkdir -p .e2e-artifacts/gemini-dashboard-v3
          nohup npm exec vite -- --host 127.0.0.1 > .e2e-artifacts/gemini-dashboard-v3/server.log 2>&1 &
          echo $! > .e2e-artifacts/gemini-dashboard-v3/server.pid
          ready=0
          for attempt in $(seq 1 100); do
            if curl --silent --fail http://localhost:5173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -150 .e2e-artifacts/gemini-dashboard-v3/server.log
            exit 1
          fi
      - name: Real rendered UI Playwright — desktop 1440, mobile 390 and 320
        run: npx playwright test tests/e2e/admin-gemini-dashboard-v3.spec.ts tests/e2e/admin-gemini-all-concepts-v4.spec.ts --workers=1 --retries=0
      - name: Stop local app
        if: always()
        run: |
          if [ -f .e2e-artifacts/gemini-dashboard-v3/server.pid ]; then
            kill "$(cat .e2e-artifacts/gemini-dashboard-v3/server.pid)" 2>/dev/null || true
          fi
      - name: Upload actual rendered screenshots (not design references)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-dashboard-v3-rendered-${{ github.run_attempt }}
          path: .e2e-artifacts/gemini-dashboard-v3/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-dashboard-v3-test-failures-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 14
