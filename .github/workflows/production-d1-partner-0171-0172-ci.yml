name: Partner 0171/0172 offline rollout verification
on:
  pull_request:
    branches: [main]
    paths:
      - "pending-migrations/0171_partner_single_manager.sql"
      - "pending-migrations/0172_partner_help_claim_ownership.sql"
      - "scripts/production-d1-partner-0171-0172.mjs"
      - "tests/production-d1-partner-0171-0172.test.mjs"
      - ".github/workflows/production-d1-partner-0171-0172*.yml"
  workflow_dispatch:
concurrency:
  group: partner-d1-0171-0172-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run db:check-migrations
      - run: node --test tests/production-d1-partner-0171-0172.test.mjs
