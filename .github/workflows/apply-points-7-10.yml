name: Apply Psipedia points 7-10

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Apply verified update
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | tar -xz
          rm -f .github/workflows/apply-points-7-10.yml
          git config user.name "Psipedia deployment"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Add editable navigation, section management and block editor"
          git push

