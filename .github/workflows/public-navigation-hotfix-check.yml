name: Public navigation hotfix check

on:
  push:
    branches: [codex/public-nav-post-merge-hotfix]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build / TypeScript check
        run: npm run build
      - name: Targeted admin navigation regression
        run: node --test tests/admin-navigation-fallback.test.mjs
      - name: Diff whitespace check
        run: git diff --check ce158dedef8e1c7bc69d55296c133684eb42a494...HEAD
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Configure CI-only local PII keys
        run: |
          cat > .dev.vars <<'EOF'
          PII_ENCRYPTION_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
          PII_HASH_KEY=ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA
          EOF
      - name: Apply migrations to local D1 only
        run: npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to .wrangler/state
      - name: Prepare deterministic local E2E fixture
        env:
          E2E_BASE_URL: http://localhost:5173
          PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
        run: node scripts/bootstrap-breed-e2e.mjs prepare
      - name: Start local app server
        env:
          E2E_BASE_URL: http://localhost:5173
          PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
        run: |
          mkdir -p .e2e-artifacts
          nohup npm exec vite -- --host 127.0.0.1 > .e2e-artifacts/public-navigation-hotfix.log 2>&1 &
          echo $! > .e2e-artifacts/public-navigation-hotfix.pid
          ready=0
          for attempt in $(seq 1 120); do
            if curl --silent --fail http://localhost:5173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -200 .e2e-artifacts/public-navigation-hotfix.log
            exit 1
          fi
      - name: Public navigation order and submenus
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npx playwright test tests/e2e/public-navigation.spec.ts --grep "public navigation keeps order and exposes only requested submenus"
      - name: Desktop dropdown interaction
        if: success() || failure()
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npx playwright test tests/e2e/public-navigation.spec.ts --grep "desktop dropdown supports hover and keyboard focus without submenu accent line"
      - name: Mobile expanded-menu scrolling
        if: success() || failure()
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npx playwright test tests/e2e/public-navigation.spec.ts --grep "mobile menu scrolls to the final items with Šteniatka expanded"
      - name: Stop local app server
        if: always()
        run: |
          if [ -f .e2e-artifacts/public-navigation-hotfix.pid ]; then
            kill "$(cat .e2e-artifacts/public-navigation-hotfix.pid)" 2>/dev/null || true
          fi
