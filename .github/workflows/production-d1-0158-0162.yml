name: Production D1 0158 + 0162 Completion (manual)

# Explicit owner dispatch only. Merging this PR never mutates production D1.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Audit (read-only) or Apply exactly 0158 + 0162 if missing
        type: choice
        required: true
        default: audit
        options:
          - audit
          - apply
      confirmation:
        description: Type AUDIT-0158-0162-psipedia-sk-db or APPLY-0158-0162-psipedia-sk-db
        type: string
        required: true

concurrency:
  group: production-d1-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  completion:
    name: Verify 0159–0161 and protected 0158/0162 audit or apply
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      D1_COMPLETION_MODE: ${{ inputs.mode }}
      D1_COMPLETION_CONFIRMATION: ${{ inputs.confirmation }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - name: Require explicit production authorization on main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "investradarsk/psipedia-sk"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          case "$D1_COMPLETION_MODE" in
            audit) expected="AUDIT-0158-0162-psipedia-sk-db" ;;
            apply) expected="APPLY-0158-0162-psipedia-sk-db" ;;
            *) echo "Unsupported mode" >&2; exit 1 ;;
          esac
          test "$D1_COMPLETION_CONFIRMATION" = "$expected"
          test -n "$CLOUDFLARE_API_TOKEN"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require current main revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check SQL migration safety and isolated schema tests
        run: |
          npm run db:check-migrations
          node --test tests/production-d1-0158-0162.test.mjs

      - name: Load and verify configured production Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          account="$(node -e 'const x=require("./config/cloudflare-resources.json"); process.stdout.write(x.account_id || "")')"
          test -n "$account"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Read-only preflight or owner-approved schema completion
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production-d1-0158-0162.mjs "$D1_COMPLETION_MODE"

      - name: Preserve postflight evidence and Time Travel recovery bookmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-d1-0158-0162-${{ github.run_id }}
          path: .production-d1-0158-0162/report.json
          if-no-files-found: ignore
          retention-days: 30
