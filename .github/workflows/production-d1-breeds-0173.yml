name: Production D1 Plemená – verejné SQL 0173 (manual)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only audit or create public-breed relational tables
        type: choice
        required: true
        default: audit
        options: [audit, apply]
      confirmation:
        description: AUDIT-0173-psipedia-sk-db or APPLY-0173-psipedia-sk-db
        required: true
        type: string

concurrency:
  group: production-d1-migration
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  breed-schema-0173:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      BREED_0173_CONFIRMATION: ${{ inputs.confirmation }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - name: Require manual main dispatch and exact confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = investradarsk/psipedia-sk
          test -n "$CLOUDFLARE_API_TOKEN"
          case "${{ inputs.mode }}" in
            audit) expected=AUDIT-0173-psipedia-sk-db ;;
            apply) expected=APPLY-0173-psipedia-sk-db ;;
            *) exit 1 ;;
          esac
          test "$BREED_0173_CONFIRMATION" = "$expected"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify pinned main
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Validate 0173 SQL and transformation locally
        run: node --test tests/breed-public-sql-transfer.test.mjs
      - name: Bind production account
        run: |
          account="$(node -e 'process.stdout.write(require("./config/cloudflare-resources.json").account_id)')"
          test -n "$account"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
      - name: Perform selected schema operation
        run: node scripts/production-d1-breeds-0173.mjs "${{ inputs.mode }}"
