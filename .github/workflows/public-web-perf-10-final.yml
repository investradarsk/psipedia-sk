name: Public web performance regression (weekly/manual)

on:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * 4'

permissions:
  contents: read

concurrency:
  group: public-web-perf-weekly-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  focused-regressions:
    # Historical branch-specific matrix is now a supplementary periodic suite.
    # The standard required CI remains the build/lint authority.
    name: Public route performance, privacy, CSS and image regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - name: Performance and public HTML cache safety
        run: npm run test:perf-fastpaths
      - name: Home media, image size, source parity and gallery
        run: npm run test:homepage-media
      - name: Public CSS scope, source design tokens and component inventory
        run: |
          npm run test:public-css-scope
          node --test tests/public-design-tokens.test.mjs
          node --test tests/public-landing-alignment.test.mjs
          node --test tests/visual-library-full-inventory.test.mjs
      - name: Events, maps and FCI crawl behavior
        run: |
          npm run test:events-public-ux
          npm run test:map-public-ui
          npm run test:breed-crawl-hierarchy
      - name: Privacy, advertising and AI referral contracts
        run: |
          npm run test:monetization
          npm run test:ai-referral
