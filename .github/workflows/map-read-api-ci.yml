name: MAP-1C Map Read API

on:
  pull_request:
    branches: [main]
    paths:
      - "app/api/map/**"
      - "app/adresar/**"
      - "app/organizacie/**"
      - "app/[section]/**"
      - "components/map/**"
      - "components/directory-profile-detail.tsx"
      - "components/organization-profile-detail.tsx"
      - "components/event-detail.tsx"
      - "lib/map-*.ts"
      - "lib/public-map-runtime.ts"
      - "worker/index.ts"
      - "lib/directory-store.ts"
      - "tests/map-read-api*.test.mjs"
      - "tests/e2e/map-read-api.spec.ts"
      - "tests/e2e/public-detail-maps.spec.ts"
      - "tests/fixtures/map-read-api-e2e.sql"
      - "tests/public-location-map-contract.test.mjs"
      - "docs/map-read-api.md"
      - "package.json"
      - ".github/workflows/map-read-api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map-read-api:
    name: Map read contract, D1 integration and API E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_BASE_URL: http://localhost:5173
      PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
      MAP_UI_TEST_RENDERER: "1"
      PUBLIC_MAP_ENABLED: "1"
      GOOGLE_MAPS_BROWSER_API_KEY: "ci-browser-key-not-real"
      GOOGLE_MAPS_MAP_ID: "ci-map-id-not-real"
    steps:
      - uses: actions/checkout@v4
      - name: Log revision evidence
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "pr_head_sha=${{ github.event.pull_request.head.sha || 'n/a' }}"
          echo "base_sha=${{ github.event.pull_request.base.sha || 'n/a' }}"
          echo "github_sha=${{ github.sha }}"
          echo "checked_out_sha=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Migration safety
        run: npm run test:migration-safety
      - name: MAP-1C unit, integration, security and benchmark tests
        run: npm run test:map-read-api
      - name: MAP-1B geo foundation regression
        run: npm run test:geo-foundation
      - name: Clean D1 migration/schema validation
        run: npm run db:validate-clean
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Configure CI-only local security keys
        run: |
          {
            printf 'PII_ENCRYPTION_KEY=%s\n' "$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"
            printf 'PII_HASH_KEY=%s\n' "$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"
            printf 'PUBLIC_MAP_ENABLED=1\n'
            printf 'GOOGLE_MAPS_BROWSER_API_KEY=ci-browser-key-not-real\n'
            printf 'GOOGLE_MAPS_MAP_ID=ci-map-id-not-real\n'
            printf 'MAP_UI_TEST_RENDERER=1\n'
          } > .dev.vars
      - name: Apply non-adoption migrations to isolated local D1
        run: |
          mv drizzle/0038_adoption_staging_data.sql /tmp/0038_adoption_staging_data.sql
          mv drizzle/0039_activate_canonical_adoptions.sql /tmp/0039_activate_canonical_adoptions.sql
          trap 'mv /tmp/0038_adoption_staging_data.sql drizzle/0038_adoption_staging_data.sql; mv /tmp/0039_activate_canonical_adoptions.sql drizzle/0039_activate_canonical_adoptions.sql' EXIT
          npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to .wrangler/state
      - name: Seed MAP-1C synthetic fixture into isolated local D1
        run: npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/map-read-api-e2e.sql
      - name: Start isolated local app
        run: |
          mkdir -p .e2e-artifacts/map-1c
          nohup npm exec vite -- --host 127.0.0.1 > .e2e-artifacts/map-1c/server.log 2>&1 &
          echo $! > .e2e-artifacts/map-1c/server.pid
          ready=0
          for attempt in $(seq 1 90); do
            if curl --silent --fail 'http://localhost:5173/api/map?north=50&south=47&east=23&west=16&zoom=12' >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -200 .e2e-artifacts/map-1c/server.log
            exit 1
          fi
      - name: MAP-1C public API Playwright
        run: npx playwright test tests/e2e/map-read-api.spec.ts --workers=1 --retries=0
      - name: PUBLIC-MAPS-1 route-scoped CSP smoke
        run: |
          for path in /mapa /adresar/veterinari/map-e2e-vet-a /organizacie/map-e2e-multi-site-org /podujatia/map-e2e-upcoming-event; do
            headers="$(curl --silent --dump-header - --output /dev/null "http://localhost:5173$path")"
            echo "== $path =="
            echo "$headers"
            echo "$headers" | grep -qi '^content-security-policy:'
            echo "$headers" | grep -qi 'maps.googleapis.com'
          done
      - name: PUBLIC-MAPS-1 desktop/mobile detail E2E
        run: npx playwright test tests/e2e/public-detail-maps.spec.ts --project=desktop-chromium --project=mobile-chromium --workers=1 --retries=0
      - name: Stop isolated local app
        if: always()
        run: |
          if [ -f .e2e-artifacts/map-1c/server.pid ]; then
            kill "$(cat .e2e-artifacts/map-1c/server.pid)" 2>/dev/null || true
          fi
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: map-1c-failure-${{ github.run_attempt }}
          path: |
            .e2e-artifacts/map-1c/
            playwright-report/
            test-results/playwright/
          if-no-files-found: warn
          retention-days: 14
