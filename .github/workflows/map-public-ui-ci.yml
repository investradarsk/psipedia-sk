name: MAP-1D Public Map UI

on:
  pull_request:
    branches: [main]
    paths:
      - "app/mapa/**"
      - "components/map/**"
      - "lib/map-public-ui.ts"
      - "worker/index.ts"
      - "config/runtime-env.ts"
      - ".env.example"
      - "docs/map-public-ui.md"
      - "scripts/map-ui-bundle-report.mjs"
      - "tests/map-public-ui*.test.mjs"
      - "tests/e2e/map-public-ui.spec.ts"
      - "package.json"
      - ".github/workflows/map-public-ui-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map-public-ui:
    name: Map UI contract, build and desktop/mobile E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_BASE_URL: http://localhost:5173
      PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
      MAP_UI_TEST_RENDERER: "1"
      PUBLIC_MAP_ENABLED: "1"
      GOOGLE_MAPS_BROWSER_API_KEY: "ci-browser-key-not-real"
      GOOGLE_MAPS_MAP_ID: "ci-map-id-not-real"
    steps:
      - uses: actions/checkout@v4
      - name: Log revision evidence
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "pr_head_sha=${{ github.event.pull_request.head.sha || 'n/a' }}"
          echo "base_sha=${{ github.event.pull_request.base.sha || 'n/a' }}"
          echo "github_sha=${{ github.sha }}"
          echo "checked_out_sha=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Migration safety
        run: npm run test:migration-safety
      - name: MAP-1D unit and security contract tests
        run: npm run test:map-public-ui
      - name: MAP-1C read API regression
        run: npm run test:map-read-api
      - name: MAP-1B privacy regression
        run: npm run test:geo-foundation
      - name: Config contract
        run: npm run test:config
      - name: Clean D1 migration/schema validation
        run: npm run db:validate-clean
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: MAP-1D bundle evidence
        run: node scripts/map-ui-bundle-report.mjs
      - run: npx playwright install --with-deps chromium
      - name: Configure CI-only local security keys
        run: |
          {
            printf 'PII_ENCRYPTION_KEY=%s\n' "$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"
            printf 'PII_HASH_KEY=%s\n' "$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"
            printf 'PUBLIC_MAP_ENABLED=1\n'
            printf 'GOOGLE_MAPS_BROWSER_API_KEY=ci-browser-key-not-real\n'
            printf 'GOOGLE_MAPS_MAP_ID=ci-map-id-not-real\n'
          } > .dev.vars
      - name: Apply non-adoption migrations to isolated local D1
        run: |
          mv drizzle/0038_adoption_staging_data.sql /tmp/0038_adoption_staging_data.sql
          mv drizzle/0039_activate_canonical_adoptions.sql /tmp/0039_activate_canonical_adoptions.sql
          trap 'mv /tmp/0038_adoption_staging_data.sql drizzle/0038_adoption_staging_data.sql; mv /tmp/0039_activate_canonical_adoptions.sql drizzle/0039_activate_canonical_adoptions.sql' EXIT
          npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to .wrangler/state
      - name: Start isolated local app
        run: |
          mkdir -p .e2e-artifacts/map-1d
          nohup npm exec vite -- --host 127.0.0.1 > .e2e-artifacts/map-1d/server.log 2>&1 &
          echo $! > .e2e-artifacts/map-1d/server.pid
          ready=0
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://localhost:5173/mapa >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -200 .e2e-artifacts/map-1d/server.log
            exit 1
          fi
      - name: Verify route-scoped map security headers
        run: |
          headers="$(curl --silent --dump-header - --output /dev/null http://localhost:5173/mapa)"
          echo "$headers"
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi 'maps.googleapis.com'
          echo "$headers" | grep -qi '^permissions-policy:.*geolocation=()'
      - name: MAP-1D desktop/mobile Playwright and screenshots
        run: npx playwright test tests/e2e/map-public-ui.spec.ts --project=desktop-chromium --workers=1 --retries=0
      - name: MAP-1E launch navigation and consent Playwright
        run: npx playwright test tests/e2e/map-production-launch.spec.ts --project=desktop-chromium --project=mobile-chromium --workers=1 --retries=0
      - name: Stop isolated local app
        if: always()
        run: |
          if [ -f .e2e-artifacts/map-1d/server.pid ]; then
            kill "$(cat .e2e-artifacts/map-1d/server.pid)" 2>/dev/null || true
          fi
      - name: Upload MAP-1D visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-1d-visual-${{ github.run_attempt }}
          path: |
            .e2e-artifacts/map-1d/
            playwright-report/
            test-results/playwright/
          if-no-files-found: warn
          retention-days: 14
