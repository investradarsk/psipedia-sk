name: Data automation foundation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/admin/operations/**"
      - "app/api/admin/automation-findings/**"
      - "components/admin-automation-finding-review.tsx"
      - "lib/data-automation.ts"
      - "lib/data-automation-apply.ts"
      - "lib/data-automation-canonical-apply.ts"
      - "lib/data-automation-clustering.ts"
      - "lib/data-automation-capability-registry.ts"
      - "lib/data-automation-draft-mapper.ts"
      - "lib/data-automation-enrichment-normalize.ts"
      - "lib/data-automation-enrichment-template.ts"
      - "lib/data-automation-http-policy.ts"
      - "lib/data-automation-governance.ts"
      - "lib/data-automation-identity.ts"
      - "lib/data-automation-dynamic-identity.ts"
      - "lib/data-automation-ingestion-receipts.ts"
      - "lib/data-automation-lifecycle.ts"
      - "lib/data-automation-lifecycle-apply.ts"
      - "lib/data-automation-lifecycle-store.ts"
      - "lib/data-automation-matching.ts"
      - "lib/data-automation-runner.ts"
      - "lib/data-automation-source-provisioning.ts"
      - "lib/data-automation-source-scoped-extraction.ts"
      - "lib/data-automation-source-store.ts"
      - "lib/data-automation-store.ts"
      - "lib/data-automation-generic-source-extractor.ts"
      - "lib/automation-record-suppressions.ts"
      - "lib/canonical-draft-delete.ts"
      - "lib/admin-attention-queue*.ts"
      - "lib/editorial-email.ts"
      - "lib/editorial-notifications.ts"
      - "worker/index.ts"
      - "drizzle/0050_data_automation_foundation.sql"
      - "drizzle/0055_data_automation_apply.sql"
      - "drizzle/0056_scheduled_source_discovery.sql"
      - "drizzle/0057_automation_background_run_lock.sql"
      - "drizzle/0073_automation_multisource_entity_resolution.sql"
      - "drizzle/0075_automation_zsk_event_source.sql"
      - "drizzle/0076_automation_non_event_entity_resolution_foundation.sql"
      - "drizzle/0079_automation_agility_event_source.sql"
      - "drizzle/0080_automation_canonical_apply.sql"
      - "drizzle/0084_automation_governance_registry.sql"
      - "drizzle/0052_data_automation_sources_discovery.sql"
      - "drizzle/0078_automation_possible_match_reviews.sql"
      - "drizzle/0081_automation_mushing_event_source.sql"
      - "drizzle/0082_automation_discovery_candidate_evidence.sql"
      - "drizzle/0083_automation_search_budgets.sql"
      - "drizzle/0085_automation_tavily_discovery_root.sql"
      - "drizzle/0086_automation_tavily_event_cadence.sql"
      - "drizzle/0087_automation_tavily_help_roots.sql"
      - "drizzle/0088_automation_tavily_organization_root.sql"
      - "drizzle/0089_automation_tavily_directory_roots.sql"
      - "drizzle/0091_automation_detach_drafts.sql"
      - "drizzle/0092_automation_product_model.sql"
      - "drizzle/0093_automation_address_review.sql"
      - "drizzle/0094_canonical_draft_delete.sql"
      - "drizzle/0095_automation_calendar_schedule.sql"
      - "drizzle/0096_automation_update_field_reviews.sql"
      - "drizzle/0097_automation_operations_metrics.sql"
      - "tests/data-automation.test.mjs"
      - "tests/data-automation-governance.test.mjs"
      - "tests/data-automation-apply.test.mjs"
      - "tests/data-automation-background-run.test.mjs"
      - "tests/data-automation-clustering.test.mjs"
      - "tests/data-automation-dynamic-identity.test.mjs"
      - "tests/data-automation-generic-source-extractor.test.mjs"
      - "tests/data-automation-lifecycle.test.mjs"
      - "tests/automation-detach-drafts.test.mjs"
      - "tests/automation-cleanup-legacy.test.mjs"
      - "tests/automation-finalize-v1.test.mjs"
      - "scripts/automation-detach-drafts.mjs"
      - "scripts/automation-cleanup-legacy.mjs"
      - ".github/workflows/automation-finalize-v1.yml"
      - "tests/g5-canonical-apply.test.mjs"
      - "tests/fixtures/data-automation/**"
      - "tests/admin-attention-queue.test.mjs"
      - ".github/workflows/data-automation-ci.yml"
  workflow_dispatch:

concurrency:
  group: data-automation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Log revision evidence
        run: |
          echo "pr_head_sha=${{ github.event.pull_request.head.sha || 'n/a' }}"
          echo "base_sha=${{ github.event.pull_request.base.sha || 'n/a' }}"
          echo "checked_out_sha=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run db:check-migrations
      - name: Focused automation and Attention Center tests
        run: node --experimental-strip-types --test tests/data-automation.test.mjs tests/data-automation-apply.test.mjs tests/data-automation-v4.test.mjs tests/data-automation-v5.test.mjs tests/data-automation-background-run.test.mjs tests/data-automation-clustering.test.mjs tests/automation-detach-drafts.test.mjs tests/automation-cleanup-legacy.test.mjs tests/automation-finalize-v1.test.mjs tests/g5-canonical-apply.test.mjs tests/admin-attention-queue.test.mjs tests/data-automation-tavily-source-scoped.test.mjs tests/data-automation-source-provider-usage.test.mjs tests/data-automation-event-source-pilot.test.mjs tests/data-automation-adoption-source-pilot.test.mjs tests/data-automation-foster-source-pilot.test.mjs
      - name: Tavily source-scoped strategy chain
        run: node --experimental-strip-types --experimental-loader ./tests/admin-events-loader.mjs --test tests/data-automation-tavily-strategy-chain.test.mjs
      - name: HELP-INGEST-1C foster adapter tests
        run: node --experimental-strip-types --experimental-loader ./tests/admin-events-loader.mjs --test tests/data-automation-foster-ingest.test.mjs
      - name: DISCOVERY-4B governance tests
        run: node --experimental-strip-types --experimental-loader ./tests/admin-events-loader.mjs --test tests/data-automation-governance.test.mjs
      - run: npm run build
