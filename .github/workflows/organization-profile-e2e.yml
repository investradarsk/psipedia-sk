name: Organization profile E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "app/layout.tsx"
      - "app/*.css"
      - "app/organizacie/**"
      - "components/organization-profile-*"
      - "components/adoption-card-media.tsx"
      - "components/detail-primitives/**"
      - "components/page-system.tsx"
      - "components/site-header*"
      - "components/site-footer*"
      - "components/cookie-consent*"
      - "lib/help-organization-store.ts"
      - "lib/organization-adoption-store.ts"
      - "lib/organization-profile-presentation.ts"
      - "lib/organization-seo.ts"
      - "lib/adoption.ts"
      - "lib/adoption-store.ts"
      - "lib/adoption-detail.ts"
      - "lib/seo.ts"
      - "lib/navigation-store.ts"
      - "db/adoption-schema.ts"
      - "db/foundation-schema.ts"
      - "drizzle/**"
      - "scripts/bootstrap-adoption-staging-ci.mjs"
      - "tests/e2e/organization-profile.spec.ts"
      - "tests/fixtures/organization-profile-e2e.sql"
      - "tests/organization-profile-presentation.test.mjs"
      - "tests/organization-profile-route.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "vite.config.*"
      - "tsconfig.json"
      - ".github/workflows/organization-profile-e2e.yml"

concurrency:
  group: organization-profile-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  organization-profile-e2e:
    name: Organization profile — desktop/mobile, Axe and overflow
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v4
      - name: Log revision evidence
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "pr_head_sha=${{ github.event.pull_request.head.sha || 'n/a' }}"
          echo "base_sha=${{ github.event.pull_request.base.sha || 'n/a' }}"
          echo "github_sha=${{ github.sha }}"
          echo "checked_out_sha=$(git rev-parse HEAD)"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build PR code
        run: npm run build
      - name: Configure CI-only local PII keys
        run: |
          cat > .dev.vars <<'EOF'
          PII_ENCRYPTION_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
          PII_HASH_KEY=ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA
          EOF
      - name: Apply foundation migrations to isolated local D1 only
        run: |
          mv drizzle/0038_adoption_staging_data.sql /tmp/0038_adoption_staging_data.sql
          mv drizzle/0039_activate_canonical_adoptions.sql /tmp/0039_activate_canonical_adoptions.sql
          trap 'mv /tmp/0038_adoption_staging_data.sql drizzle/0038_adoption_staging_data.sql; mv /tmp/0039_activate_canonical_adoptions.sql drizzle/0039_activate_canonical_adoptions.sql' EXIT
          npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to .wrangler/state
      - name: Seed adoption staging prerequisites into isolated local CI only
        env:
          PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
        run: node --experimental-strip-types scripts/bootstrap-adoption-staging-ci.mjs
      - name: Apply canonical adoption staging and activation to isolated local D1 only
        run: npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to .wrangler/state
      - name: Verify canonical adoption activation in isolated local D1 only
        env:
          PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
        run: node --experimental-strip-types scripts/bootstrap-adoption-staging-ci.mjs verify
      - name: Seed ORG-3B disposable profile fixture into isolated local D1 only
        run: npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/organization-profile-e2e.sql
      - name: Start isolated local app
        env:
          E2E_BASE_URL: http://localhost:5173
          PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
        run: |
          mkdir -p .e2e-artifacts/organization-profile
          nohup npm exec vite -- --host 127.0.0.1 > .e2e-artifacts/organization-profile/server.log 2>&1 &
          echo $! > .e2e-artifacts/organization-profile/server.pid
          ready=0
          for attempt in $(seq 1 120); do
            if curl --silent --fail http://localhost:5173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -200 .e2e-artifacts/organization-profile/server.log
            exit 1
          fi
      - name: Organization profile Playwright — desktop
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e -- tests/e2e/organization-profile.spec.ts --grep-invert @production --project=desktop-chromium
      - name: Organization profile Playwright — mobile
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e -- tests/e2e/organization-profile.spec.ts --grep-invert @production --project=mobile-chromium
      - name: UX-2A organization viewport matrix
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e -- tests/e2e/public-ux2a.spec.ts --grep "Organizácia wraps" --project=desktop-chromium
      - name: Stop isolated local app
        if: always()
        run: |
          if [ -f .e2e-artifacts/organization-profile/server.pid ]; then
            kill "$(cat .e2e-artifacts/organization-profile/server.pid)" 2>/dev/null || true
          fi
      - name: Upload organization profile failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: organization-profile-e2e-${{ github.run_attempt }}
          path: |
            .e2e-artifacts/organization-profile/
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 14
