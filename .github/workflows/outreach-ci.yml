name: OUTREACH-1 controlled outreach foundation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/admin/operations/outreach/**"
      - "app/api/admin/outreach/**"
      - "app/api/outreach/**"
      - "app/overenie-profilu/**"
      - "app/odhlasenie-osloveni/**"
      - "components/admin-outreach*.tsx"
      - "components/outreach-*.tsx"
      - "lib/outreach*.ts"
      - "drizzle/0053_outreach_foundation.sql"
      - "tests/outreach-foundation.test.mjs"
      - "tests/e2e/outreach.spec.ts"
      - "tests/fixtures/outreach-e2e.sql"
      - ".github/workflows/outreach-ci.yml"
      - ".env.example"
  workflow_dispatch:

concurrency:
  group: outreach-1-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Log revision evidence
        run: |
          echo "pr_head_sha=${{ github.event.pull_request.head.sha || 'n/a' }}"
          echo "base_sha=${{ github.event.pull_request.base.sha || 'n/a' }}"
          echo "checked_out_sha=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run db:check-migrations
      - name: Focused OUTREACH-1 contracts
        run: node --experimental-strip-types --test tests/outreach-foundation.test.mjs
      - run: npm run build
      - run: npm run lint

  mobile-a11y:
    if: github.event_name == 'pull_request'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Apply schema to isolated local D1
        run: |
          mv drizzle/0038_adoption_staging_data.sql /tmp/0038_adoption_staging_data.sql
          mv drizzle/0039_activate_canonical_adoptions.sql /tmp/0039_activate_canonical_adoptions.sql
          trap 'mv /tmp/0038_adoption_staging_data.sql drizzle/0038_adoption_staging_data.sql; mv /tmp/0039_activate_canonical_adoptions.sql drizzle/0039_activate_canonical_adoptions.sql' EXIT
          npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to .wrangler/state
      - name: Seed disposable outreach fixture
        run: npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/outreach-e2e.sql
      - name: Start local app
        run: |
          mkdir -p .e2e-artifacts/outreach
          nohup npm exec vite -- --host 127.0.0.1 > .e2e-artifacts/outreach/server.log 2>&1 &
          echo $! > .e2e-artifacts/outreach/server.pid
          ready=0
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://localhost:5173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
      - name: Mobile verification and Axe
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npx playwright test tests/e2e/outreach.spec.ts --project=desktop-chromium --workers=1 --retries=0
      - name: Stop local app
        if: always()
        run: |
          if [ -f .e2e-artifacts/outreach/server.pid ]; then
            kill "$(cat .e2e-artifacts/outreach/server.pid)" 2>/dev/null || true
          fi
