name: Admin Stability Read-Only Regression

on:
  pull_request:
    paths:
      - "app/admin/**"
      - "components/admin-**"
      - "lib/admin-**"
      - "lib/adoption-admin-store.ts"
      - "lib/help-organization-admin-store.ts"
      - "lib/lost-found-dog-store.ts"
      - "lib/organization-admin-read-state.ts"
      - "public/sw.js"
      - "tests/**"
      - "scripts/admin-type-regression-gate-step10.mjs"
      - "scripts/benchmark-admin-step9.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/admin-stability-regressions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-stability-readonly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out requested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for exact PR base worktree comparison

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm

      - name: Install pinned dependencies (no production credentials)
        run: npm ci

      - name: Admin regression suite – steps 1 to 9
        run: npm run test:admin-stability-step9

      - name: Synthetic SQLite query parity and diagnostic timings
        run: |
          npm run benchmark:admin-step9 > admin-step9-sqlite-benchmark.json
          cat admin-step9-sqlite-benchmark.json

      # main already contains hundreds of unrelated TS diagnostics. Preserve
      # the complete diagnostic output, but fail only on newly introduced
      # errors compared to the exact base commit used by this pull request.
      - name: TypeScript project regression gate against current main
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/admin-ts-baseline" "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/admin-ts-baseline/node_modules"
          set +e
          (cd "$RUNNER_TEMP/admin-ts-baseline" && "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit --pretty false --incremental false) > "$RUNNER_TEMP/admin-main-types.log" 2>&1
          BASE_EXIT=$?
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit --pretty false --incremental false > "$RUNNER_TEMP/admin-pr-types.log" 2>&1
          PR_EXIT=$?
          set -e
          node scripts/admin-type-regression-gate-step10.mjs "$RUNNER_TEMP/admin-main-types.log" "$RUNNER_TEMP/admin-pr-types.log" "$BASE_EXIT" "$PR_EXIT"

      - name: Production-style build diagnostic (never deploy)
        continue-on-error: true
        run: npm run build

      - name: Upload full type diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-step10-typecheck-logs
          path: |
            ${{ runner.temp }}/admin-main-types.log
            ${{ runner.temp }}/admin-pr-types.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save local SQLite diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-step9-readonly-benchmark
          path: admin-step9-sqlite-benchmark.json
          if-no-files-found: ignore
          retention-days: 7

# Deliberately no Cloudflare bindings, deployment token, Notion key,
# production database, browser auth session, migration or mutation job.
# Browser E2E is separately invoked in an authenticated test environment:
# npm run e2e:admin-stability-step9
