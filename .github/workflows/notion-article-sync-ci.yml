name: NOTION-SYNC focused validation

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/notion-article-sync.ts"
      - "lib/article-subsection-taxonomy.ts"
      - "lib/notion-breed-sync.ts"
      - "lib/notion-event-sync.ts"
      - "lib/notion-sync-shared.ts"
      - "app/api/admin/notion-sync/**"
      - "app/api/admin/notion-breeds-sync/**"
      - "app/api/admin/notion-events-sync/**"
      - "app/api/admin/breeds/[id]/route.ts"
      - "app/api/admin/events/[id]/route.ts"
      - "app/api/admin/events/bulk/route.ts"
      - "worker/index.ts"
      - "config/runtime-env.ts"
      - ".env.example"
      - "drizzle/0044_notion_article_sync.sql"
      - "drizzle/0045_notion_breed_sync.sql"
      - "drizzle/0047_notion_event_sync.sql"
      - "tests/notion-article-sync.test.mjs"
      - "tests/notion-breed-sync.test.mjs"
      - "tests/notion-event-sync.test.mjs"
      - "tests/config-contract.test.mjs"
      - "scripts/check-config-contract.mjs"
      - "scripts/check-migration-safety.mjs"
      - "migration-safety.baseline.json"
      - "package-lock.json"
      - ".github/workflows/notion-article-sync-ci.yml"

permissions:
  contents: read

concurrency:
  group: notion-article-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  notion-article-sync:
    name: Notion sync contract and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Revision evidence
        run: |
          echo "pr_head_sha=${{ github.event.pull_request.head.sha }}"
          echo "base_sha=${{ github.event.pull_request.base.sha }}"
          echo "checked_out_sha=$(git rev-parse HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configuration contract
        run: npm run test:config

      - name: Migration safety
        run: npm run test:migration-safety

      - name: Notion sync safety contract
        run: node --test tests/notion-article-sync.test.mjs tests/notion-breed-sync.test.mjs tests/notion-event-sync.test.mjs

      - name: Production build
        run: npm run build
