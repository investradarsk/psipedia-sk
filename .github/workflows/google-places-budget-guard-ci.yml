name: Google Places budget guard tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/google-places-budget-guard/**'
      - '.github/workflows/google-places-budget-guard-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget-guard:
    name: Validate 5 EUR auto-disable policy (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check handler syntax (no credentials or API calls)
        run: npm run check
        working-directory: ops/google-places-budget-guard
      - name: Run isolated policy and Service Usage API tests
        run: npm test
        working-directory: ops/google-places-budget-guard
