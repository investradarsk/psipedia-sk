name: One-time update section tests
on:
  push:
    branches: [fix/admin-section-source-of-truth]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-section-source-of-truth
      - name: Update section editor assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/rendered-html.test.mjs')
          t = p.read_text()
          replacements = {
            'assert.match(articleEditorSource, /Oblasť Zdravia a starostlivosti/);': 'assert.match(articleEditorSource, /article-portal-area/);\n  assert.match(articleEditorSource, /managedSections/);\n  assert.match(articleEditorSource, /areasFor/);',
            'assert.match(articleEditorSource, /Oblasť Výcviku a aktivít/);': 'assert.match(articleEditorSource, /article-portal-area/);\n  assert.match(articleEditorSource, /managedSections/);\n  const portalSource = readFileSync(new URL("../lib/portal.ts", import.meta.url), "utf8");\n  assert.match(portalSource, /slug: "trening", label: "Tréning"/);',
            'assert.match(articleEditorSource, /Oblasť Šteniatok/);': 'assert.match(articleEditorSource, /article-portal-area/);\n  assert.match(articleEditorSource, /managedSections/);',
          }
          for old, new in replacements.items():
              if old not in t:
                  raise SystemExit(f'Missing expected assertion: {old}')
              t = t.replace(old, new, 1)
          p.write_text(t)
          PY
      - name: Commit test update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/rendered-html.test.mjs
          git diff --cached --check
          git commit -m "Align portal tests with managed article sections"
          git push origin HEAD:fix/admin-section-source-of-truth
