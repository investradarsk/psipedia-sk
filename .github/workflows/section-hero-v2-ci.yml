name: SECTION-HERO-V2 validation

on:
  pull_request:
    branches: [main]
    paths:
      - "components/public-visual-system/**"
      - "components/admin-section-visuals.tsx"
      - "components/admin-section-visuals.module.css"
      - "components/editorial-section*"
      - "components/portal-hub*"
      - "components/portal-topic*"
      - "components/directory-page*"
      - "components/events-page*"
      - "components/help-overview*"
      - "components/help-page*"
      - "components/help-browser*"
      - "components/lost-found-dogs.module.css"
      - "components/adoption-catalog*"
      - "components/lost-found-dogs-page*"
      - "components/reviews-hub*"
      - "app/page.tsx"
      - "app/clanky/page.tsx"
      - "app/hladat/page.tsx"
      - "app/plemena/page.tsx"
      - "app/pomoc-psom/**"
      - "app/globals.css"
      - "app/[section]/page.tsx"
      - "app/[section]/[slug]/page.tsx"
      - "lib/portal.ts"
      - "lib/portal-search.ts"
      - "lib/section-store.ts"
      - "lib/section-visual-contract.ts"
      - "lib/section-visual-store.ts"
      - "drizzle/0107_section_hero_config.sql"
      - "tests/section-hero-v2.test.mjs"
      - "tests/unified-section-hero.test.mjs"
      - "tests/e2e/unified-section-hero.spec.ts"
      - "tests/public-landing-alignment.test.mjs"
      - "tests/e2e/public-landing-alignment.spec.ts"
      - "package-lock.json"
      - "scripts/production-d1-migrate.mjs"
      - ".github/workflows/production-d1-migrate.yml"
      - ".github/workflows/section-hero-v2-ci.yml"

permissions:
  contents: read
  checks: read

concurrency:
  group: section-hero-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    if: github.head_ref == 'codex/section-hero-v2' || github.head_ref == 'codex/mobile-hero-fullwidth-1' || github.head_ref == 'codex/public-landing-alignment-1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: SECTION-HERO-V2 focused contracts
        run: npm run test:section-hero-v2
      - name: Unified hero regression contracts
        run: npm run test:unified-section-hero
      - name: Public landing alignment contracts
        run: npm run test:public-landing-alignment
      - name: Production migration contracts
        run: npm run test:migration-safety
      - name: Full test suite
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  preview-visual:
    if: github.head_ref == 'codex/section-hero-v2' || github.head_ref == 'codex/mobile-hero-fullwidth-1' || github.head_ref == 'codex/public-landing-alignment-1'
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Resolve exact Cloudflare preview for PR head
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/check-runs"
          preview_url=""
          for attempt in $(seq 1 90); do
            payload="$(curl --silent --show-error --fail \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}")"
            state="$(printf '%s' "${payload}" | node -e '
              let x=""; process.stdin.on("data",d=>x+=d).on("end",()=>{
                const runs=JSON.parse(x).check_runs||[];
                const run=runs.find(item=>item.name==="Workers Builds: psipedia-sk");
                process.stdout.write(run ? String(run.status)+"|"+String(run.conclusion||"") : "missing|");
              });
            ')"
            if [ "${state}" = "completed|failure" ]; then
              echo "::error::Cloudflare Workers Build failed for ${PR_HEAD_SHA}."
              exit 1
            fi
            if [ "${state}" = "completed|success" ]; then
              preview_url="$(printf '%s' "${payload}" | node -e '
                let x=""; process.stdin.on("data",d=>x+=d).on("end",()=>{
                  const runs=JSON.parse(x).check_runs||[];
                  const run=runs.find(item=>item.name==="Workers Builds: psipedia-sk");
                  const summary=run?.output?.summary||"";
                  const match=summary.match(/Preview URL:\s*(https:\/\/[^\s]+)/);
                  process.stdout.write(match?.[1]||"");
                });
              ')"
              if [ -n "${preview_url}" ]; then break; fi
            fi
            sleep 5
          done
          test -n "${preview_url}"
          echo "url=${preview_url}" >> "$GITHUB_OUTPUT"

      - name: 390 430 768 1280 1440 1920 visual audit
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
          UNIFIED_SECTION_HERO_ARTIFACT_DIR: .e2e-artifacts/section-hero-v2
        run: npx playwright test tests/e2e/unified-section-hero.spec.ts --project=desktop-chromium --workers=1 --retries=0

      - name: PUBLIC-LANDING-ALIGNMENT geometry and screenshot audit
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
          PUBLIC_LANDING_ALIGNMENT_ARTIFACT_DIR: .e2e-artifacts/public-landing-alignment
        run: npx playwright test tests/e2e/public-landing-alignment.spec.ts --project=desktop-chromium --workers=1 --retries=0

      - name: Upload SECTION-HERO-V2 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section-hero-v2-screenshots-${{ github.run_attempt }}
          path: .e2e-artifacts/section-hero-v2/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload PUBLIC-LANDING-ALIGNMENT screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-landing-alignment-screenshots-${{ github.run_attempt }}
          path: .e2e-artifacts/public-landing-alignment/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: section-hero-v2-playwright-failure-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 14
