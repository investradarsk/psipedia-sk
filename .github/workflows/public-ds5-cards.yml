name: Public DS-5 card and media contract

on:
  pull_request:
    paths:
      - "app/design-system.css"
      - "app/globals.css"
      - "components/public-visual-system/**"
      - "tests/public-filter-unification.test.mjs"
      - "tests/public-banner-variants.test.mjs"
      - "tests/public-photo-gallery.test.mjs"
      - "components/directory-public.module.css"
      - "components/help-public.module.css"
      - "components/adoption.module.css"
      - "components/events-public.module.css"
      - "tests/public-ds5-cards.test.mjs"
      - "tests/public-design-tokens.test.mjs"
      - ".github/workflows/public-ds5-cards.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ds5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ds5-visual-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax and shared visual regressions
        run: |
          node --check tests/public-ds5-cards.test.mjs
          node --check tests/public-design-tokens.test.mjs
          node --test tests/public-ds5-cards.test.mjs tests/public-design-tokens.test.mjs tests/public-form-controls.test.mjs tests/public-filter-unification.test.mjs tests/public-banner-variants.test.mjs tests/public-photo-gallery.test.mjs tests/public-result-states.test.mjs tests/public-search-simplify.test.mjs
      - name: Native filter URL contracts
        run: node --experimental-strip-types --experimental-loader ./tests/admin-events-loader.mjs --test tests/directory-public-filters.test.mjs tests/lost-found-gallery-preservation.test.mjs
