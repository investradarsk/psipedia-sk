name: Directory 0176 – SQL fields step 1/4 (offline)

on:
  pull_request:
    branches: [main]
    paths:
      - "db/isolated/directory_admin_sql_completion.sql"
      - "db/directory-storage-schema.ts"
      - "lib/directory-admin-sql-field-owners.mjs"
      - "tests/directory-0176-sql-schema.test.mjs"
      - ".github/workflows/directory-0176-sql-fields.yml"

permissions:
  contents: read

jobs:
  schema:
    name: Directory 0176 SQLite schema + Admin field coverage
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - name: Validate full SQL schema and field coverage without production access
        run: node --test tests/directory-0176-sql-schema.test.mjs
