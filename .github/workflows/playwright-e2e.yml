name: Playwright E2E and production smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"

concurrency:
  group: playwright-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build, lint and unit/integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build and run unit/integration tests
        run: npm test

  pull-request-e2e:
    name: Playwright E2E against PR code (desktop and mobile)
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build PR code
        run: npm run build
      - name: Apply migrations to local D1 only
        run: npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to .wrangler/state
      - name: Bootstrap local review data and run event filter regression against PR code
        env:
          E2E_BASE_URL: http://localhost:5173
          PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
        run: |
          mkdir -p .e2e-artifacts
          npm exec vite -- --host 127.0.0.1 > .e2e-artifacts/local-server.log 2>&1 &
          E2E_SERVER_PID=$!
          cleanup() {
            kill "$E2E_SERVER_PID" 2>/dev/null || true
            wait "$E2E_SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          E2E_SERVER_READY=0
          for E2E_ATTEMPT in $(seq 1 120); do
            if curl --silent --fail http://localhost:5173/ >/dev/null; then
              E2E_SERVER_READY=1
              break
            fi
            sleep 1
          done
          if [ "$E2E_SERVER_READY" -ne 1 ]; then
            tail -200 .e2e-artifacts/local-server.log
            exit 1
          fi

          node scripts/bootstrap-phase5-e2e.mjs
          npm run e2e -- --grep "event category and time filters keep a shareable URL across reload"
      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pr-html-report-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload screenshots, video, traces and server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pr-failure-evidence-${{ github.run_attempt }}
          path: |
            test-results/playwright/
            .e2e-artifacts/local-server.log
          if-no-files-found: ignore
          retention-days: 14

  production-smoke:
    name: Playwright production smoke (desktop and mobile)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run all 16 read-only production browser tests
        run: npm run e2e:production
      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload screenshots, video and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence-${{ github.run_attempt }}
          path: test-results/playwright/
          if-no-files-found: ignore
          retention-days: 14

  notify-production-failure:
    name: Notify owner about failed production smoke
    needs: production-smoke
    if: ${{ always() && github.event_name != 'pull_request' && needs.production-smoke.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create GitHub notification issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              ...context.repo,
              title: `Production smoke zlyhal – run #${context.runNumber}`,
              body: `Playwright production smoke pre Psipediu zlyhal.\n\n[Otvoriť workflow a artifacts](${runUrl})`,
              assignees: [context.repo.owner],
            });
