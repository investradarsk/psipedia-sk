name: Playwright E2E and production smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/lost-found-dogs]
  schedule:
    - cron: "17 5 * * *"

concurrency:
  group: playwright-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build, lint and unit/integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Isolated badge test in fresh Node process
        id: isolated_badge
        shell: bash
        run: |
          cp tests/directory-inquiry-notifications.test.mjs /tmp/directory-inquiry-notifications.test.mjs.orig
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/directory-inquiry-notifications.test.mjs')
          s = p.read_text()
          s = s.replace(
            '  const before = await request(worker, d1, "/admin/dopyty", { method: "GET" }, true);',
            '  console.error("BADGE_CHECKPOINT first-get start");\n  const before = await request(worker, d1, "/admin/dopyty", { method: "GET" }, true);\n  console.error("BADGE_CHECKPOINT first-get response", before.status);'
          )
          s = s.replace(
            '  const update = await request(worker, d1, `/api/admin/inquiries/${firstId}`, {',
            '  console.error("BADGE_CHECKPOINT update start");\n  const update = await request(worker, d1, `/api/admin/inquiries/${firstId}`, {'
          )
          s = s.replace(
            '  assert.equal(update.status, 200);\n  const after = await request(worker, d1, "/admin/dopyty", { method: "GET" }, true);',
            '  assert.equal(update.status, 200);\n  console.error("BADGE_CHECKPOINT update response", update.status);\n  console.error("BADGE_CHECKPOINT second-get start");\n  const after = await request(worker, d1, "/admin/dopyty", { method: "GET" }, true);\n  console.error("BADGE_CHECKPOINT second-get response", after.status);'
          )
          p.write_text(s)
          PY
          set +e
          node --experimental-loader ./tests/cloudflare-loader.mjs --test --test-name-pattern="admin badge reflects new inquiry count and decreases after new to read" tests/directory-inquiry-notifications.test.mjs 2>&1 | tee /tmp/isolated-badge.log
          ISOLATED_STATUS=${PIPESTATUS[0]}
          cp /tmp/directory-inquiry-notifications.test.mjs.orig tests/directory-inquiry-notifications.test.mjs
          echo "isolated_status=$ISOLATED_STATUS" >> "$GITHUB_OUTPUT"
          echo "ISOLATED_BADGE_EXIT=$ISOLATED_STATUS" >> "$GITHUB_ENV"
          exit 0
      - name: Full directory inquiry test file in fresh Node process
        id: full_directory_file
        shell: bash
        run: |
          set +e
          node --experimental-loader ./tests/cloudflare-loader.mjs --test tests/directory-inquiry-notifications.test.mjs 2>&1 | tee /tmp/full-directory-inquiry.log
          FULL_STATUS=${PIPESTATUS[0]}
          echo "full_status=$FULL_STATUS" >> "$GITHUB_OUTPUT"
          echo "FULL_DIRECTORY_EXIT=$FULL_STATUS" >> "$GITHUB_ENV"
          exit 0
      - name: Checkout main control without changing main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-control
      - name: Build main control
        shell: bash
        run: |
          cd main-control
          npm ci
          npm run build
      - name: Repeatedly render main /admin/dopyty in one Node process
        id: main_control
        shell: bash
        run: |
          set +e
          node --experimental-loader ./tests/cloudflare-loader.mjs --input-type=module <<'NODE' 2>&1 | tee /tmp/main-control.log
          import { DatabaseSync } from "node:sqlite";
          import { pathToFileURL } from "node:url";

          function createD1Adapter(sqlite) {
            function statement(sql, bindings = []) {
              function execute() {
                const prepared = sqlite.prepare(sql);
                if (/^\s*(SELECT|WITH|PRAGMA|EXPLAIN)\b/i.test(sql) || /\bRETURNING\b/i.test(sql)) {
                  return { success: true, results: prepared.all(...bindings), meta: { changes: 0 } };
                }
                const result = prepared.run(...bindings);
                return { success: true, results: [], meta: { changes: Number(result.changes), last_row_id: Number(result.lastInsertRowid ?? 0) } };
              }
              return {
                bind(...values) { return statement(sql, values); },
                async all() { return execute(); },
                async first() { return execute().results[0] ?? null; },
                async run() { return execute(); },
                execute,
              };
            }
            return {
              prepare(sql) { return statement(sql); },
              async batch(statements) {
                sqlite.exec("BEGIN");
                try {
                  const results = statements.map((item) => item.execute());
                  sqlite.exec("COMMIT");
                  return results;
                } catch (error) {
                  sqlite.exec("ROLLBACK");
                  throw error;
                }
              },
            };
          }

          const sqlite = new DatabaseSync(":memory:");
          sqlite.exec(`
            PRAGMA foreign_keys = ON;
            CREATE TABLE directory_profiles (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              slug TEXT NOT NULL,
              name TEXT NOT NULL,
              category TEXT NOT NULL,
              status TEXT NOT NULL DEFAULT 'draft',
              internal_email TEXT
            );
            CREATE TABLE directory_inquiries (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              profile_id INTEGER,
              profile_name TEXT NOT NULL,
              profile_slug TEXT NOT NULL,
              profile_category TEXT NOT NULL,
              recipient_email TEXT,
              sender_name TEXT NOT NULL,
              sender_email TEXT NOT NULL,
              sender_phone TEXT NOT NULL DEFAULT '',
              dog_info TEXT NOT NULL DEFAULT '',
              message TEXT NOT NULL,
              status TEXT NOT NULL DEFAULT 'new',
              consent INTEGER NOT NULL DEFAULT 1,
              created_at TEXT NOT NULL,
              updated_at TEXT NOT NULL
            );
            CREATE INDEX directory_inquiries_status_created_idx ON directory_inquiries(status, created_at);
            CREATE INDEX directory_inquiries_profile_idx ON directory_inquiries(profile_id, created_at);
            CREATE INDEX directory_inquiries_email_idx ON directory_inquiries(sender_email, created_at);
          `);
          const d1 = createD1Adapter(sqlite);
          const runtime = (globalThis.__CLOUDFLARE_WORKERS_ENV__ ??= {});
          Object.assign(runtime, { DB: d1, ADMIN_EMAILS: "admin@psipedia.sk" });
          const workerUrl = pathToFileURL(`${process.cwd()}/main-control/dist/server/index.js`);
          workerUrl.searchParams.set("main-control", `${Date.now()}-${Math.random()}`);
          const worker = (await import(workerUrl.href)).default;

          async function render(label) {
            Object.assign(runtime, { DB: d1, ADMIN_EMAILS: "admin@psipedia.sk" });
            try {
              const response = await worker.fetch(
                new Request("http://localhost/admin/dopyty", { headers: { "oai-authenticated-user-email": "admin@psipedia.sk" } }),
                { ASSETS: { fetch: async () => new Response("Not found", { status: 404 }) }, DB: d1, ADMIN_EMAILS: "admin@psipedia.sk" },
                { waitUntil() {}, passThroughOnException() {} },
              );
              const body = await response.text();
              console.log(`MAIN_CONTROL ${label} status=${response.status} body=${body.length}`);
              if (response.status !== 200) process.exitCode = 1;
            } catch (error) {
              console.error(`MAIN_CONTROL ${label} threw`, error?.stack || error);
              process.exitCode = 1;
            }
          }

          await render("first");
          await render("second");
          await render("third");
          NODE
          MAIN_STATUS=${PIPESTATUS[0]}
          echo "main_status=$MAIN_STATUS" >> "$GITHUB_OUTPUT"
          echo "MAIN_CONTROL_EXIT=$MAIN_STATUS" >> "$GITHUB_ENV"
          exit 0
      - name: Diagnostic summary and stop gate
        shell: bash
        run: |
          echo "isolated badge exit: ${ISOLATED_BADGE_EXIT}"
          echo "full directory file exit: ${FULL_DIRECTORY_EXIT}"
          echo "main repeated render exit: ${MAIN_CONTROL_EXIT}"
          echo "--- isolated checkpoints ---"
          grep -E "BADGE_CHECKPOINT|digest|admin badge reflects" /tmp/isolated-badge.log || true
          echo "--- full file badge failure ---"
          grep -E "digest|admin badge reflects" /tmp/full-directory-inquiry.log || true
          echo "--- main control ---"
          cat /tmp/main-control.log || true
          exit 1

  pull-request-e2e:
    name: Breed CI bootstrap, all-breed regression and Playwright
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/codex/lost-found-dogs'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build PR code
        run: npm run build
      - name: Configure CI-only local PII keys
        run: |
          cat > .dev.vars <<'EOF'
          PII_ENCRYPTION_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
          PII_HASH_KEY=ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA
          EOF
      - name: Apply migrations to local D1 only
        run: npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to .wrangler/state
      - name: Prepare deterministic breed CI fixture and White Swiss image
        env:
          E2E_BASE_URL: http://localhost:5173
          PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
        run: node scripts/bootstrap-breed-e2e.mjs prepare
      - name: Start local app server
        env:
          E2E_BASE_URL: http://localhost:5173
          PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
        run: |
          mkdir -p .e2e-artifacts
          nohup npm exec vite -- --host 127.0.0.1 > .e2e-artifacts/local-server.log 2>&1 &
          echo $! > .e2e-artifacts/local-server.pid
          E2E_SERVER_READY=0
          for E2E_ATTEMPT in $(seq 1 120); do
            if curl --silent --fail http://localhost:5173/ >/dev/null; then
              E2E_SERVER_READY=1
              break
            fi
            sleep 1
          done
          if [ "$E2E_SERVER_READY" -ne 1 ]; then
            tail -200 .e2e-artifacts/local-server.log
            exit 1
          fi
      - name: Seed breeds into local CI D1 only
        id: seed
        env:
          E2E_BASE_URL: http://localhost:5173
          PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
        run: node scripts/bootstrap-breed-e2e.mjs seed
      - name: Seed LOST/FOUND fixtures into local CI D1 only
        id: lost_found_seed
        run: |
          mkdir -p .e2e-artifacts/lost-found
          npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/lost-found-e2e.sql
      - name: All-breed regression — exactly 343 published URLs
        id: audit
        env:
          E2E_BASE_URL: http://localhost:5173
        run: node scripts/audit-breed-profiles-ci.mjs --base http://localhost:5173
      - name: Breed-specific Playwright — desktop
        id: breed_desktop
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e -- tests/e2e/breed-profile.spec.ts --project=desktop-chromium
      - name: Breed-specific Playwright — mobile
        id: breed_mobile
        if: ${{ always() && steps.seed.outcome == 'success' && steps.audit.outcome == 'success' }}
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e -- tests/e2e/breed-profile.spec.ts --project=mobile-chromium
      - name: Lost/found dogs Playwright + accessibility — desktop
        id: lost_found_desktop
        if: ${{ always() && steps.seed.outcome == 'success' && steps.lost_found_seed.outcome == 'success' }}
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e -- tests/e2e/lost-found-dogs.spec.ts --project=desktop-chromium
      - name: Lost/found dogs Playwright + accessibility — mobile
        id: lost_found_mobile
        if: ${{ always() && steps.seed.outcome == 'success' && steps.lost_found_seed.outcome == 'success' && steps.lost_found_desktop.outcome == 'success' }}
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e -- tests/e2e/lost-found-dogs.spec.ts --project=mobile-chromium
      - name: Upload LOST/FOUND public screenshots
        if: ${{ always() && steps.lost_found_desktop.outcome == 'success' && steps.lost_found_mobile.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: lost-found-public-screenshots-${{ github.run_attempt }}
          path: .e2e-artifacts/lost-found/
          if-no-files-found: error
          retention-days: 14
      - name: Stop local app server
        if: always()
        run: |
          if [ -f .e2e-artifacts/local-server.pid ]; then
            kill "$(cat .e2e-artifacts/local-server.pid)" 2>/dev/null || true
          fi
      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-breed-pr-html-report-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload screenshots, video, traces and server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-breed-pr-failure-evidence-${{ github.run_attempt }}
          path: |
            test-results/playwright/
            .e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  production-smoke:
    name: Playwright production smoke (${{ matrix.label }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: desktop
            project: desktop-chromium
          - label: mobile
            project: mobile-chromium
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run read-only production browser tests — ${{ matrix.label }}
        env:
          E2E_BASE_URL: https://psipedia.sk
        run: npx playwright test --grep @production --project="${{ matrix.project }}"
      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-production-${{ matrix.label }}-html-report-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload screenshots, video and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-production-${{ matrix.label }}-failure-evidence-${{ github.run_attempt }}
          path: test-results/playwright/
          if-no-files-found: ignore
          retention-days: 14

  notify-production-failure:
    name: Notify owner about failed production smoke
    needs: production-smoke
    if: ${{ always() && github.event_name != 'pull_request' && needs.production-smoke.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create GitHub notification issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              ...context.repo,
              title: `Production smoke zlyhal – run #${context.runNumber}`,
              body: `Playwright production smoke pre Psipediu zlyhal.\n\n[Otvoriť workflow a artifacts](${runUrl})`,
              assignees: [context.repo.owner],
            });
