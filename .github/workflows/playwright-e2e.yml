name: Playwright E2E and production smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Expose original RSC exception
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Patch installed vinext diagnostics only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("node_modules/vinext/dist/server/app-rsc-errors.js")
          s = p.read_text()
          old = 'function createRscOnErrorHandler(options) {\n\treturn (error) => {'
          new = 'function createRscOnErrorHandler(options) {\n\treturn (error) => {\n\t\tconsole.error("RSC_ORIGINAL_DIAG", error, error instanceof Error ? error.stack : "");'
          if old not in s:
              raise SystemExit("vinext RSC handler pattern not found")
          p.write_text(s.replace(old, new, 1))
          print("patched", p)
          PY
      - name: Fresh production build with diagnostic runtime
        run: npm run build
      - name: Isolated badge test and original exception
        shell: bash
        run: |
          set +e
          node --experimental-loader ./tests/cloudflare-loader.mjs --test --test-name-pattern="admin badge reflects new inquiry count and decreases after new to read" tests/directory-inquiry-notifications.test.mjs 2>&1 | tee /tmp/badge-original.log
          STATUS=${PIPESTATUS[0]}
          echo "BADGE_EXIT=$STATUS"
          echo "--- original RSC diagnostic lines ---"
          grep -A20 -B5 "RSC_ORIGINAL_DIAG" /tmp/badge-original.log || true
          exit 1
