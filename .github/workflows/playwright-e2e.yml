name: Playwright E2E and production smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/lost-found-dogs, codex/hotfix-seo-sitemap-runtime-2]
  schedule:
    - cron: "17 5 * * *"

concurrency:
  group: playwright-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/hotfix-seo-sitemap-runtime-2')) }}

permissions:
  contents: read

jobs:
  pr-scope:
    name: Detect PR E2E scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      admin_events: ${{ steps.scope.outputs.admin_events }}
      search: ${{ steps.scope.outputs.search }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Detect changed feature areas
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/changed-files.txt
          cat /tmp/changed-files.txt

          admin_events=false
          if grep -Eq '^(app/admin/events/|app/api/admin/events/|components/admin-events|lib/admin-events|scripts/bootstrap-admin-events-e2e\.mjs$|scripts/check-admin-events-local\.mjs$|tests/e2e/admin-events\.spec\.ts$|tests/admin-events|\.github/workflows/playwright-e2e\.yml$)' /tmp/changed-files.txt; then
            admin_events=true
          fi

          search=false
          if grep -Eq '^(app/hladat/|components/site-header\.tsx$|lib/portal-search|tests/portal-search\.test\.mjs$|tests/e2e/search\.spec\.ts$|tests/fixtures/search-e2e\.sql$|\.github/workflows/playwright-e2e\.yml$)' /tmp/changed-files.txt; then
            search=true
          fi

          echo "admin_events=${admin_events}" >> "${GITHUB_OUTPUT}"
          echo "search=${search}" >> "${GITHUB_OUTPUT}"

  validate:
    name: Build, lint and unit/integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log revision evidence
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "pr_head_sha=${{ github.event.pull_request.head.sha || 'n/a' }}"
          echo "base_sha=${{ github.event.pull_request.base.sha || 'n/a' }}"
          echo "github_sha=${{ github.sha }}"
          echo "checked_out_sha=$(git rev-parse HEAD)"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Adoption unit/integration suite
        run: node --experimental-strip-types --experimental-loader ./tests/cloudflare-loader.mjs --test tests/adoption-foundation.test.mjs tests/adoption-catalog.test.mjs tests/adoption-detail.test.mjs tests/adoption-sitemap-integration.test.mjs tests/adoption-admin-list.test.mjs tests/adoption-admin-editor.test.mjs

  pull-request-e2e:
    name: Breed CI bootstrap, all-breed regression and Playwright
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build PR code
        run: npm run build
      - name: Configure CI-only local PII keys
        run: |
          cat > .dev.vars <<'EOF'
          PII_ENCRYPTION_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
          PII_HASH_KEY=ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA
          TURNSTILE_SITE_KEY=1x00000000000000000000AA
          EOF
      - name: Apply foundation migrations to local D1 only
        run: |
          mv drizzle/0038_adoption_staging_data.sql /tmp/0038_adoption_staging_data.sql
          mv drizzle/0039_activate_canonical_adoptions.sql /tmp/0039_activate_canonical_adoptions.sql
          trap 'mv /tmp/0038_adoption_staging_data.sql drizzle/0038_adoption_staging_data.sql; mv /tmp/0039_activate_canonical_adoptions.sql drizzle/0039_activate_canonical_adoptions.sql' EXIT
          npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to .wrangler/state
      - name: Seed adoption staging prerequisites into isolated local CI only
        env:
          PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
        run: node --experimental-strip-types scripts/bootstrap-adoption-staging-ci.mjs
      - name: Apply adoption staging migration to local D1 only
        run: npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to .wrangler/state
      - name: Verify canonical adoption activation in local D1 only
        env:
          PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
        run: node --experimental-strip-types scripts/bootstrap-adoption-staging-ci.mjs verify
      - name: Prepare deterministic breed CI fixture and White Swiss image
        env:
          E2E_BASE_URL: http://localhost:5173
          PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
        run: node scripts/bootstrap-breed-e2e.mjs prepare
      - name: Seed MONETIZATION-1 fixture into isolated local CI only
        run: npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/monetization-e2e.sql
      - name: Start local app server
        env:
          E2E_BASE_URL: http://localhost:5173
          PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
        run: |
          mkdir -p .e2e-artifacts
          nohup npm exec vite -- --host 127.0.0.1 > .e2e-artifacts/local-server.log 2>&1 &
          echo $! > .e2e-artifacts/local-server.pid
          E2E_SERVER_READY=0
          for E2E_ATTEMPT in $(seq 1 120); do
            if curl --silent --fail http://localhost:5173/ >/dev/null; then
              E2E_SERVER_READY=1
              break
            fi
            sleep 1
          done
          if [ "$E2E_SERVER_READY" -ne 1 ]; then
            tail -200 .e2e-artifacts/local-server.log
            exit 1
          fi
      - name: REVIEWS-LAUNCH reviewer auth render hardening — desktop and mobile
        env:
          E2E_BASE_URL: http://localhost:5173
        run: >-
          npm run e2e -- tests/e2e/review-author-auth.spec.ts
          --grep "fresh anonymous reviewer login|fresh RSC navigation to reviewer auth|reviewer auth is accessible"
          --workers=1 --retries=0
      - name: MONETIZATION-1 mobile layout, tracking and accessibility
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e -- tests/e2e/monetization.spec.ts --project=desktop-chromium
      - name: Materialize canonical managed Portal sections in isolated local CI only
        env:
          E2E_BASE_URL: http://localhost:5173
          PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
        run: node scripts/bootstrap-phase5-e2e.mjs sections-only
      - name: Public navigation Playwright — desktop and mobile
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e -- tests/e2e/public-navigation.spec.ts
      - name: NAME-DAY-1 canonical calendar Playwright + accessibility
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e -- tests/e2e/name-days.spec.ts
      - name: HOME-1 focused Playwright, accessibility and screenshots
        env:
          E2E_BASE_URL: http://localhost:5173
          HOME1_CAPTURE_PRODUCTION: "1"
        run: |
          mkdir -p .e2e-artifacts/home-1
          npm run e2e -- tests/e2e/home-mobile-refinement.spec.ts --project=desktop-chromium
      - name: Seed breeds into local CI D1 only
        id: seed
        env:
          E2E_BASE_URL: http://localhost:5173
          PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
        run: node scripts/bootstrap-breed-e2e.mjs seed
      - name: Seed LOST/FOUND fixtures into local CI D1 only
        id: lost_found_seed
        run: |
          mkdir -p .e2e-artifacts/lost-found
          npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/lost-found-e2e.sql
      - name: Seed Help detail fixtures into local CI D1 only
        id: help_detail_seed
        run: npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/help-detail-e2e.sql
      - name: Seed Directory admin filter fixtures into local CI D1 only
        id: directory_seed
        run: npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/directory-admin-e2e.sql
      - name: Seed adoption fixtures into local CI D1 only
        id: adoption_seed
        env:
          E2E_BASE_URL: http://localhost:5173
          PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
        run: node scripts/bootstrap-adoption-e2e.mjs
      - name: UX-2A core public viewport matrix
        id: public_ux2a
        if: ${{ always() && steps.seed.outcome == 'success' && steps.help_detail_seed.outcome == 'success' }}
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e -- tests/e2e/public-ux2a.spec.ts --grep-invert "Organizácia wraps" --project=desktop-chromium
      - name: PUBLIC-POLISH-2 image, header, flow, overflow and accessibility
        id: public_polish_v2
        if: ${{ always() && steps.seed.outcome == 'success' && steps.help_detail_seed.outcome == 'success' && steps.directory_seed.outcome == 'success' }}
        env:
          E2E_BASE_URL: http://localhost:5173
        run: |
          mkdir -p .e2e-artifacts/public-polish-v2
          npm run e2e -- tests/e2e/public-polish-v2.spec.ts --project=desktop-chromium --workers=1 --retries=0
      - name: Upload PUBLIC-POLISH-2 visual audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-polish-v2-visual-evidence-${{ github.run_attempt }}
          path: .e2e-artifacts/public-polish-v2/
          if-no-files-found: warn
          retention-days: 14
      - name: HELP-PUBLIC Playwright + accessibility — desktop and mobile
        id: help_public
        if: ${{ always() && steps.lost_found_seed.outcome == 'success' && steps.help_detail_seed.outcome == 'success' && steps.adoption_seed.outcome == 'success' }}
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e -- tests/e2e/help-public-v2.spec.ts
      - name: Adoption Playwright + accessibility — desktop
        id: adoption_desktop
        if: ${{ always() && steps.adoption_seed.outcome == 'success' }}
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e -- tests/e2e/adoption.spec.ts --project=desktop-chromium
      - name: Adoption Playwright + accessibility — mobile
        id: adoption_mobile
        if: ${{ always() && steps.adoption_seed.outcome == 'success' && steps.adoption_desktop.outcome == 'success' }}
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e -- tests/e2e/adoption.spec.ts --project=mobile-chromium
      - name: All-breed regression — exactly 343 published URLs
        id: audit
        env:
          E2E_BASE_URL: http://localhost:5173
        run: node scripts/audit-breed-profiles-ci.mjs --base http://localhost:5173
      - name: Breed-specific Playwright — desktop
        id: breed_desktop
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e -- tests/e2e/breed-profile.spec.ts --project=desktop-chromium
      - name: Breed-specific Playwright — mobile
        id: breed_mobile
        if: ${{ always() && steps.seed.outcome == 'success' && steps.audit.outcome == 'success' }}
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e -- tests/e2e/breed-profile.spec.ts --project=mobile-chromium
      - name: Directory Playwright — desktop
        id: directory_desktop
        if: ${{ always() && steps.directory_seed.outcome == 'success' }}
        env:
          E2E_BASE_URL: http://localhost:5173
          PLAYWRIGHT_HTML_OUTPUT_DIR: .e2e-artifacts/playwright/directory-desktop/html
        run: npm run e2e -- tests/e2e/admin-directory-filters.spec.ts tests/e2e/services-detail-shell.spec.ts tests/e2e/services-search-layout.spec.ts --project=desktop-chromium --output=.e2e-artifacts/playwright/directory-desktop/results
      - name: Directory Playwright — mobile
        id: directory_mobile
        if: ${{ always() && steps.directory_seed.outcome == 'success' && steps.directory_desktop.outcome == 'success' }}
        env:
          E2E_BASE_URL: http://localhost:5173
          PLAYWRIGHT_HTML_OUTPUT_DIR: .e2e-artifacts/playwright/directory-mobile/html
        run: npm run e2e -- tests/e2e/admin-directory-filters.spec.ts tests/e2e/services-detail-shell.spec.ts tests/e2e/services-search-layout.spec.ts --project=mobile-chromium --output=.e2e-artifacts/playwright/directory-mobile/results
      - name: Lost/found dogs Playwright + accessibility — desktop
        id: lost_found_desktop
        if: ${{ always() && steps.seed.outcome == 'success' && steps.lost_found_seed.outcome == 'success' }}
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e -- tests/e2e/lost-found-dogs.spec.ts --project=desktop-chromium
      - name: Lost/found dogs Playwright + accessibility — mobile
        id: lost_found_mobile
        if: ${{ always() && steps.seed.outcome == 'success' && steps.lost_found_seed.outcome == 'success' && steps.lost_found_desktop.outcome == 'success' }}
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e -- tests/e2e/lost-found-dogs.spec.ts --project=mobile-chromium
      - name: Help detail Playwright + accessibility — desktop and mobile
        if: ${{ always() && steps.help_detail_seed.outcome == 'success' }}
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e -- tests/e2e/help-detail-primitives.spec.ts
      - name: Upload LOST/FOUND public screenshots
        if: ${{ always() && steps.lost_found_desktop.outcome == 'success' && steps.lost_found_mobile.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: lost-found-public-screenshots-${{ github.run_attempt }}
          path: .e2e-artifacts/lost-found/
          if-no-files-found: error
          retention-days: 14
      - name: Upload HOME-1 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-1-visual-evidence-${{ github.run_attempt }}
          path: .e2e-artifacts/home-1/
          if-no-files-found: error
          retention-days: 14
      - name: Stop local app server
        if: always()
        run: |
          if [ -f .e2e-artifacts/local-server.pid ]; then
            kill "$(cat .e2e-artifacts/local-server.pid)" 2>/dev/null || true
          fi
      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-breed-pr-html-report-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload screenshots, video, traces and server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-breed-pr-failure-evidence-${{ github.run_attempt }}
          path: |
            test-results/playwright/
            .e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true

  admin-events-e2e:
    name: Admin Events — desktop and mobile
    if: github.event_name == 'pull_request' && needs.pr-scope.outputs.admin_events == 'true'
    needs: [validate, pr-scope]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: http://localhost:5173
      PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
      PSIPEDIA_ADMIN_EVENTS_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start isolated local app and materialize local D1
        run: |
          mkdir -p .e2e-artifacts/admin-events
          nohup npm exec vite -- --host 127.0.0.1 > .e2e-artifacts/admin-events/server.log 2>&1 &
          echo $! > .e2e-artifacts/admin-events/server.pid
          ready=0
          for attempt in $(seq 1 60); do
            # Missing-table HTTP 500 is expected before the fixture schema exists.
            if curl --silent --max-time 2 http://localhost:5173/api/admin/events > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
      - name: Seed 175 disposable events in local D1 only
        run: node scripts/bootstrap-admin-events-e2e.mjs
      - name: Check counts and guarded API without modifying events
        run: node scripts/check-admin-events-local.mjs
      - name: Admin Events Playwright — desktop and mobile
        run: npx playwright test tests/e2e/admin-events.spec.ts --workers=1 --retries=0
      - name: Stop local app
        if: always()
        run: |
          if [ -f .e2e-artifacts/admin-events/server.pid ]; then
            kill "$(cat .e2e-artifacts/admin-events/server.pid)" 2>/dev/null || true
          fi
      - name: Upload admin screenshots, report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-events-desktop-mobile-${{ github.run_attempt }}
          path: |
            .e2e-artifacts/admin-events/
            playwright-report/
            test-results/playwright/
          if-no-files-found: warn
          retention-days: 14

  search-e2e:
    name: SEARCH-1 local desktop/mobile E2E
    if: github.event_name == 'pull_request' && needs.pr-scope.outputs.search == 'true'
    needs: [validate, pr-scope]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: http://localhost:5173
      PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build SEARCH-1 PR code
        run: npm run build
      - name: Apply schema to isolated local D1 only
        run: |
          mv drizzle/0038_adoption_staging_data.sql /tmp/0038_adoption_staging_data.sql
          mv drizzle/0039_activate_canonical_adoptions.sql /tmp/0039_activate_canonical_adoptions.sql
          trap 'mv /tmp/0038_adoption_staging_data.sql drizzle/0038_adoption_staging_data.sql; mv /tmp/0039_activate_canonical_adoptions.sql drizzle/0039_activate_canonical_adoptions.sql' EXIT
          npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to .wrangler/state
      - name: Seed SEARCH-1 >500 regression fixture into local D1 only
        run: npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/search-e2e.sql
      - name: Start isolated local app
        run: |
          mkdir -p .e2e-artifacts/search-1
          nohup npm exec vite -- --host 127.0.0.1 > .e2e-artifacts/search-1/server.log 2>&1 &
          echo $! > .e2e-artifacts/search-1/server.pid
          ready=0
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://localhost:5173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
      - name: SEARCH-1 Playwright — desktop and mobile 390px
        run: npx playwright test tests/e2e/search.spec.ts --workers=1 --retries=0
      - name: Stop isolated local app
        if: always()
        run: |
          if [ -f .e2e-artifacts/search-1/server.pid ]; then
            kill "$(cat .e2e-artifacts/search-1/server.pid)" 2>/dev/null || true
          fi
      - name: Upload SEARCH-1 evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: search-1-e2e-${{ github.run_attempt }}
          path: |
            .e2e-artifacts/search-1/
            playwright-report/
            test-results/playwright/
          if-no-files-found: warn
          retention-days: 14

  sitemap-preview-runtime:
    name: Sitemap runtime A/B Cloudflare preview
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/hotfix-seo-sitemap-runtime-2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    env:
      BASELINE_PREVIEW_URL: https://3917bf45-psipedia-sk.martin-zabransky-5ff.workers.dev
    steps:
      - name: Resolve exact Cloudflare preview for this commit
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs"
          preview_url=""
          for attempt in $(seq 1 90); do
            payload="$(curl --silent --show-error --fail \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}")"
            state="$(printf '%s' "${payload}" | node -e '
              let x=""; process.stdin.on("data",d=>x+=d).on("end",()=>{
                const runs=JSON.parse(x).check_runs||[];
                const run=runs.find(item=>item.name==="Workers Builds: psipedia-sk");
                process.stdout.write(run ? String(run.status)+"|"+String(run.conclusion||"") : "missing|");
              });
            ')"
            if [ "${state}" = "completed|failure" ]; then
              echo "::error::Cloudflare Workers Build failed for ${GITHUB_SHA}."
              exit 1
            fi
            if [ "${state}" = "completed|success" ]; then
              preview_url="$(printf '%s' "${payload}" | node -e '
                let x=""; process.stdin.on("data",d=>x+=d).on("end",()=>{
                  const runs=JSON.parse(x).check_runs||[];
                  const run=runs.find(item=>item.name==="Workers Builds: psipedia-sk");
                  const summary=run?.output?.summary||"";
                  const match=summary.match(/Preview URL:\s*(https:\/\/[^\s]+)/);
                  process.stdout.write(match?.[1]||"");
                });
              ')"
              if [ -n "${preview_url}" ]; then break; fi
            fi
            sleep 5
          done
          test -n "${preview_url}"
          echo "url=${preview_url}" >> "$GITHUB_OUTPUT"
          echo "Cloudflare preview resolved for commit ${GITHUB_SHA}."

      - name: Confirm old runtime reproduces sitemap 1101
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location \
            --output /tmp/sitemap-baseline.txt \
            --write-out '%{http_code}' \
            "${BASELINE_PREVIEW_URL}/sitemap.xml")"
          echo "baseline_http_status=${status}"
          test "${status}" = "500"
          grep -q "1101" /tmp/sitemap-baseline.txt

      - name: Assert fixed preview sitemap contract
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          metrics="$(curl --silent --show-error --location \
            --dump-header /tmp/sitemap-preview.headers \
            --output /tmp/sitemap-preview.xml \
            --write-out '%{http_code}|%{content_type}|%{size_download}|%{time_total}' \
            "${PREVIEW_URL}/sitemap.xml")"
          IFS='|' read -r status content_type size_download time_total <<< "${metrics}"
          echo "preview_http_status=${status}"
          echo "preview_content_type=${content_type}"
          echo "preview_xml_bytes=${size_download}"
          echo "preview_time_seconds=${time_total}"
          test "${status}" = "200"
          printf '%s' "${content_type}" | grep -Eqi 'xml'

          node <<'NODE'
          const fs = require("fs");
          const xml = fs.readFileSync("/tmp/sitemap-preview.xml", "utf8");
          if (!/<urlset(?:\s|>)/.test(xml)) throw new Error("preview-sitemap-missing-urlset");
          const urls = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map((match) => match[1]);
          const duplicates = urls.filter((url, index) => urls.indexOf(url) !== index);
          if (duplicates.length) throw new Error(`preview-sitemap-duplicate-url:${duplicates[0]}`);

          const directory = urls.filter((url) => /^https:\/\/psipedia\.sk\/adresar\/[^/]+\/[^/?#]+$/.test(url));
          if (directory.length <= 1000) throw new Error(`preview-directory-corpus-truncated:${directory.length}`);

          const article = [
            "https://psipedia.sk/starostlivost/kedy-ist-so-psom-k-veterinarovi",
            "https://psipedia.sk/starostlivost/kolko-hodin-denne-spi-pes-stena-dospely-pes-aj-senior-maju-rozdielne-potreby",
          ].find((url) => urls.includes(url));
          const event = urls.includes("https://psipedia.sk/podujatia/psi-talent-2026")
            ? "https://psipedia.sk/podujatia/psi-talent-2026"
            : null;
          const help = urls.find((url) => /^https:\/\/psipedia\.sk\/pomoc-psom\/(?:docasna-opatera|zbierky|urgentne-pripady|dobrovolnictvo|stratene-a-najdene)\/[^/?#]+$/.test(url));
          if (!article) throw new Error("preview-missing-representative-article");
          if (!event) throw new Error("preview-missing-representative-event");
          if (!help) throw new Error("preview-missing-representative-help");

          const forbidden = urls.find((url) => {
            const { pathname, search, hash } = new URL(url);
            return search || hash
              || pathname === "/admin" || pathname.startsWith("/admin/")
              || pathname === "/api" || pathname.startsWith("/api/")
              || pathname === "/hladat" || pathname.startsWith("/hladat/");
          });
          if (forbidden) throw new Error(`preview-forbidden-url:${forbidden}`);

          const counts = {
            total: urls.length,
            directory: directory.length,
            organizations: urls.filter((url) => /^https:\/\/psipedia\.sk\/organizacie\/[^/?#]+$/.test(url)).length,
            adoptions: urls.filter((url) => /^https:\/\/psipedia\.sk\/pomoc-psom\/adopcia\/[^/?#]+$/.test(url)).length,
            lostFound: urls.filter((url) => /^https:\/\/psipedia\.sk\/pomoc-psom\/(?:stratene-psy|najdene-psy)\/[^/?#]+$/.test(url)).length,
            breeds: urls.filter((url) => /^https:\/\/psipedia\.sk\/plemena\/[^/?#]+$/.test(url)
              && !url.endsWith("/plemena/vyber-plemena")).length,
          };
          console.log("preview_counts="+JSON.stringify(counts));
          console.log("preview_sample_directory="+directory[0]);
          console.log("preview_sample_article="+article);
          console.log("preview_sample_event="+event);
          console.log("preview_sample_help="+help);
          NODE

      - name: Confirm preview files stay ephemeral
        if: always()
        shell: bash
        run: rm -f /tmp/sitemap-baseline.txt /tmp/sitemap-preview.headers /tmp/sitemap-preview.xml

  production-smoke:
    name: Playwright production smoke (${{ matrix.label }})
    needs: validate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: desktop
            project: desktop-chromium
          - label: mobile
            project: mobile-chromium
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run read-only production browser tests — ${{ matrix.label }}
        env:
          E2E_BASE_URL: https://psipedia.sk
        shell: bash
        run: |
          set +e
          npx playwright test --grep @production --project="${{ matrix.project }}" --workers=1
          first_status=$?

          if [ "$first_status" -eq 0 ]; then
            exit 0
          fi

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "::warning::Initial production smoke failed immediately after a main push. Waiting 120 seconds for production deployment to settle, then retrying once."
            sleep 120
            rm -rf playwright-report test-results/playwright
            npx playwright test --grep @production --project="${{ matrix.project }}" --workers=1
            exit $?
          fi

          exit "$first_status"
      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-production-${{ matrix.label }}-html-report-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload screenshots, video and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-production-${{ matrix.label }}-failure-evidence-${{ github.run_attempt }}
          path: test-results/playwright/
          if-no-files-found: ignore
          retention-days: 14


  sitemap-production-diagnostic:
    name: Read-only production sitemap diagnostic collection
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/hotfix-seo-sitemap')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - name: Checkout hotfix diagnostic revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Load canonical Cloudflare account id
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("config/cloudflare-resources.json","utf8")); process.stdout.write(x.account_id || "")')"
          test -n "$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Capture sitemap response and Cloudflare runtime error tail
        shell: bash
        run: |
          set -u
          mkdir -p .sitemap-diagnostic
          npx wrangler tail psipedia-sk --format json --status error > .sitemap-diagnostic/tail.jsonl 2> .sitemap-diagnostic/tail.stderr &
          tail_pid=$!
          sleep 5
          curl --silent --show-error --location             --dump-header .sitemap-diagnostic/headers.txt             --output .sitemap-diagnostic/body.txt             --write-out '%{http_code}\n'             https://psipedia.sk/sitemap.xml | tee .sitemap-diagnostic/status.txt
          curl --silent --show-error --location             --output /dev/null             --write-out '%{http_code}\n'             https://psipedia.sk/robots.txt | tee .sitemap-diagnostic/robots.txt.status.txt
          curl --silent --show-error --location             --output /dev/null             --write-out '%{http_code}\n'             https://psipedia.sk/news-sitemap.xml | tee .sitemap-diagnostic/news-sitemap.xml.status.txt
          sleep 8
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          echo '--- status ---'
          cat .sitemap-diagnostic/status.txt
          echo '--- headers ---'
          cat .sitemap-diagnostic/headers.txt
          echo '--- body (first 4000 bytes) ---'
          head -c 4000 .sitemap-diagnostic/body.txt || true
          echo
          echo '--- tail stderr ---'
          cat .sitemap-diagnostic/tail.stderr || true
          echo '--- robots/news status ---'
          printf 'robots='; cat .sitemap-diagnostic/robots.txt.status.txt
          printf 'news='; cat .sitemap-diagnostic/news-sitemap.xml.status.txt
          echo '--- error tail ---'
          cat .sitemap-diagnostic/tail.jsonl || true
      - name: Read-only production D1 sitemap schema and anomaly counts
        shell: bash
        run: |
          set -euo pipefail
          sql="$(cat <<'SQL'
          SELECT 'directory_profiles' AS dataset, COUNT(*) AS total,
            SUM(CASE WHEN status='published' THEN 1 ELSE 0 END) AS published,
            SUM(CASE WHEN status='published' AND archived_at IS NULL THEN 1 ELSE 0 END) AS sitemap_candidates,
            SUM(CASE WHEN status='published' AND archived_at IS NULL AND trim(slug)='' THEN 1 ELSE 0 END) AS blank_slug
          FROM directory_profiles;
          SELECT 'managed_articles' AS dataset, COUNT(*) AS total,
            SUM(CASE WHEN status='published' THEN 1 ELSE 0 END) AS published,
            SUM(CASE WHEN (status='published' OR (status='scheduled' AND published_at IS NOT NULL AND published_at <= CURRENT_TIMESTAMP)) THEN 1 ELSE 0 END) AS sitemap_candidates,
            SUM(CASE WHEN (status='published' OR (status='scheduled' AND published_at IS NOT NULL AND published_at <= CURRENT_TIMESTAMP)) AND trim(slug)='' THEN 1 ELSE 0 END) AS blank_slug
          FROM managed_articles;
          SELECT 'managed_events' AS dataset, COUNT(*) AS total,
            SUM(CASE WHEN status='published' THEN 1 ELSE 0 END) AS sitemap_candidates,
            SUM(CASE WHEN status='published' AND trim(slug)='' THEN 1 ELSE 0 END) AS blank_slug
          FROM managed_events;
          SELECT 'help_cases' AS dataset, COUNT(*) AS total,
            SUM(CASE WHEN status='published' THEN 1 ELSE 0 END) AS published,
            SUM(CASE WHEN status='published' AND category NOT IN ('adopcia','utulky') THEN 1 ELSE 0 END) AS sitemap_candidates,
            SUM(CASE WHEN status='published' AND category NOT IN ('adopcia','utulky') AND trim(slug)='' THEN 1 ELSE 0 END) AS blank_slug
          FROM help_cases;
          SELECT 'redirect_directory_althea' AS check_name, COUNT(*) AS matches,
            MAX(category) AS category, MAX(slug) AS slug,
            MAX(CASE WHEN json_valid(seo_json) THEN json_extract(seo_json,'$.canonicalUrl') ELSE NULL END) AS canonical_url,
            MAX(CASE WHEN json_valid(seo_json) THEN json_extract(seo_json,'$.noindex') ELSE NULL END) AS noindex
          FROM directory_profiles
          WHERE status='published' AND archived_at IS NULL
            AND category='veterinari' AND slug='veterinarna-poliklinka-althea';
          SELECT 'redirect_article_training' AS check_name, COUNT(*) AS matches,
            MAX(portal_section) AS portal_section, MAX(slug) AS slug,
            MAX(canonical_url) AS canonical_url, MAX(noindex) AS noindex
          FROM managed_articles
          WHERE (status='published' OR (status='scheduled' AND published_at IS NOT NULL AND published_at <= CURRENT_TIMESTAMP))
            AND portal_section='aktivity' AND slug='-vycvik-a-aktivity-trening';
          SELECT 'redirect_event_calendar' AS check_name, COUNT(*) AS matches,
            MAX(slug) AS slug,
            MAX(CASE WHEN json_valid(seo_json) THEN json_extract(seo_json,'$.canonicalUrl') ELSE NULL END) AS canonical_url,
            MAX(CASE WHEN json_valid(seo_json) THEN json_extract(seo_json,'$.noindex') ELSE NULL END) AS noindex
          FROM managed_events
          WHERE status='published' AND slug='kalendar';
          SELECT 'legacy_directory_category' AS check_name, COUNT(*) AS matches
          FROM directory_profiles
          WHERE status='published' AND archived_at IS NULL AND category='psie-skoly';
          SELECT 'directory_duplicates' AS check_name, COUNT(*) AS duplicate_groups FROM (
            SELECT category,slug FROM directory_profiles
            WHERE status='published' AND archived_at IS NULL
            GROUP BY category,slug HAVING COUNT(*) > 1
          );
          SELECT 'article_duplicates' AS check_name, COUNT(*) AS duplicate_groups FROM (
            SELECT portal_section,slug FROM managed_articles
            WHERE status='published' OR (status='scheduled' AND published_at IS NOT NULL AND published_at <= CURRENT_TIMESTAMP)
            GROUP BY portal_section,slug HAVING COUNT(*) > 1
          );
          SELECT 'event_duplicates' AS check_name, COUNT(*) AS duplicate_groups FROM (
            SELECT slug FROM managed_events WHERE status='published'
            GROUP BY slug HAVING COUNT(*) > 1
          );
          SELECT 'help_duplicates' AS check_name, COUNT(*) AS duplicate_groups FROM (
            SELECT category,slug FROM help_cases WHERE status='published'
            GROUP BY category,slug HAVING COUNT(*) > 1
          );
          PRAGMA table_info('directory_profiles');
          PRAGMA table_info('managed_articles');
          PRAGMA table_info('managed_events');
          PRAGMA table_info('help_cases');
          SQL
          )"
          npx wrangler d1 execute psipedia-sk-db --remote --command "$sql" --json | tee .sitemap-diagnostic/d1.json


  notify-production-failure:
    name: Notify owner about failed production smoke
    needs: production-smoke
    if: ${{ always() && github.event_name != 'pull_request' && needs.production-smoke.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create GitHub notification issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              ...context.repo,
              title: `Production smoke zlyhal – run #${context.runNumber}`,
              body: `Playwright production smoke pre Psipediu zlyhal.\n\n[Otvoriť workflow a artifacts](${runUrl})`,
              assignees: [context.repo.owner],
            });
