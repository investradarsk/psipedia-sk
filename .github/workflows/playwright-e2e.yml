name: Playwright E2E and production smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Locate RSC error masking
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fresh production build
        run: npm run build
      - name: Locate masking implementation and context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          needle = "An error occurred in the Server Components render"
          roots = [Path("node_modules"), Path(".sites-runtime"), Path("dist")]
          found = 0
          for root in roots:
            if not root.exists():
              continue
            for p in root.rglob("*"):
              if found >= 20 or not p.is_file():
                continue
              try:
                text = p.read_text(errors="ignore")
              except Exception:
                continue
              if needle not in text:
                continue
              found += 1
              print(f"RSC_MASK_MATCH {p}")
              idx = text.index(needle)
              start = max(0, idx - 1600)
              end = min(len(text), idx + len(needle) + 1600)
              print(text[start:end])
              print("RSC_MASK_END")
          print(f"RSC_MASK_MATCH_COUNT={found}")
          PY
      - name: Reproduce isolated badge once
        shell: bash
        run: |
          set +e
          node --experimental-loader ./tests/cloudflare-loader.mjs --test --test-name-pattern="admin badge reflects new inquiry count and decreases after new to read" tests/directory-inquiry-notifications.test.mjs 2>&1 | tee /tmp/badge.log
          STATUS=${PIPESTATUS[0]}
          echo "BADGE_EXIT=$STATUS"
          exit 1
