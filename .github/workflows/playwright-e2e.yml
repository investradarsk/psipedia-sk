name: Playwright E2E and production smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Badge RSC diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fresh production build
        run: npm run build
      - name: PR isolated badge with development runtime flag
        shell: bash
        run: |
          set +e
          NODE_ENV=development node --experimental-loader ./tests/cloudflare-loader.mjs --test --test-name-pattern="admin badge reflects new inquiry count and decreases after new to read" tests/directory-inquiry-notifications.test.mjs 2>&1 | tee /tmp/pr-dev-runtime.log
          echo "PR_DEV_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0
      - name: Checkout current main control
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-control
      - name: Build current main control
        shell: bash
        run: |
          cd main-control
          npm ci
          npm run build
      - name: Exact badge harness fixture against main worker
        shell: bash
        run: |
          cp tests/directory-inquiry-notifications.test.mjs /tmp/directory-inquiry-main-control.orig
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/directory-inquiry-notifications.test.mjs')
          s = p.read_text()
          s = s.replace('new URL("../dist/server/index.js", import.meta.url)', 'new URL("../main-control/dist/server/index.js", import.meta.url)')
          s = s.replace('assert.match(beforeHtml, /aria-label="2 nových dopytov"/);', 'assert.match(beforeHtml, /Prijaté dopyty/);')
          s = s.replace('assert.match(afterHtml, /aria-label="1 nových dopytov"/);\n  assert.doesNotMatch(afterHtml, /aria-label="2 nových dopytov"/);', 'assert.match(afterHtml, /Prijaté dopyty/);')
          s = s.replace(
            '  const before = await request(worker, d1, "/admin/dopyty", { method: "GET" }, true);',
            '  console.error("MAIN_EXACT first-get start");\n  const before = await request(worker, d1, "/admin/dopyty", { method: "GET" }, true);\n  console.error("MAIN_EXACT first-get response", before.status);'
          )
          s = s.replace(
            '  assert.equal(update.status, 200);\n  const after = await request(worker, d1, "/admin/dopyty", { method: "GET" }, true);',
            '  assert.equal(update.status, 200);\n  console.error("MAIN_EXACT update response", update.status);\n  console.error("MAIN_EXACT second-get start");\n  const after = await request(worker, d1, "/admin/dopyty", { method: "GET" }, true);\n  console.error("MAIN_EXACT second-get response", after.status);'
          )
          p.write_text(s)
          PY
          set +e
          node --experimental-loader ./tests/cloudflare-loader.mjs --test --test-name-pattern="admin badge reflects new inquiry count and decreases after new to read" tests/directory-inquiry-notifications.test.mjs 2>&1 | tee /tmp/main-exact.log
          MAIN_EXACT_STATUS=${PIPESTATUS[0]}
          cp /tmp/directory-inquiry-main-control.orig tests/directory-inquiry-notifications.test.mjs
          echo "MAIN_EXACT_EXIT=$MAIN_EXACT_STATUS" >> "$GITHUB_ENV"
          exit 0
      - name: Diagnostic summary
        shell: bash
        run: |
          echo "PR development-runtime isolated exit: ${PR_DEV_EXIT}"
          echo "Main exact harness exit: ${MAIN_EXACT_EXIT}"
          echo "--- PR dev-runtime ---"
          cat /tmp/pr-dev-runtime.log
          echo "--- Main exact harness ---"
          cat /tmp/main-exact.log
          exit 1
