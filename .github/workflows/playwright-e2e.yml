name: Playwright E2E and production smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: playwright-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Final isolated inquiry validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fresh production build
        run: npm run build
      - name: Isolated admin badge test
        run: node --experimental-loader ./tests/cloudflare-loader.mjs --test --test-name-pattern="admin badge reflects new inquiry count and decreases after new to read" tests/directory-inquiry-notifications.test.mjs
      - name: Full directory inquiry notification test file
        run: node --experimental-loader ./tests/cloudflare-loader.mjs --test tests/directory-inquiry-notifications.test.mjs
