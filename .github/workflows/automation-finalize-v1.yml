name: Automation V1 Finalize

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type FINALIZE-AUTOMATION-V1-psipedia-sk-db
        required: true
        type: string

concurrency:
  group: automation-v1-finalize
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - name: Require main and exact confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "${{ inputs.confirmation }}" = "FINALIZE-AUTOMATION-V1-psipedia-sk-db"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require dispatched revision to still be current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Automation V1 final contract tests
        run: >-
          node --experimental-strip-types --test
          tests/data-automation-apply.test.mjs
          tests/data-automation-background-run.test.mjs
          tests/automation-detach-drafts.test.mjs
          tests/automation-cleanup-legacy.test.mjs
          tests/automation-finalize-v1.test.mjs
          tests/g5-canonical-apply.test.mjs

      - name: Load canonical Cloudflare account id
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("config/cloudflare-resources.json","utf8")); process.stdout.write(x.account_id || "")')"
          test -n "$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: DETACH preview
        shell: bash
        run: |
          set -euo pipefail
          node scripts/automation-detach-drafts.mjs --preview > detach-before.json
          cat detach-before.json
          node -e 'const x=require("./detach-before.json"); if(x.applyAllowed!==true) throw new Error("DETACH preview is not safe: "+JSON.stringify(x.blockers));'

      - name: DETACH apply
        run: node scripts/automation-detach-drafts.mjs --apply

      - name: DETACH postconditions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/automation-detach-drafts.mjs --preview > detach-after.json
          cat detach-after.json
          node - <<'NODE'
          const fs=require("fs");
          const before=JSON.parse(fs.readFileSync("detach-before.json","utf8"));
          const after=JSON.parse(fs.readFileSync("detach-after.json","utf8"));
          const fail=(m)=>{throw new Error(m)};
          if(JSON.stringify(after.canonical)!==JSON.stringify(before.canonical)) fail("canonical content counts changed during DETACH");
          if(after.applicationsByType.total!==0||after.applicationsByType.CREATE_DRAFT!==0||after.applicationsByType.UPDATE_EXISTING!==0) fail("automation applications remain");
          if(after.claims.length!==0) fail("automation cluster canonical claims remain");
          if(after.linkedClusters.length!==0) fail("canonical-linked transient clusters remain");
          if(after.draftFindings.some(x=>x.canonical_entity_id!=null||x.canonical_entity_key!=null)) fail("NEW_ENTITY/DUPLICATE finding retains canonical link");
          NODE

      - name: LEGACY CLEANUP preview
        shell: bash
        run: |
          set -euo pipefail
          node scripts/automation-cleanup-legacy.mjs --preview > cleanup-before.json
          cat cleanup-before.json
          node -e 'const x=require("./cleanup-before.json"); if(x.applyAllowed!==true) throw new Error("LEGACY CLEANUP preview is not safe: "+JSON.stringify(x.blockers));'

      - name: LEGACY CLEANUP apply
        run: node scripts/automation-cleanup-legacy.mjs --apply

      - name: Final postconditions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/automation-cleanup-legacy.mjs --preview > cleanup-after.json
          cat cleanup-after.json
          node - <<'NODE'
          const fs=require("fs");
          const detachBefore=JSON.parse(fs.readFileSync("detach-before.json","utf8"));
          const cleanupBefore=JSON.parse(fs.readFileSync("cleanup-before.json","utf8"));
          const final=JSON.parse(fs.readFileSync("cleanup-after.json","utf8"));
          const fail=(m)=>{throw new Error(m)};
          for(const [table,count] of Object.entries(final.deleteCounts)) if(count!==0) fail(`legacy table not empty: ${table}=${count}`);
          if(final.uncertainCounts.automation_applications!==0) fail("automation applications remain");
          if(final.uncertainCounts.automation_cluster_canonical_claims!==0) fail("canonical claims remain");
          if(final.blockers.canonicalLinkedClusters!==0) fail("canonical-linked clusters remain");
          if(final.blockers.linkedNewDuplicateFindings!==0) fail("NEW_ENTITY/DUPLICATE canonical links remain");
          if(JSON.stringify(final.canonical)!==JSON.stringify(cleanupBefore.canonical)) fail("canonical counts changed during cleanup");
          for(const table of ["automation_sources","automation_discovery_roots","automation_search_usage","automation_governance_reviews","automation_governance_review_history","automation_ingestion_receipts"]) {
            if(final.keepCounts[table]!==cleanupBefore.keepCounts[table]) fail(`${table} count changed`);
          }
          for(const table of ["managed_events","directory_profiles","adoption_dogs","help_organizations","help_cases","lost_found_dog_reports"]) {
            if(final.canonical[table]!==detachBefore.canonical[table]) fail(`${table} count changed across finalization`);
          }
          NODE
