name: Open-source production UI integration

on:
  pull_request:
    paths:
      - "components/admin-photo-gallery.tsx"
      - "components/admin-event-markdown-editor.tsx"
      - "components/admin-lexical-draft-dialog.tsx"
      - "components/admin-lexical-draft-dialog.module.css"
      - "lib/editorial-lexical-append.ts"
      - "components/admin-photo-gallery.module.css"
      - "components/admin-service-catalog-workspace.tsx"
      - "components/admin-service-catalog.module.css"
      - "components/admin-gemini-all-concepts.tsx"
      - "lib/admin-photo-gallery-url.ts"
      - "lib/gemini-concept-fuzzy-search.ts"
      - "components/admin-lexical-append-button.tsx"
      - "components/admin-gallery-dropzone.tsx"
      - "components/admin-gallery-dropzone.module.css"
      - "components/admin-sortable-gallery.tsx"
      - "lib/admin-gallery-sortable-ids.ts"
      - "tests/admin-gallery-sortable-ids.test.mjs"
      - "components/admin-adoption-editor-profile.tsx"
      - "components/admin-single-image-upload.tsx"
      - "lib/admin-selected-image.ts"
      - "components/admin-adoption-editor.tsx"
      - "components/admin-adoption-editor-details.tsx"
      - "components/admin-event-editor.tsx"
      - "components/admin-article-editor.tsx"
      - "components/admin-interaction-system.tsx"
      - "components/admin-form-feedback.tsx"
      - "components/admin-form-feedback.module.css"
      - "components/admin-adoption-editor.tsx"
      - "components/admin-lost-found-editor.tsx"
      - "tests/admin-shared-form-feedback.test.mjs"
      - "components/admin-partner-claim-actions.tsx"
      - "components/admin-partner-verification-actions.tsx"
      - "components/admin-partner-profile-change-actions.tsx"
      - "components/admin-partner-new-profile-actions.tsx"
      - "components/admin-directory-change-requests.tsx"
      - "components/admin-organization-publication-dashboard.tsx"
      - "tests/admin-unified-organization-confirmations.test.mjs"
      - "tests/e2e/partner-auth.spec.ts"
      - "tests/admin-unified-review-confirmations.test.mjs"
      - "tests/admin-unified-partner-confirmations.test.mjs"
      - "components/admin-eshop-editor.tsx"
      - "components/admin-gemini-category-prompt-editor.tsx"
      - "components/admin-unsaved-navigation-dialog.tsx"
      - "tests/admin-unsaved-navigation-shared.test.mjs"
      - "components/admin-navigation-editor.tsx"
      - "components/admin-section-editor.tsx"
      - "tests/admin-sections-v2.test.mjs"
      - "components/admin-puppy-area-editor.tsx"
      - "tests/e2e/article-admin-editor.spec.ts"
      - "tests/admin-single-image-unification.test.mjs"
      - "components/admin-breed-editor.tsx"
      - "components/admin-article-block-editor.tsx"
      - "components/admin-organization-editor.tsx"
      - "components/admin-directory-editor.tsx"
      - "components/admin-help-editor.tsx"
      - "components/admin-lost-found-editor.tsx"
      - "tests/admin-open-source-unification.test.mjs"
      - "tests/article-gallery-shared-upload.test.mjs"
      - "tests/open-source-final-adoption.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "tests/open-source-production-ui.test.mjs"
      - "tests/service-catalog-mobile-polish.test.mjs"
      - ".github/workflows/open-source-production-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-source-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Install exact dependencies from updated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Zod, Fuse, lockfile, and production integration
        run: node --experimental-strip-types --test tests/open-source-production-ui.test.mjs tests/open-source-final-adoption.test.mjs tests/service-catalog-mobile-polish.test.mjs tests/admin-open-source-unification.test.mjs tests/article-gallery-shared-upload.test.mjs tests/admin-single-image-unification.test.mjs tests/admin-gallery-sortable-ids.test.mjs tests/admin-sections-v2.test.mjs tests/admin-unsaved-navigation-shared.test.mjs tests/admin-unified-partner-confirmations.test.mjs tests/admin-unified-review-confirmations.test.mjs tests/admin-unified-organization-confirmations.test.mjs tests/organization-dashboard-hydration.test.mjs tests/admin-shared-form-feedback.test.mjs
      - name: Lint changed production modules
        run: npx eslint components/admin-photo-gallery.tsx components/admin-gallery-dropzone.tsx components/admin-single-image-upload.tsx lib/admin-selected-image.ts lib/admin-gallery-sortable-ids.ts components/admin-sortable-gallery.tsx components/admin-lexical-append-button.tsx components/admin-interaction-system.tsx components/admin-form-feedback.tsx components/admin-adoption-editor.tsx components/admin-lost-found-editor.tsx components/admin-partner-claim-actions.tsx components/admin-partner-verification-actions.tsx components/admin-partner-profile-change-actions.tsx components/admin-partner-new-profile-actions.tsx components/admin-directory-change-requests.tsx components/admin-organization-publication-dashboard.tsx components/admin-unsaved-navigation-dialog.tsx components/admin-gemini-category-prompt-editor.tsx components/admin-navigation-editor.tsx components/admin-section-editor.tsx components/admin-eshop-editor.tsx components/admin-puppy-area-editor.tsx components/admin-event-editor.tsx components/admin-article-editor.tsx components/admin-adoption-editor-profile.tsx components/admin-article-block-editor.tsx components/admin-breed-editor.tsx components/admin-gemini-all-concepts.tsx components/admin-service-catalog-workspace.tsx lib/admin-photo-gallery-url.ts lib/gemini-concept-fuzzy-search.ts
      - name: Production build
        run: npm run build
