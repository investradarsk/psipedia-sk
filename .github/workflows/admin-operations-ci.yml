name: Admin Operations attention queue

on:
  pull_request:
    branches: [main]
    paths:
      - "app/admin/operations/**"
      - "app/admin/organizacie/**"
      - "app/api/admin/organizations/**"
      - "components/admin-attention-queue*"
      - "components/admin-organization-publication-dashboard.tsx"
      - "components/admin-shell.tsx"
      - "lib/admin-attention-queue*"
      - "lib/help-organization-admin-store.ts"
      - "lib/help-organization-admin-write.ts"
      - "lib/help-organization-publication.ts"
      - "tests/admin-attention-queue.test.mjs"
      - "tests/help-organization-publication.test.mjs"
      - "tests/e2e/admin-operations.spec.ts"
      - "tests/e2e/admin-organization-publication.spec.ts"
      - "package.json"
      - ".github/workflows/admin-operations-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operations-e2e:
    name: Operations — desktop and mobile, Axe and overflow
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: http://localhost:5173
      PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Log revision evidence
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "pr_head_sha=${{ github.event.pull_request.head.sha || 'n/a' }}"
          echo "base_sha=${{ github.event.pull_request.base.sha || 'n/a' }}"
          echo "github_sha=${{ github.sha }}"
          echo "checked_out_sha=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Configure CI-only local PII keys
        run: |
          cat > .dev.vars <<'EOF'
          PII_ENCRYPTION_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
          PII_HASH_KEY=ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA
          EOF
      - name: Apply schema migrations to isolated local D1 only
        run: |
          mv drizzle/0038_adoption_staging_data.sql /tmp/0038_adoption_staging_data.sql
          mv drizzle/0039_activate_canonical_adoptions.sql /tmp/0039_activate_canonical_adoptions.sql
          trap 'mv /tmp/0038_adoption_staging_data.sql drizzle/0038_adoption_staging_data.sql; mv /tmp/0039_activate_canonical_adoptions.sql drizzle/0039_activate_canonical_adoptions.sql' EXIT
          npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to .wrangler/state
      - name: Seed ORG-8A disposable publication fixture into isolated local D1 only
        run: |
          npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --command "INSERT INTO help_organizations (name, slug, type, status, short_description, description, city, district, region, country_code, published_at, archived_at, created_at, updated_at, created_by, updated_by) VALUES ('ORG-8A Testovacia organizácia', 'org-8a-testovacia-organizacia', 'OTHER', 'DRAFT', 'Testovací profil publication workflow.', 'Izolovaná CI fixture pre ORG-8A.', 'Nitra', 'Nitra', 'Nitriansky kraj', 'SK', NULL, NULL, '2026-09-17T08:00:00.000Z', '2026-09-17T08:00:00.000Z', 'ci:org-8a', 'ci:org-8a') ON CONFLICT(slug) DO UPDATE SET status = 'DRAFT', published_at = NULL, archived_at = NULL, updated_at = '2026-09-17T08:00:00.000Z', updated_by = 'ci:org-8a';"
      - name: Start isolated local app
        run: |
          mkdir -p .e2e-artifacts/admin-operations
          nohup npm exec vite -- --host 127.0.0.1 > .e2e-artifacts/admin-operations/server.log 2>&1 &
          echo $! > .e2e-artifacts/admin-operations/server.pid
          ready=0
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://localhost:5173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -200 .e2e-artifacts/admin-operations/server.log
            exit 1
          fi
      - name: Admin operations and organization publishing Playwright — desktop and mobile
        run: npx playwright test tests/e2e/admin-operations.spec.ts tests/e2e/admin-organization-publication.spec.ts --workers=1 --retries=0
      - name: Stop local app
        if: always()
        run: |
          if [ -f .e2e-artifacts/admin-operations/server.pid ]; then
            kill "$(cat .e2e-artifacts/admin-operations/server.pid)" 2>/dev/null || true
          fi
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-operations-failure-${{ github.run_attempt }}
          path: |
            .e2e-artifacts/admin-operations/
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 14
