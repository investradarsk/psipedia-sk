name: NOTION-BIDIRECTIONAL events help validation

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/notion-events-help-*.ts"
      - "lib/notion-data-quality-audit.ts"
      - "lib/notion-data-quality-recovery.ts"
      - "app/api/admin/notion-data-quality-audit/**"
      - "tests/notion-data-quality-recovery.test.mjs"
      - "lib/notion-bidirectional-reconciliation.ts"
      - "lib/notion-canonical-target.ts"
      - "lib/notion-bulk-backfill.ts"
      - "lib/notion-bulk-sources.ts"
      - "lib/notion-geo-mirror.ts"
      - "lib/notion-directory-sync.ts"
      - "tests/notion-geo-mirror.test.mjs"
      - "app/api/admin/notion-events-help-sync/**"
      - "worker/index.ts"
      - "drizzle/0108_notion_events_help_bidirectional_sync.sql"
      - "tests/notion-events-help-bidirectional.test.mjs"
      - "package-lock.json"
      - ".github/workflows/notion-events-help-sync-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notion-events-help-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Bidirectional sync — typecheck, tests, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Revision evidence
        run: |
          echo "pr_head_sha=${{ github.event.pull_request.head.sha || 'n/a' }}"
          echo "base_sha=${{ github.event.pull_request.base.sha || 'n/a' }}"
          echo "checked_out_sha=$(git rev-parse HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused TypeScript check — reconciliation core
        run: npx tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution Bundler --skipLibCheck lib/notion-bidirectional-reconciliation.ts

      - name: Migration safety
        run: npm run test:migration-safety

      - name: Bidirectional reconciliation and provisioning tests
        run: npm run test:notion-events-help-sync

      - name: Existing bulk reconciliation regression
        run: npm run test:notion-bulk-backfill

      - name: Directory and Event sync regressions
        run: node --experimental-strip-types --experimental-loader ./tests/admin-events-loader.mjs --test tests/notion-directory-sync.test.mjs tests/notion-event-sync.test.mjs

      - name: Help, Adoption and Lost Found regressions
        run: |
          node --experimental-strip-types --experimental-loader ./tests/admin-events-loader.mjs --test tests/help-organization-publication.test.mjs tests/adoption-foundation.test.mjs
          npm run test:lost-found

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
