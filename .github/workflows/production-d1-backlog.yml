name: Production D1 Backlog 0058-0061

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY-0058-0061-psipedia-sk-db exactly
        required: true
        type: string

concurrency:
  group: production-d1-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollout:
    name: Preflight, apply 0058-0061, verify and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - name: Require main and explicit production confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          confirmation="$(node -e 'const fs=require("fs"); const e=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,"utf8")); process.stdout.write(e.inputs?.confirmation || "")')"
          test "$confirmation" = "APPLY-0058-0061-psipedia-sk-db"

      - name: Checkout exact dispatched main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Log non-secret revision evidence
        run: |
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
          echo "checked_out_sha=$(git rev-parse HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require protected D1 credential
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Load canonical Cloudflare account id
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("config/cloudflare-resources.json","utf8")); process.stdout.write(x.account_id || "")')"
          test -n "$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Repository migration safety
        run: npm run db:check-migrations

      - name: Build exact production artifact and generated Wrangler config
        run: npm run build

      - name: Production backlog preflight and Time Travel recovery point
        run: node scripts/production-d1-backlog-rollout.mjs preflight

      - name: Apply 0058
        run: node scripts/production-d1-backlog-rollout.mjs apply-step 0058_public_integrity_cleanup.sql
      - name: Verify 0058
        run: node scripts/production-d1-backlog-rollout.mjs verify-step 0058_public_integrity_cleanup.sql

      - name: Apply 0059
        run: node scripts/production-d1-backlog-rollout.mjs apply-step 0059_partner_auth_foundation.sql
      - name: Verify 0059
        run: node scripts/production-d1-backlog-rollout.mjs verify-step 0059_partner_auth_foundation.sql

      - name: Apply 0060
        run: node scripts/production-d1-backlog-rollout.mjs apply-step 0060_partner_memberships_admin.sql
      - name: Verify 0060
        run: node scripts/production-d1-backlog-rollout.mjs verify-step 0060_partner_memberships_admin.sql

      - name: Apply 0061
        run: node scripts/production-d1-backlog-rollout.mjs apply-step 0061_partner_commercial_interests.sql
      - name: Verify 0061
        run: node scripts/production-d1-backlog-rollout.mjs verify-step 0061_partner_commercial_interests.sql

      - name: Final production backlog postflight
        run: node scripts/production-d1-backlog-rollout.mjs postflight

      - name: Install Chromium for production smoke
        run: npx playwright install --with-deps chromium

      - name: Key production route smoke
        shell: bash
        run: |
          set -euo pipefail
          for route in "/" "/adresar" "/pomoc-psom/utulky" "/partner/prihlasenie" "/partner/registracia" "/partner/propagacia" "/sitemap.xml"
          do
            status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "https://psipedia.sk$route")"
            echo "$route -> $status"
            case "$status" in
              200|301|302|307|308) ;;
              *) exit 1 ;;
            esac
          done

      - name: Production Playwright smoke — desktop
        env:
          E2E_BASE_URL: https://psipedia.sk
        run: npx playwright test --grep @production --project=desktop-chromium --workers=1

      - name: Production Playwright smoke — mobile
        env:
          E2E_BASE_URL: https://psipedia.sk
        run: npx playwright test --grep @production --project=mobile-chromium --workers=1

      - name: Upload safe rollout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-d1-backlog-${{ github.run_id }}
          path: |
            .production-d1-backlog/preflight-report.json
            .production-d1-backlog/step-0058-report.json
            .production-d1-backlog/step-0059-report.json
            .production-d1-backlog/step-0060-report.json
            .production-d1-backlog/step-0061-report.json
            .production-d1-backlog/postflight-report.json
          if-no-files-found: warn
          retention-days: 30
