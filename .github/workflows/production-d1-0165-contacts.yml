name: Production D1 0165 Public Contacts (manual)

# This workflow never runs on PR merge, push or deployment.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit is read-only; Apply adds exactly five explicitly public contact fields"
        type: choice
        required: true
        default: audit
        options:
          - audit
          - apply
      confirmation:
        description: "Enter AUDIT-0165-psipedia-sk-db or APPLY-0165-psipedia-sk-db exactly"
        required: true
        type: string

# Shared lock with every other protected production D1 migration.
concurrency:
  group: production-d1-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contacts-0165:
    name: Protected D1 0165 read-only audit or approved five-column apply
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CONTACTS_0165_MODE: ${{ inputs.mode }}
      CONTACTS_0165_CONFIRMATION: ${{ inputs.confirmation }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - name: Require main, explicit manual action and exact confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "investradarsk/psipedia-sk"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          case "$CONTACTS_0165_MODE" in
            audit) expected="AUDIT-0165-psipedia-sk-db" ;;
            apply) expected="APPLY-0165-psipedia-sk-db" ;;
            *) echo "Unsupported 0165 mode" >&2; exit 1 ;;
          esac
          test "$CONTACTS_0165_CONFIRMATION" = "$expected"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Checkout exact dispatched main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Refuse stale main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check migration safety and isolated public contacts contract
        run: |
          npm run db:check-migrations
          node --test tests/lost-found-public-contacts.test.mjs tests/production-d1-0165-contacts.test.mjs

      - name: Require canonical Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          account="$(node -e 'process.stdout.write(require("./config/cloudflare-resources.json").account_id)')"
          test -n "$account"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Execute read-only audit or independently approved five-column apply
        run: node scripts/production-d1-0165-contacts.mjs "$CONTACTS_0165_MODE"

      - name: Preserve schema-only receipt and Time Travel recovery bookmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-d1-0165-${{ github.run_id }}
          path: .production-d1-0165/report.json
          if-no-files-found: ignore
          retention-days: 30
