name: Address Reference Schema

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY-address-reference-schema exactly
        required: true
        type: string

concurrency:
  group: address-reference-schema
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  schema:
    name: Apply dedicated address-reference schema
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'APPLY-address-reference-schema'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Require current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Require protected D1 credential
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Apply schema only to dedicated reference D1
        run: npx wrangler d1 execute psipedia-address-reference --remote --file address-reference/schema.sql
      - name: Verify reference tables exist
        shell: bash
        run: |
          set -euo pipefail
          out="$(npx wrangler d1 execute psipedia-address-reference --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name LIKE 'address_%' ORDER BY name" --json)"
          echo "$out" > /tmp/address-reference-schema.json
          node - <<'NODE'
          const fs=require("fs");
          const x=JSON.parse(fs.readFileSync("/tmp/address-reference-schema.json","utf8"));
          const text=JSON.stringify(x);
          for (const table of ["address_dataset_releases","address_municipalities","address_streets","address_points","address_reference_runtime"]) {
            if (!text.includes(table)) throw new Error("missing table "+table);
          }
          console.log("ADDRESS_REFERENCE_SCHEMA_PASS");
          NODE
