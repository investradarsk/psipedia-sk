name: Production D1 0133 Read-only Verifier

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AUDIT-0133-postflight-psipedia-sk-db exactly (never APPLY)
        required: true
        type: string

# Share the existing migration lock, but never invoke its apply workflow.
concurrency:
  group: production-d1-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify recorded 0133 and canonical D1 schema (SELECT only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - name: Require main and explicit read-only confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          actual="$(node -e 'const e=require(process.env.GITHUB_EVENT_PATH); process.stdout.write(e.inputs?.confirmation || "")')"
          test "$actual" = "AUDIT-0133-postflight-psipedia-sk-db"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require dispatched revision still matches main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - name: Offline read-only and migration contract tests
        run: node --test tests/production-d1-0133-readonly.test.mjs tests/production-d1-0133-rollout.test.mjs

      - name: Canonical migration safety
        run: npm run db:check-migrations

      - name: Resolve protected Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          account="$(node -e 'process.stdout.write(require("./config/cloudflare-resources.json").account_id || "")')"
          test -n "$account"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Verify production 0133 using three allowlisted SELECT queries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .production-d1-0133-readonly
          node scripts/production-d1-0133-readonly.mjs | tee .production-d1-0133-readonly/report.json

      - name: Retain aggregate-only verification report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: production-d1-0133-readonly-${{ github.run_id }}
          path: .production-d1-0133-readonly/report.json
          if-no-files-found: error
          retention-days: 30
