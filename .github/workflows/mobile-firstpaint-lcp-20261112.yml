name: MOBILE-FIRSTPAINT-LCP performance regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/globals.css'
      - 'app/adresar/**'
      - 'lib/public-hero-transform-cache.ts'
      - 'lib/public-static-asset-cache.ts'
      - 'worker/index.ts'
      - 'public/styles/directory-*'
      - 'scripts/audit-public-css-bundle.mjs'
      - 'tests/public-hero-transform-cache.test.mjs'
      - 'tests/mobile-firstpaint-css.test.mjs'
      - 'tests/public-static-asset-cache.test.mjs'
      - '.github/workflows/mobile-firstpaint-lcp-20261112.yml'

permissions:
  contents: read

concurrency:
  group: mobile-firstpaint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-firstpaint:
    if: startsWith(github.head_ref, 'perf/mobile-firstpaint-lcp-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - name: Hero edge cache authorization, mobile CSS isolation and static asset contract
        run: |
          node --experimental-strip-types --test tests/public-hero-transform-cache.test.mjs tests/mobile-firstpaint-css.test.mjs tests/public-static-asset-cache.test.mjs
      - name: Existing public render and cache regressions
        run: |
          npm run test:perf-fastpaths
          npm run test:public-css-scope
          npm run test:homepage-media
          node --experimental-strip-types --test tests/public-media-edge-cache.test.mjs
      - name: Real production build
        run: npm run build
      - name: Verify compiled route-only CSS and compressed index sizes
        run: node scripts/audit-public-css-bundle.mjs
