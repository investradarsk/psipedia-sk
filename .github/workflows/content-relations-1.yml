name: CONTENT-RELATIONS-1

on:
  pull_request:
    branches: [main]
    paths:
      - "app/[section]/[slug]/page.tsx"
      - "app/clanky/[slug]/page.tsx"
      - "app/plemena/[slug]/page.tsx"
      - "app/adresar/[category]/[slug]/page.tsx"
      - "components/article-detail.tsx"
      - "components/directory-profile-detail.tsx"
      - "components/organization-profile-detail.tsx"
      - "components/related-entity-list.tsx"
      - "components/related-entity-list.module.css"
      - "lib/content-relations.ts"
      - "lib/breed-canonical.ts"
      - "lib/breed-store.ts"
      - "lib/help-organization-store.ts"
      - "lib/organization-adoption-store.ts"
      - "tests/content-relations.test.mjs"
      - "tests/organization-adoption-relation.test.mjs"
      - "tests/e2e/content-relations-1.spec.ts"
      - "tests/fixtures/content-relations-1-e2e.sql"
      - ".github/workflows/content-relations-1.yml"
      - "package-lock.json"
      - "playwright.config.ts"
      - "vite.config.*"
      - "tsconfig.json"

concurrency:
  group: content-relations-1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  content-relations:
    name: Explicit relations — unit, build, desktop/mobile
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_BASE_URL: http://localhost:5173
      PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v4

      - name: Log revision evidence
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "pr_head_sha=${{ github.event.pull_request.head.sha || 'n/a' }}"
          echo "base_sha=${{ github.event.pull_request.base.sha || 'n/a' }}"
          echo "github_sha=${{ github.sha }}"
          echo "checked_out_sha=$(git rev-parse HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused relation and SEO regression tests
        run: |
          node --experimental-strip-types --experimental-loader ./tests/cloudflare-loader.mjs --test             tests/content-relations.test.mjs             tests/organization-adoption-relation.test.mjs             tests/sitemap-seo.test.mjs             tests/organization-sitemap.test.mjs

      - name: Lint PR code
        run: npm run lint

      - name: Build PR code
        run: npm run build

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Configure CI-only local PII keys
        run: |
          encryption_key="$(printf '%s' '0123456789abcdef0123456789abcdef' | base64 -w0 | tr -d '=')"
          hash_key="$(printf '%s' 'fedcba9876543210fedcba9876543210' | base64 -w0 | tr -d '=')"
          printf 'PII_ENCRYPTION_KEY=%s\nPII_HASH_KEY=%s\n' "$encryption_key" "$hash_key" > .dev.vars

      - name: Apply migrations to isolated local D1 only
        run: |
          mv drizzle/0038_adoption_staging_data.sql /tmp/0038_adoption_staging_data.sql
          mv drizzle/0039_activate_canonical_adoptions.sql /tmp/0039_activate_canonical_adoptions.sql
          trap 'mv /tmp/0038_adoption_staging_data.sql drizzle/0038_adoption_staging_data.sql; mv /tmp/0039_activate_canonical_adoptions.sql drizzle/0039_activate_canonical_adoptions.sql' EXIT
          npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to .wrangler/state

      - name: Seed disposable relation fixtures into isolated local D1 only
        run: npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/content-relations-1-e2e.sql

      - name: Start isolated local app
        run: |
          mkdir -p .e2e-artifacts/content-relations
          nohup npm exec vite -- --host 127.0.0.1 > .e2e-artifacts/content-relations/server.log 2>&1 &
          echo $! > .e2e-artifacts/content-relations/server.pid
          ready=0
          for attempt in $(seq 1 120); do
            if curl --silent --fail http://localhost:5173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -200 .e2e-artifacts/content-relations/server.log
            exit 1
          fi

      - name: CONTENT-RELATIONS Playwright — desktop
        run: npx playwright test tests/e2e/content-relations-1.spec.ts --project=desktop-chromium --workers=1 --retries=0

      - name: CONTENT-RELATIONS Playwright — mobile 390 px
        run: npx playwright test tests/e2e/content-relations-1.spec.ts --project=mobile-chromium --workers=1 --retries=0

      - name: Stop isolated local app
        if: always()
        run: |
          if [ -f .e2e-artifacts/content-relations/server.pid ]; then
            kill "$(cat .e2e-artifacts/content-relations/server.pid)" 2>/dev/null || true
          fi

      - name: Upload desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-relations-1-evidence-${{ github.run_attempt }}
          path: |
            .e2e-artifacts/content-relations/*.png
            .e2e-artifacts/content-relations/server.log
            playwright-report/
            test-results/playwright/
          if-no-files-found: warn
          retention-days: 14
