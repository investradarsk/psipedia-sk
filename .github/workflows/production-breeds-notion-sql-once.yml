name: Plemená – jednorazový Notion do verejného SQL (manual)

# No cron, push or PR hooks. Only owner-started workflow on current main.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview reads 344 Notion profiles; apply imports directly to 0173 D1 tables
        type: choice
        required: true
        default: preview
        options: [preview, apply]
      confirmation:
        description: PREVIEW-BREEDS-PUBLIC-344 or IMPORT-BREEDS-PUBLIC-344
        required: true
        type: string

concurrency:
  group: production-d1-migration
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  import-public-breeds:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN || secrets.GEMINI_AGENT_NOTION_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      BREED_PUBLIC_TRANSFER_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Refuse automated and unconfirmed import
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = investradarsk/psipedia-sk
          test -n "$NOTION_API_TOKEN"
          case "${{ inputs.mode }}" in
            preview) expected=PREVIEW-BREEDS-PUBLIC-344 ;;
            apply) expected=IMPORT-BREEDS-PUBLIC-344; test -n "$CLOUDFLARE_API_TOKEN" ;;
            *) exit 1 ;;
          esac
          test "$BREED_PUBLIC_TRANSFER_CONFIRMATION" = "$expected"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify current main
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Verify normalized import contract and SQL schema
        run: node --test tests/breed-public-sql-transfer.test.mjs
      - name: Bind production Cloudflare account
        run: |
          account="$(node -e 'process.stdout.write(require("./config/cloudflare-resources.json").account_id)')"
          test -n "$account"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
      - name: Read 344 Notion profiles and optionally write 0173 SQL
        shell: bash
        run: node --experimental-strip-types scripts/breed-public-notion-sql-transfer.mjs "--${{ inputs.mode }}"
