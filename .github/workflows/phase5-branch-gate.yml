name: Phase 5 exact-SHA diagnostics

on:
  push:
    branches: [codex/phase5-repro-dadf21c]

permissions:
  contents: read

jobs:
  desktop:
    name: Reproduce Phase 5 desktop at dadf21c
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dadf21c322114148f770ce198464a47b1870a787
      - name: Prove exact checkout
        shell: bash
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "dadf21c322114148f770ce198464a47b1870a787"
          git status --short
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Build
        run: npm run build
      - name: Apply existing D1 migrations locally
        run: npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run exact Phase 5 desktop E2E
        run: npx playwright test tests/e2e/reviews-phase5.spec.ts --project=desktop-chromium --reporter=line,html
      - name: Preserve desktop Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-dadf21c-desktop-playwright
          if-no-files-found: warn
          retention-days: 7
          path: |
            test-results/
            playwright-report/

  mobile:
    name: Reproduce Phase 5 mobile at dadf21c
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dadf21c322114148f770ce198464a47b1870a787
      - name: Prove exact checkout
        shell: bash
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "dadf21c322114148f770ce198464a47b1870a787"
          git status --short
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Build
        run: npm run build
      - name: Apply existing D1 migrations locally
        run: npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run exact Phase 5 mobile E2E
        run: npx playwright test tests/e2e/reviews-phase5.spec.ts --project=mobile-chromium --reporter=line,html
      - name: Preserve mobile Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-dadf21c-mobile-playwright
          if-no-files-found: warn
          retention-days: 7
          path: |
            test-results/
            playwright-report/
