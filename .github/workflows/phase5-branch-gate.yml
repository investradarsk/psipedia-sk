name: Phase 5 branch gate

on:
  push:
    branches: [codex/phase5-reviews-tests]

permissions:
  contents: read

jobs:
  phase5-gate:
    name: Phase 5 full local gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Complete unit and integration tests
        run: npm test
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Initialize local D1 schema from existing migrations
        run: npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json
      - name: Phase 5 local Playwright desktop
        run: npx playwright test tests/e2e/reviews-phase5.spec.ts --project=desktop-chromium
      - name: Phase 5 local Playwright mobile
        run: npx playwright test tests/e2e/reviews-phase5.spec.ts --project=mobile-chromium
