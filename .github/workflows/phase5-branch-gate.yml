name: Phase 5 D1 content diagnostics

on:
  push:
    branches:
      - codex/phase5-repro-dadf21c

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dadf21c322114148f770ce198464a47b1870a787
      - name: Prove exact checkout
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "dadf21c322114148f770ce198464a47b1870a787"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply migrations locally
        run: npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to "$PWD/.wrangler/state"
      - name: Query local D1 content
        run: |
          mkdir -p diagnostic-artifacts
          echo '=== portal_section_settings ===' | tee diagnostic-artifacts/d1.txt
          npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to "$PWD/.wrangler/state" --command "SELECT COUNT(*) AS section_count FROM portal_section_settings; SELECT slug,label,visible,length(subpages_json) AS subpages_json_length FROM portal_section_settings ORDER BY position; SELECT slug,label,visible,subpages_json FROM portal_section_settings WHERE slug='recenzie';" | tee -a diagnostic-artifacts/d1.txt
          echo '=== managed_articles ===' | tee -a diagnostic-artifacts/d1.txt
          npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to "$PWD/.wrangler/state" --command "SELECT COUNT(*) AS article_count FROM managed_articles; SELECT COUNT(*) AS published_review_count FROM managed_articles WHERE portal_section='recenzie' AND status='published'; SELECT id,slug,title,portal_section,portal_subpage,status,published_at FROM managed_articles WHERE portal_section='recenzie' ORDER BY id LIMIT 50;" | tee -a diagnostic-artifacts/d1.txt
          echo '=== recenzie string matches ===' | tee -a diagnostic-artifacts/d1.txt
          npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to "$PWD/.wrangler/state" --command "SELECT slug,label FROM portal_section_settings WHERE lower(slug) LIKE '%recenzi%' OR lower(label) LIKE '%recenzi%'; SELECT id,slug,title,portal_section,portal_subpage,status FROM managed_articles WHERE lower(portal_section) LIKE '%recenzi%' OR lower(title) LIKE '%recenzi%' OR lower(slug) LIKE '%recenzi%' LIMIT 50;" | tee -a diagnostic-artifacts/d1.txt
      - name: Search existing seed mechanisms
        run: |
          mkdir -p diagnostic-artifacts
          find . -path './node_modules' -prune -o -path './dist' -prune -o -type f \( -iname '*seed*' -o -iname '*fixture*' -o -iname '*bootstrap*' \) -print | tee diagnostic-artifacts/seed-files.txt
          grep -RniE --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git 'seed|fixture|bootstrap|INSERT INTO portal_section_settings|INSERT INTO managed_articles' . | head -n 500 | tee diagnostic-artifacts/seed-content.txt || true
      - name: Probe recenzie
        run: |
          mkdir -p diagnostic-artifacts
          setsid bash -c 'exec npm run dev' > diagnostic-artifacts/server.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            ROOT=$(curl -sS --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:5173/ || true)
            [ "$ROOT" = "200" ] && break
            sleep 2
          done
          curl -sS -L -D diagnostic-artifacts/recenzie-headers.txt -o diagnostic-artifacts/recenzie.html -w 'HTTP=%{http_code}\nURL=%{url_effective}\n' http://127.0.0.1:5173/recenzie | tee diagnostic-artifacts/recenzie-summary.txt
          grep -o '<h1[^>]*>[^<]*</h1>' diagnostic-artifacts/recenzie.html | head -n 5 | tee -a diagnostic-artifacts/recenzie-summary.txt || true
          grep -o 'Táto stopa nikam nevedie\|Recenzie a testy' diagnostic-artifacts/recenzie.html | sort -u | tee -a diagnostic-artifacts/recenzie-summary.txt || true
          kill -TERM -- "-$PID" 2>/dev/null || true
          sleep 1
          kill -KILL -- "-$PID" 2>/dev/null || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-dadf21c-d1-content-diagnostics
          retention-days: 7
          path: diagnostic-artifacts/
