name: Phase 5 exact-SHA full gate

on:
  push:
    branches: [codex/phase5-repro-dadf21c]

permissions:
  contents: read

jobs:
  phase5-gate:
    name: Validate Phase 5 at dadf21c with shared local D1 state
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dadf21c322114148f770ce198464a47b1870a787

      - name: Prove exact application checkout
        shell: bash
        run: |
          set -euxo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "dadf21c322114148f770ce198464a47b1870a787"
          test -z "$(git status --porcelain)"
          git status --short

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Complete npm test
        run: npm test

      - name: Apply existing D1 migrations to Vite local persistence
        shell: bash
        run: |
          npx wrangler d1 migrations apply DB \
            --local \
            --config dist/server/wrangler.json \
            --persist-to "$PWD/.wrangler/state"

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify local webServer readiness before Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-artifacts .wrangler
          npm run dev > diagnostic-artifacts/readiness-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          HTTP_STATUS=000
          for i in $(seq 1 60); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server exited before readiness"
              cat diagnostic-artifacts/readiness-server.log
              exit 1
            fi

            HTTP_STATUS=$(curl --silent --show-error --max-time 3 \
              --output diagnostic-artifacts/readiness-body.txt \
              --write-out '%{http_code}' \
              http://127.0.0.1:5173/ || true)

            case "$HTTP_STATUS" in
              2??|3??|400|401|402|403)
                READY=1
                echo "Playwright-compatible readiness reached: HTTP $HTTP_STATUS on probe $i"
                break
                ;;
              *)
                echo "Probe $i returned HTTP $HTTP_STATUS"
                ;;
            esac
            sleep 2
          done

          echo "HTTP_STATUS=$HTTP_STATUS" | tee diagnostic-artifacts/readiness-summary.txt
          echo "READY=$READY" | tee -a diagnostic-artifacts/readiness-summary.txt
          ss -ltnp | tee diagnostic-artifacts/readiness-sockets.txt || true
          cp diagnostic-artifacts/readiness-body.txt diagnostic-artifacts/readiness-body-final.txt 2>/dev/null || true
          cat diagnostic-artifacts/readiness-server.log

          test "$READY" = "1"
          test "$HTTP_STATUS" != "500"

      - name: Phase 5 Playwright desktop
        run: npx playwright test tests/e2e/reviews-phase5.spec.ts --project=desktop-chromium --reporter=line,html

      - name: Preserve desktop Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-dadf21c-desktop-playwright-final-gate
          if-no-files-found: warn
          retention-days: 7
          path: |
            test-results/
            playwright-report/
            diagnostic-artifacts/

      - name: Clear Playwright outputs before mobile
        if: success()
        shell: bash
        run: rm -rf test-results playwright-report

      - name: Phase 5 Playwright mobile
        run: npx playwright test tests/e2e/reviews-phase5.spec.ts --project=mobile-chromium --reporter=line,html

      - name: Preserve mobile Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-dadf21c-mobile-playwright-final-gate
          if-no-files-found: warn
          retention-days: 7
          path: |
            test-results/
            playwright-report/
            diagnostic-artifacts/

      - name: Final tracked status
        if: always()
        shell: bash
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          git status --short
