name: Production Breed Workcopy Step 3 Postflight (read-only)

# Must be triggered manually from main. No D1 or Notion mutations.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AUDIT-BREED-BASELINES-344 (read-only)
        type: string
        required: true

concurrency:
  group: production-d1-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  baseline-postflight:
    name: Protected read-only 344 Notion/D1 baseline audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      BREED_POSTFLIGHT_CONFIRMATION: ${{ inputs.confirmation }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      BREED_POSTFLIGHT_NOTION_TOKEN: ${{ secrets.NOTION_API_TOKEN || secrets.GEMINI_AGENT_NOTION_TOKEN }}
    steps:
      - name: Main-only owner authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "investradarsk/psipedia-sk"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$BREED_POSTFLIGHT_CONFIRMATION" = "AUDIT-BREED-BASELINES-344"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$BREED_POSTFLIGHT_NOTION_TOKEN"

      - name: Checkout pinned workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require fresh main HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - name: Run isolated postflight contract checks
        run: |
          npm run db:check-migrations
          node --experimental-strip-types --test tests/production-breed-workcopy-step3-postflight.test.mjs
          node --test tests/production-breed-workcopy-baseline-step2.test.mjs
          node --experimental-strip-types --test tests/notion-breed-workcopy-receipt.test.mjs

      - name: Restrict Cloudflare account to canonical production
        shell: bash
        run: |
          set -euo pipefail
          account="$(node -e 'process.stdout.write(require("./config/cloudflare-resources.json").account_id)')"
          test -n "$account"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Read live 344 D1 receipts and both Notion sources
        run: node --experimental-strip-types scripts/production-breed-workcopy-postflight.mjs

      - name: Preserve aggregate audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-breed-workcopy-postflight-${{ github.run_id }}
          path: .production-breed-workcopy-postflight/report.json
          if-no-files-found: ignore
          retention-days: 30
