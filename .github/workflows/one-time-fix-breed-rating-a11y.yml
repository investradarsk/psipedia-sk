name: One-time fix breed rating accessibility
on:
  push:
    branches: [fix/admin-section-source-of-truth]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-section-source-of-truth
      - name: Fix rating semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/plemena/[slug]/page.tsx')
          t = p.read_text()
          old = '<span aria-label={`${sport.rating} z 5`}>{Array.from({length:5},(_,index)=><i className={index<sport.rating?"is-filled":""} key={index}/>)}</span>'
          new = '<span role="img" aria-label={`${sport.rating} z 5`}>{Array.from({length:5},(_,index)=><i aria-hidden="true" className={index<sport.rating?"is-filled":""} key={index}/>)}</span>'
          if old not in t:
              raise SystemExit('Expected sport rating markup not found')
          p.write_text(t.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/plemena/[slug]/page.tsx'
          git diff --cached --check
          git commit -m "Fix breed sport rating accessibility"
          git push origin HEAD:fix/admin-section-source-of-truth
