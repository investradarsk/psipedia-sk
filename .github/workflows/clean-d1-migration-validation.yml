name: Clean D1 migration validation

on:
  pull_request:
    branches: [main]
    paths:
      - "drizzle/**"
      - "db/**"
      - "data/imports/adoptions-ready-2026-09-13.json"
      - "scripts/check-migration-safety.mjs"
      - "scripts/validate-clean-d1.mjs"
      - "package.json"
      - "package-lock.json"
      - "migration-safety.baseline.json"
      - ".github/workflows/clean-d1-migration-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-d1:
    name: Fresh local D1 — full migration chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Migration safety contract
        run: npm run db:check-migrations
      - name: Empty local D1 → full chain → current schema
        run: npm run db:validate-clean
