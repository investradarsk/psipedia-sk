name: Production D1 identity 1862 (read-only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter CHECK-1862-psipedia-sk-db exactly
        required: true
        type: string

concurrency:
  group: production-d1-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  read-only-identity:
    name: Verify actual D1 identity, Notion mapping, Gemini provenance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      IDENTITY_1862_CONFIRMATION: ${{ inputs.confirmation }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - name: Require exact owner confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "investradarsk/psipedia-sk"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$IDENTITY_1862_CONFIRMATION" = "CHECK-1862-psipedia-sk-db"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Checkout exact dispatched main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Reject stale main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check audit runner cannot mutate data
        run: |
          node --check scripts/production-d1-identity-1862-readonly.mjs
          node --test tests/production-d1-identity-1862-readonly.test.mjs

      - name: Bind protected Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          account="$(node -e 'process.stdout.write(require("./config/cloudflare-resources.json").account_id)')"
          test -n "$account"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Collect exact D1 identity evidence without writes
        run: node scripts/production-d1-identity-1862-readonly.mjs

      - name: Preserve the read-only result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-d1-identity-1862-${{ github.run_id }}
          path: .production-d1-identity-1862/report.json
          if-no-files-found: ignore
          retention-days: 30
