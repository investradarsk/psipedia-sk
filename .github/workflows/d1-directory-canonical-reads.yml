name: D1 canonical directory reads (read-only regressions)

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/breed-canonical.ts"
      - "lib/directory-store.ts"
      - "lib/directory-sql-contacts.ts"
      - "lib/directory-secondary-category-sql.ts"
      - "lib/directory-0170-editorial-sql-mirror.ts"
      - "tests/directory-0170-editorial-sql-mirror.test.mjs"
      - "tests/directory-0170-secondary-category-dualwrite.test.mjs"
      - "tests/directory-0170-manual-contacts.test.mjs"
      - "lib/directory-breeder-card.ts"
      - "lib/directory-read-facets.ts"
      - "lib/breeder-profile-relations.ts"
      - "lib/notion-directory-sync.ts"
      - "tests/breeder-club-single-source.test.mjs"
      - "tests/d1-0163-0169-schema-readonly-audit.test.mjs"
      - "scripts/d1-0163-0169-schema-readonly-audit.sql"
      - "drizzle/0169_directory_breeder_club_relations.sql"
      - "tests/d1-canonical-breed-cost.test.mjs"
      - "tests/directory-read-facets.test.mjs"
      - "tests/directory-breeder-preview-step3.test.mjs"
      - "tests/trainer-breed-unification.test.mjs"
      - "scripts/d1-trainer-breed-links-preflight.sql"
      - "scripts/d1-trainer-breed-links-backfill.sql"
      - "lib/breeder-profile-relations.ts"
      - ".github/workflows/d1-directory-canonical-reads.yml"

permissions:
  contents: read

concurrency:
  group: d1-directory-canonical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - name: Exact canonical identity, source facets and secondary-category parity
        run: node --experimental-strip-types --test tests/directory-0170-manual-contacts.test.mjs tests/directory-0170-secondary-category-dualwrite.test.mjs tests/directory-0170-editorial-sql-mirror.test.mjs tests/d1-canonical-breed-cost.test.mjs tests/directory-read-facets.test.mjs tests/breeder-club-single-source.test.mjs tests/d1-0163-0169-schema-readonly-audit.test.mjs
      - name: Historical trainer relation migration regression (not a production instruction)
        run: node --experimental-strip-types --test tests/trainer-breed-unification.test.mjs
      - name: Breeder-card canonical links and safe fallback
        run: node --experimental-strip-types --experimental-loader ./tests/cloudflare-loader.mjs --test tests/directory-breeder-preview-step3.test.mjs
