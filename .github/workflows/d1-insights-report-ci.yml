name: D1 Insights Report offline tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/d1-insights-report.mjs"
      - "tests/d1-insights-report.test.mjs"
      - "tests/fixtures/d1-insights-sample.json"
      - ".github/workflows/d1-insights-report-ci.yml"

permissions:
  contents: read

concurrency:
  group: d1-insights-report-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  report-tests:
    name: Offline parser and privacy tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: node --check scripts/d1-insights-report.mjs
      - name: Fixture and privacy regressions
        run: node --test tests/d1-insights-report.test.mjs
      - name: Synthetic example report
        run: node scripts/d1-insights-report.mjs --input tests/fixtures/d1-insights-sample.json --period 1d --origin fixture --output /tmp/d1-insights-fixture-report.json
