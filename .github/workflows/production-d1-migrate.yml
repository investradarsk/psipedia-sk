name: Production D1 Migrate

on:
  workflow_dispatch:
    inputs:
      target_migration:
        description: Canonical migration to apply
        required: true
        type: choice
        default: 0062_profile_reviews_foundation.sql
        options:
          - 0062_profile_reviews_foundation.sql
      confirmation:
        description: Type APPLY-0062-psipedia-sk-db exactly
        required: true
        type: string

concurrency:
  group: production-d1-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Preflight, migrate, verify and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      TARGET_MIGRATION: ${{ inputs.target_migration }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - name: Require main and explicit production confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          confirmation="$(node -e 'const fs=require("fs"); const e=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,"utf8")); process.stdout.write(e.inputs?.confirmation || "")')"
          test "$confirmation" = "APPLY-0062-psipedia-sk-db"

      - name: Checkout exact dispatched main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Log non-secret revision evidence
        run: |
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
          echo "checked_out_sha=$(git rev-parse HEAD)"
          echo "target_migration=$TARGET_MIGRATION"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require protected migration credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Load canonical Cloudflare account id
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("config/cloudflare-resources.json","utf8")); process.stdout.write(x.account_id || "")')"
          test -n "$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Repository migration safety
        run: npm run db:check-migrations

      - name: Build exact production artifact and generated Wrangler config
        run: npm run build

      - name: Production D1 preflight and Time Travel recovery point
        id: preflight
        run: |
          node scripts/production-d1-migrate.mjs preflight
          target_applied="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(".production-d1/preflight-report.json","utf8")); process.stdout.write(String(Boolean(x.targetApplied)))')"
          echo "target_applied=$target_applied" >> "$GITHUB_OUTPUT"

      - name: Apply canonical migration through scoped migration directory
        if: steps.preflight.outputs.target_applied != 'true'
        run: node scripts/production-d1-migrate.mjs apply

      - name: Verify schema, history, resource backfill and data integrity
        run: node scripts/production-d1-migrate.mjs verify

      - name: Install Chromium for production smoke
        run: npx playwright install --with-deps chromium

      - name: Key production route smoke
        shell: bash
        run: |
          set -euo pipefail
          for route in             "/"             "/adresar"             "/adresar/veterinari/ab-vet-piestany"             "/pomoc-psom/utulky"             "/sitemap.xml"             "/recenzie"
          do
            status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "https://psipedia.sk$route")"
            echo "$route -> $status"
            case "$status" in
              200|301|302|307|308) ;;
              *) exit 1 ;;
            esac
          done

      - name: Production Playwright smoke — desktop
        env:
          E2E_BASE_URL: https://psipedia.sk
        run: npx playwright test --grep @production --project=desktop-chromium --workers=1

      - name: Production Playwright smoke — mobile
        env:
          E2E_BASE_URL: https://psipedia.sk
        run: npx playwright test --grep @production --project=mobile-chromium --workers=1

      - name: Upload safe migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-d1-migration-${{ github.run_id }}
          path: |
            .production-d1/manifest.json
            .production-d1/preflight-report.json
            .production-d1/postflight-report.json
          if-no-files-found: warn
          retention-days: 30
