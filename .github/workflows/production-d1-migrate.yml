name: Production D1 Migrate

on:
  workflow_dispatch:
    inputs:
      target_migration:
        description: Canonical migration to apply
        required: true
        type: choice
        default: 0062_profile_reviews_foundation.sql
        options:
          - 0062_profile_reviews_foundation.sql
          - 0063_partner_claims_verification.sql
          - 0064_geo_foundation.sql
          - 0065_partner_profile_changes.sql
          - 0066_partner_new_profile_submissions.sql
          - 0067_partner_events.sql
          - 0068_partner_commercial_activation.sql
          - 0069_partner_auth_onboarding_hardening.sql
          - 0070_partner_multimethod_auth.sql
          - 0071_admin_universal_notifications.sql
          - 0072_partner_media_uploads.sql
          - 0073_automation_multisource_entity_resolution.sql
          - 0074_directory_service_address.sql
          - 0075_automation_zsk_event_source.sql
          - 0076_automation_non_event_entity_resolution_foundation.sql
          - 0077_directory_geo_provider_result_id.sql
          - 0078_automation_possible_match_reviews.sql
          - 0079_automation_agility_event_source.sql
          - 0080_automation_canonical_apply.sql
          - 0081_automation_mushing_event_source.sql
          - 0082_automation_discovery_candidate_evidence.sql
          - 0083_automation_search_budgets.sql
          - 0084_automation_governance_registry.sql
          - 0085_automation_tavily_discovery_root.sql
          - 0086_automation_tavily_event_cadence.sql
          - 0087_automation_tavily_help_roots.sql
          - 0088_automation_tavily_organization_root.sql
          - 0089_automation_tavily_directory_roots.sql
          - 0090_geo_google_place_identity.sql
          - 0091_automation_detach_drafts.sql
          - 0092_automation_product_model.sql
          - 0093_automation_address_review.sql
          - 0094_canonical_draft_delete.sql
          - 0095_automation_calendar_schedule.sql
          - 0096_automation_update_field_reviews.sql
          - 0097_automation_operations_metrics.sql
          - 0098_directory_notion_bidirectional_sync.sql
          - 0099_media_source_quality.sql
          - 0100_eshop_ratings.sql
      confirmation:
        description: Type APPLY-<migration index>-psipedia-sk-db exactly (for example APPLY-0064-psipedia-sk-db)
        required: true
        type: string

concurrency:
  group: production-d1-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Preflight, migrate, verify and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      TARGET_MIGRATION: ${{ inputs.target_migration }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - name: Require main and explicit production confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          confirmation="$(node -e 'const fs=require("fs"); const e=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,"utf8")); process.stdout.write(e.inputs?.confirmation || "")')"
          case "$TARGET_MIGRATION" in
            0062_profile_reviews_foundation.sql) expected_confirmation="APPLY-0062-psipedia-sk-db" ;;
            0063_partner_claims_verification.sql) expected_confirmation="APPLY-0063-psipedia-sk-db" ;;
            0064_geo_foundation.sql) expected_confirmation="APPLY-0064-psipedia-sk-db" ;;
            0065_partner_profile_changes.sql) expected_confirmation="APPLY-0065-psipedia-sk-db" ;;
            0066_partner_new_profile_submissions.sql) expected_confirmation="APPLY-0066-psipedia-sk-db" ;;
            0067_partner_events.sql) expected_confirmation="APPLY-0067-psipedia-sk-db" ;;
            0068_partner_commercial_activation.sql) expected_confirmation="APPLY-0068-psipedia-sk-db" ;;
            0069_partner_auth_onboarding_hardening.sql) expected_confirmation="APPLY-0069-psipedia-sk-db" ;;
            0070_partner_multimethod_auth.sql) expected_confirmation="APPLY-0070-psipedia-sk-db" ;;
            0071_admin_universal_notifications.sql) expected_confirmation="APPLY-0071-psipedia-sk-db" ;;
            0072_partner_media_uploads.sql) expected_confirmation="APPLY-0072-psipedia-sk-db" ;;
            0073_automation_multisource_entity_resolution.sql) expected_confirmation="APPLY-0073-psipedia-sk-db" ;;
            0074_directory_service_address.sql) expected_confirmation="APPLY-0074-psipedia-sk-db" ;;
            0075_automation_zsk_event_source.sql) expected_confirmation="APPLY-0075-psipedia-sk-db" ;;
            0076_automation_non_event_entity_resolution_foundation.sql) expected_confirmation="APPLY-0076-psipedia-sk-db" ;;
            0077_directory_geo_provider_result_id.sql) expected_confirmation="APPLY-0077-psipedia-sk-db" ;;
            0078_automation_possible_match_reviews.sql) expected_confirmation="APPLY-0078-psipedia-sk-db" ;;
            0079_automation_agility_event_source.sql) expected_confirmation="APPLY-0079-psipedia-sk-db" ;;
            0080_automation_canonical_apply.sql) expected_confirmation="APPLY-0080-psipedia-sk-db" ;;
            0081_automation_mushing_event_source.sql) expected_confirmation="APPLY-0081-psipedia-sk-db" ;;
            0082_automation_discovery_candidate_evidence.sql) expected_confirmation="APPLY-0082-psipedia-sk-db" ;;
            0083_automation_search_budgets.sql) expected_confirmation="APPLY-0083-psipedia-sk-db" ;;
            0084_automation_governance_registry.sql) expected_confirmation="APPLY-0084-psipedia-sk-db" ;;
            0085_automation_tavily_discovery_root.sql) expected_confirmation="APPLY-0085-psipedia-sk-db" ;;
            0086_automation_tavily_event_cadence.sql) expected_confirmation="APPLY-0086-psipedia-sk-db" ;;
            0087_automation_tavily_help_roots.sql) expected_confirmation="APPLY-0087-psipedia-sk-db" ;;
            0088_automation_tavily_organization_root.sql) expected_confirmation="APPLY-0088-psipedia-sk-db" ;;
            0089_automation_tavily_directory_roots.sql) expected_confirmation="APPLY-0089-psipedia-sk-db" ;;
            0090_geo_google_place_identity.sql) expected_confirmation="APPLY-0090-psipedia-sk-db" ;;
            0091_automation_detach_drafts.sql) expected_confirmation="APPLY-0091-psipedia-sk-db" ;;
            0092_automation_product_model.sql) expected_confirmation="APPLY-0092-psipedia-sk-db" ;;
            0093_automation_address_review.sql) expected_confirmation="APPLY-0093-psipedia-sk-db" ;;
            0094_canonical_draft_delete.sql) expected_confirmation="APPLY-0094-psipedia-sk-db" ;;
            0095_automation_calendar_schedule.sql) expected_confirmation="APPLY-0095-psipedia-sk-db" ;;
            0096_automation_update_field_reviews.sql) expected_confirmation="APPLY-0096-psipedia-sk-db" ;;
            0097_automation_operations_metrics.sql) expected_confirmation="APPLY-0097-psipedia-sk-db" ;;
            0098_directory_notion_bidirectional_sync.sql) expected_confirmation="APPLY-0098-psipedia-sk-db" ;;
            0099_media_source_quality.sql) expected_confirmation="APPLY-0099-psipedia-sk-db" ;;
            0100_eshop_ratings.sql) expected_confirmation="APPLY-0100-psipedia-sk-db" ;;
            *) echo "Unsupported production migration target: $TARGET_MIGRATION" >&2; exit 1 ;;
          esac
          test "$confirmation" = "$expected_confirmation"

      - name: Checkout exact dispatched main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require dispatched revision to still be current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Log non-secret revision evidence
        run: |
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
          echo "checked_out_sha=$(git rev-parse HEAD)"
          echo "current_main_sha=$(git rev-parse origin/main)"
          echo "target_migration=$TARGET_MIGRATION"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require protected migration credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Load canonical Cloudflare account id
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("config/cloudflare-resources.json","utf8")); process.stdout.write(x.account_id || "")')"
          test -n "$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Repository migration safety
        run: npm run db:check-migrations

      - name: Build exact production artifact and generated Wrangler config
        run: npm run build

      - name: Production D1 preflight and Time Travel recovery point
        id: preflight
        run: |
          node scripts/production-d1-migrate.mjs preflight
          target_applied="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(".production-d1/preflight-report.json","utf8")); process.stdout.write(String(Boolean(x.targetApplied)))')"
          echo "target_applied=$target_applied" >> "$GITHUB_OUTPUT"

      - name: Apply canonical migration through scoped migration directory
        if: steps.preflight.outputs.target_applied != 'true'
        run: node scripts/production-d1-migrate.mjs apply

      - name: Verify schema, history, resource backfill and data integrity
        run: node scripts/production-d1-migrate.mjs verify

      - name: Install Chromium for production smoke
        run: npx playwright install --with-deps chromium

      - name: Geo readiness report
        if: inputs.target_migration == '0064_geo_foundation.sql'
        run: node scripts/production-d1-migrate.mjs geo-readiness

      - name: Key production route smoke
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          for route in             "/"             "/adresar"             "/adresar/veterinari/ab-vet-piestany"             "/pomoc-psom/utulky"             "/sitemap.xml"             "/recenzie"             "/mapa"             "/partner/prihlasenie"             "/partner/registracia"             "/partner/zabudnute-heslo"
          do
            echo "checking $route"
            status="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "https://psipedia.sk$route")"
            echo "$route -> $status"
            case "$status" in
              200|301|302|307|308) ;;
              *) exit 1 ;;
            esac
          done

      - name: Public map API smoke after geo migration
        if: inputs.target_migration == '0064_geo_foundation.sql'
        shell: bash
        run: |
          set -euo pipefail
          url='https://psipedia.sk/api/map?north=50&south=47&east=23&west=16&zoom=12'
          status="$(curl --silent --show-error --location --output .production-d1/map-api-smoke.json --write-out '%{http_code}' "$url")"
          echo "/api/map -> $status"
          test "$status" = "200"
          node - <<'NODE'
          const fs = require("fs");
          const body = JSON.parse(fs.readFileSync(".production-d1/map-api-smoke.json","utf8"));
          if (body.mode !== "items" && body.mode !== "clusters") throw new Error("Unexpected map response mode");
          if (!body.meta || typeof body.meta.count !== "number") throw new Error("Map response meta is missing");
          const serialized = JSON.stringify(body);
          for (const forbidden of ["source_fingerprint","resolved_source_fingerprint","normalized_query","query_fingerprint","last_error_code","manual_updated_by"]) {
            if (serialized.includes(forbidden)) throw new Error(`Private/internal map field leaked: ${forbidden}`);
          }
          console.log(`MAP_PRODUCTION_SMOKE mode=${body.mode} count=${body.meta.count} matched=${body.meta.matched} truncated=${body.meta.truncated}`);
          NODE

      - name: Production Playwright smoke — desktop
        env:
          E2E_BASE_URL: https://psipedia.sk
        run: npx playwright test --grep @production --project=desktop-chromium --workers=1

      - name: Production Playwright smoke — mobile
        env:
          E2E_BASE_URL: https://psipedia.sk
        run: npx playwright test --grep @production --project=mobile-chromium --workers=1

      - name: Upload safe migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-d1-migration-${{ github.run_id }}
          path: |
            .production-d1/manifest.json
            .production-d1/preflight-report.json
            .production-d1/postflight-report.json
            .production-d1/geo-readiness-report.json
            .production-d1/map-api-smoke.json
          if-no-files-found: warn
          retention-days: 30
