name: Event fallback artwork

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/event-listing-results.tsx'
      - 'components/event-calendar.tsx'
      - 'components/events-page.tsx'
      - 'components/event-image.tsx'
      - 'components/event-card.tsx'
      - 'components/event-detail.tsx'
      - 'components/events-public.module.css'
      - 'lib/event-type-presentation.ts'
      - 'public/images/events/defaults/**'
      - 'tests/event-fallback-images.test.mjs'
      - 'tests/e2e/events-fallback-images.spec.ts'
      - 'tests/e2e/events-listing-redesign.spec.ts'
      - 'tests/helpers/events-final-local-fixtures.mjs'
      - 'tests/events-fallback.playwright.config.ts'
      - 'tests/helpers/events-fallback-preview.*'
      - 'tests/helpers/events-preview-*'
      - '.github/workflows/events-fallback-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-fallback-artwork-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect events regression ownership
    runs-on: ubuntu-latest
    outputs:
      full_core: ${{ steps.scope.outputs.full_core }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - id: scope
        env:
          CI_SCOPE_EVENT_NAME: ${{ github.event_name }}
          CI_SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_SCOPE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-scope.mjs --github-output
  artwork:
    name: Event artwork SSR, desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Category mappings and server-rendered image priority
        run: node --experimental-strip-types --experimental-loader ./tests/admin-events-loader.mjs --test tests/event-fallback-images.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Real event components with in-memory test data only
        run: npx playwright test --config tests/events-fallback.playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-fallback-artwork-evidence
          path: outputs/redesign4/
          retention-days: 7

  public-events:
    # The broad suite is nightly/manual; PR events must retain focused browser coverage.
    needs: scope
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    name: Events final acceptance — real routes desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: http://localhost:5173
      PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start isolated local app and create local D1 storage
        run: |
          mkdir -p .e2e-artifacts/events-final
          nohup ./node_modules/.bin/vite --host 127.0.0.1 > .e2e-artifacts/events-final/server.log 2>&1 &
          echo $! > .e2e-artifacts/events-final/server.pid
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --max-time 2 http://localhost:5173/podujatia > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
      - name: Existing schema and deterministic fixtures in local D1 only
        run: node tests/helpers/events-final-local-fixtures.mjs
      # The initial readiness request creates the isolated D1 storage before
      # fixtures are present. Restart after the bootstrap to clear Vite's cached
      # missing-table overlay rather than hiding real browser errors.
      - name: Restart isolated app after local D1 schema bootstrap
        run: |
          kill "$(cat .e2e-artifacts/events-final/server.pid)"
          for attempt in $(seq 1 30); do
            if ! curl --silent --max-time 2 http://localhost:5173/images/events/defaults/vystavy.webp > /dev/null; then
              break
            fi
            sleep 1
          done
          nohup ./node_modules/.bin/vite --host 127.0.0.1 > .e2e-artifacts/events-final/server-after-seed.log 2>&1 &
          echo $! > .e2e-artifacts/events-final/server.pid
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 3 http://localhost:5173/podujatia > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
      - name: Events hero, calendar, filtering and final acceptance
        run: npm run e2e -- tests/e2e/events-hero-search.spec.ts tests/e2e/events-calendar-redesign.spec.ts tests/e2e/events-listing-redesign.spec.ts --workers=1 --retries=0
      - name: Stop isolated app
        if: always()
        run: |
          if [ -f .e2e-artifacts/events-final/server.pid ]; then
            kill "$(cat .e2e-artifacts/events-final/server.pid)" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: events-final-route-evidence
          path: |
            .e2e-artifacts/events-final/
            test-results/
          retention-days: 7
