name: Address Reference Foundation CI

on:
  pull_request:
    branches: [main]
    paths:
      - "address-reference/**"
      - "config/address-reference-resources.json"
      - "data/address-reference/**"
      - "scripts/address-reference-*.mjs"
      - "tests/address-reference-foundation.test.mjs"
      - "docs/ADDRESS-DATA-1A.md"
      - "package.json"
      - ".github/workflows/address-reference-foundation-ci.yml"
      - ".github/workflows/address-reference-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: ADDRESS-DATA-1A foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run test:address-reference
      - run: npm run config:check
      - run: npm run db:check-migrations
