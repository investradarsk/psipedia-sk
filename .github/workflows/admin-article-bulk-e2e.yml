name: ADMIN-2E Article Bulk Execution

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/api/admin/bulk/**"
      - "components/admin-bulk-selection.tsx"
      - "components/admin-help-dashboard.tsx"
      - "components/admin-event-dashboard.tsx"
      - "components/admin-directory-dashboard.tsx"
      - "components/admin-organization-publication-dashboard.tsx"
      - "components/admin-organization-publication.module.css"
      - "app/api/admin/organizations/bulk/**"
      - "lib/admin-bulk/**"
      - "tests/admin-bulk-*.test.mjs"
      - "tests/e2e/admin-article-bulk-execution.spec.ts"
      - "tests/fixtures/article-admin-bulk-e2e.sql"
      - "package.json"
      - ".github/workflows/admin-article-bulk-e2e.yml"

permissions:
  contents: read

jobs:
  focused-admin-articles:
    name: Admin Articles bulk — desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_BASE_URL: http://localhost:5173
      PSIPEDIA_E2E_LOCAL_BOOTSTRAP: "1"
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v4
      - name: Log revision evidence
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "pr_head_sha=${{ github.event.pull_request.head.sha || 'n/a' }}"
          echo "base_sha=${{ github.event.pull_request.base.sha || 'n/a' }}"
          echo "github_sha=${{ github.sha }}"
          echo "checked_out_sha=$(git rev-parse HEAD)"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Focused ADMIN bulk unit tests
        run: node --experimental-strip-types --experimental-loader ./tests/cloudflare-loader.mjs --test tests/admin-bulk-foundation.test.mjs tests/admin-bulk-execution.test.mjs tests/admin-bulk-v2.test.mjs
      - name: Production build
        run: npm run build
      - name: Configure CI-only local PII keys
        run: |
          encryption_key="$(printf '%s' '0123456789abcdef0123456789abcdef' | base64 -w0 | tr -d '=')"
          hash_key="$(printf '%s' 'fedcba9876543210fedcba9876543210' | base64 -w0 | tr -d '=')"
          printf 'PII_ENCRYPTION_KEY=%s\nPII_HASH_KEY=%s\n' "$encryption_key" "$hash_key" > .dev.vars
      - name: Apply required migrations to isolated local D1 only
        run: |
          mv drizzle/0038_adoption_staging_data.sql /tmp/0038_adoption_staging_data.sql
          mv drizzle/0039_activate_canonical_adoptions.sql /tmp/0039_activate_canonical_adoptions.sql
          trap 'mv /tmp/0038_adoption_staging_data.sql drizzle/0038_adoption_staging_data.sql; mv /tmp/0039_activate_canonical_adoptions.sql drizzle/0039_activate_canonical_adoptions.sql' EXIT
          npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.json --persist-to .wrangler/state
      - name: Seed ADMIN-2E article fixtures into isolated local D1 only
        run: npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/article-admin-bulk-e2e.sql
      - name: Start isolated local app
        run: |
          mkdir -p .e2e-artifacts/admin-article-bulk
          nohup npm exec vite -- --host 127.0.0.1 > .e2e-artifacts/admin-article-bulk/server.log 2>&1 &
          echo $! > .e2e-artifacts/admin-article-bulk/server.pid
          ready=0
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://localhost:5173/admin >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -200 .e2e-artifacts/admin-article-bulk/server.log
            exit 1
          fi
      - name: Admin Articles bulk Playwright — desktop
        run: npx playwright test tests/e2e/admin-article-bulk-execution.spec.ts --project=desktop-chromium --workers=1 --retries=0
      - name: Reset ADMIN-2E fixtures for mobile
        run: npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file tests/fixtures/article-admin-bulk-e2e.sql
      - name: Admin Articles bulk Playwright — mobile
        run: npx playwright test tests/e2e/admin-article-bulk-execution.spec.ts --project=mobile-chromium --workers=1 --retries=0
      - name: Stop isolated local app
        if: always()
        run: |
          if [ -f .e2e-artifacts/admin-article-bulk/server.pid ]; then
            kill "$(cat .e2e-artifacts/admin-article-bulk/server.pid)" 2>/dev/null || true
          fi
      - name: Upload focused failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-article-bulk-failure-${{ github.run_attempt }}
          path: |
            .e2e-artifacts/admin-article-bulk/
            playwright-report/
            test-results/playwright/
          if-no-files-found: warn
          retention-days: 14
